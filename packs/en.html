    '.cst .eta .er b{font-family:Georgia,"Times New Roman",serif;font-size:19px;color:#a2352a;line-height:1.1}' +
    '.cst .eta .er i{font-style:normal;font-size:11.5px;color:#a89c8b}' +
    '.cst .verdict{margin-top:12px;padding:10px 12px;border-radius:10px;background:#fffdf7;border:1px solid #e6ded2;font-size:12.5px;line-height:1.7;color:#4a423b}' +
    '.cst .verdict b{color:#a2352a}' +
    '.cst .rows .r .b i.mid{background:#d9a39b}' +
    '.cst .rows .r .b i.forget{background:#8d8272}' +
    '.cst .goal{margin-top:6px}' +
    '.cst .goal .bar{height:10px;border-radius:6px;background:#efe9df;overflow:hidden}' +
    '.cst .goal .bar i{display:block;height:100%;background:#a2352a;border-radius:6px}' +
    '.cst .goal .top{display:flex;align-items:baseline;justify-content:space-between;margin-top:8px}' +
    '.cst .goal .top b{font-family:Georgia,"Times New Roman",serif;font-size:20px;color:#a2352a;line-height:1.2}' +
    '.cst .goal .top b i{font-style:normal;font-size:12px;color:#8d8272;font-family:inherit;margin-left:2px}' +
    '.cst .goal .top u{text-decoration:none;font-size:11.5px;color:#a89c8b}' +
    '@media (max-width:360px){.cst .chart .col b{font-size:9px}}';

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function store() {
    try { return JSON.parse(localStorage.getItem(SK) || '{}') || {}; } catch (e) { return {}; }
  }
  function cards() { return (window.__DATA__ && window.__DATA__.cards) || []; }
  function dayStr(off) {
    var d = new Date(); d.setHours(0, 0, 0, 0);
    d = new Date(d.getTime() + (off || 0) * DAY);
    var m = d.getMonth() + 1, dd = d.getDate();
    return d.getFullYear() + '-' + (m < 10 ? '0' + m : m) + '-' + (dd < 10 ? '0' + dd : dd);
  }
  function learned(rec) { return !!(rec && ((rec.all || 0) > 0 || (rec.n || 0) > 0)); }

  function stats() {
    var S = store(), c = S.c || {}, hist = S.st || {}, o = {};
    var cs = cards(), total = cs.length, lv = [0, 0, 0, 0, 0, 0, 0, 0], seen = 0, dueToday = 0;
    var now = Date.now(), endToday = new Date(); endToday.setHours(23, 59, 59, 999); var tEnd = endToday.getTime();
    var due7 = [0, 0, 0, 0, 0, 0, 0];
    cs.forEach(function (x) {
      var r = c[x.id], l = r && r.lv ? r.lv : 0;
      if (l < 0) l = 0; if (l > 7) l = 7;
      lv[l]++;
      if (l > 0) seen++;
      if (r && r.seen && r.due) {
        var diff = 0;
        if (r.due <= tEnd) diff = 0;
        else diff = Math.ceil((r.due - now) / DAY);
        if (diff >= 0 && diff <= 6) due7[diff]++;
        if (r.due <= now) dueToday++;
      }
    });
    o.total = total; o.lv = lv; o.seen = seen; o.dueToday = dueToday; o.due7 = due7;
    /* 近 14 天 */
    var d14 = [];
    for (var i = 13; i >= 0; i--) {
      var k = dayStr(-i), rec = hist[k] || {};
      d14.push({ k: k, off: -i, all: rec.all || 0, n: rec.n || 0, ok: rec.ok || 0 });
    }
    o.d14 = d14;
    /* 累计 / 连续 */
    var totalDays = 0, j;
    for (j in hist) if (hist.hasOwnProperty(j) && learned(hist[j])) totalDays++;
    var streak = 0, started = false;
    if (learned(hist[dayStr(0)])) { started = true; streak = 0; }
    for (var q = started ? 0 : 1; q <= 400; q++) {
      if (learned(hist[dayStr(-q)])) streak++; else break;
    }
    o.streak = streak; o.startToday = started; o.totalDays = totalDays;
    /* 28 天格子（4 行 7 列，从 27 天前到今天） */
    var g = [], maxAll = 1;
    d14.forEach(function (x) { if (x.all > maxAll) maxAll = x.all; });
    for (var w = 27; w >= 0; w--) {
      var rr = hist[dayStr(-w)] || {}, a = rr.all || 0;
      if (a > maxAll) maxAll = a;
      g.push({ off: -w, k: dayStr(-w), all: a, on: learned(rr) });
    }
    o.grid = g; o.maxAll = maxAll;
    o.mastered = lv[5] + lv[6] + lv[7];
    /* 今日计划：到期（含过期）+ 新卡剩余配额 */
    var tk = hist[dayStr(0)] || {};
    o.quota = (S.set && S.set.newPerDay) || 25;
    o.newToday = tk.n || 0;
    o.newLeft = Math.max(0, o.quota - o.newToday);
    o.todayAll = tk.all || 0;
    o.todayOk = tk.ok || 0;
    o.todayBad = tk.bad || 0;
    /* 考前够不够：距考试天数 + 未上过张数 + 最近 7 天新学速度 */
    o.unlearned = lv[0];
    o.exam = (S.set && S.set.exam) || '';
    o.daysLeft = -1;
    if (o.exam) {
      var ex = new Date(o.exam + 'T00:00:00'), td = new Date(); td.setHours(0, 0, 0, 0);
      if (!isNaN(ex.getTime())) o.daysLeft = Math.round((ex.getTime() - td.getTime()) / DAY);
    }
    var n7 = 0;
    for (var z = 7; z <= 13; z++) n7 += d14[z].n;
    o.avg7 = n7 / 7;
    o.needPerDay = o.daysLeft > 0 ? Math.ceil(o.unlearned / o.daysLeft) : 0;
    o.etaDays = o.avg7 > 0 ? Math.ceil(o.unlearned / o.avg7) : 0;
    /* 近 14 天认得率：记得 / 模糊 / 忘了，口径与首页一致（ok 计记得，bad 计忘了） */
    var kAll = 0, kOk = 0, kBad = 0;
    d14.forEach(function (x) {
      var r2 = hist[x.k] || {};
      kAll += r2.all || 0; kOk += r2.ok || 0; kBad += r2.bad || 0;
    });
    o.kAll = kAll; o.kOk = kOk; o.kBad = kBad;
    o.kFuzzy = Math.max(0, kAll - kOk - kBad);
    o.kRate = kAll ? Math.round(kOk / kAll * 100) : -1;
    /* 本周（周一起算）：按配额算周目标，进度用新学张数 */
    var td0 = new Date(); td0.setHours(0, 0, 0, 0);
    var wd = (td0.getDay() + 6) % 7;            /* 0=周一 … 6=周日 */
    var wStart = new Date(td0.getTime() - wd * DAY);
    o.weekWd = wd; o.weekLeft = 7 - wd;          /* 含今天还剩几天 */
    o.weekDays = wd + 1;
    var wN = 0, wAll = 0, wOk = 0;
    for (var wi = wd; wi >= 0; wi--) {
      var wk = dayStr(-wi), wr = hist[wk] || {};
      wN += wr.n || 0; wAll += wr.all || 0; wOk += wr.ok || 0;
    }
    o.weekN = wN; o.weekAll = wAll; o.weekOk = wOk;
    o.weekTarget = o.quota * 7;
    o.weekPct = o.weekTarget ? Math.min(100, Math.round(wN / o.weekTarget * 100)) : 0;
    o.weekRest = Math.max(0, o.weekTarget - wN);
    o.weekNeed = o.weekRest > 0 ? Math.ceil(o.weekRest / o.weekLeft) : 0;
    return o;
  }

  function entryText(o) {
    if (!o.startToday && !o.streak) return '还没有记录 · 背几张就会开始打卡';
    var t = '连续 ' + o.streak + ' 天';
    if (!o.startToday) t += '（今天还没打卡）';
    t += ' · 待复习 ' + o.dueToday + ' 张';
    return t;
  }

  function openReport() {
    var old = document.getElementById('cdaily');
    if (old) { old.parentNode.removeChild(old); return; }
    var o = stats();
    if (!o.total) return;
    var box = document.createElement('div');
    box.id = 'cdaily'; box.className = 'cst';
    box.innerHTML = '<div class="box"><div class="hd"><h3>学习报告</h3><button class="x">×</button></div><div class="bd"></div></div>';
    document.body.appendChild(box);
    var bd = box.querySelector('.bd');
    function close() { if (box.parentNode) box.parentNode.removeChild(box); }
    box.querySelector('.x').onclick = close;
    box.onclick = function (e) { if (e.target === box) close(); };

    var WD = ['日', '一', '二', '三', '四', '五', '六'], h = '';

    /* 0. 今天背什么：到期 + 新卡，一键开队列 */
    var planN = o.dueToday + o.newLeft;
    h += '<div class="blk"><div class="bt">今天背什么<span>到期先复习，再按配额上新课</span></div>' +
      '<div class="plan">' +
      '<div><b>' + o.dueToday + '</b><i>张到期</i></div>' +
      '<div><b>' + o.newLeft + '</b><i>张新卡</i></div>' +
      '<div><b>' + planN + '</b><i>张合计</i></div>' +
      '</div>';
    if (planN > 0) {
      h += '<button class="gobtn" data-plan="go">开始今天的 ' + planN + ' 张</button>';
    } else {
      h += '<button class="gobtn" disabled>今天这一轮已经背完</button>';
    }
    h += '<div class="note">新卡配额 ' + o.quota + ' 张，今天已上新 ' + o.newToday + ' 张；到期数含过期没做的。' +
      (o.todayAll ? '今天已作答 ' + o.todayAll + ' 张。' : '') +
      '</div></div>';

    /* 1.5 考前够不够 */
    if (o.daysLeft >= 0 && o.unlearned > 0) {
      var etaStr = '';
      if (o.etaDays > 0) {
        var ed = new Date(); ed.setHours(0, 0, 0, 0); ed = new Date(ed.getTime() + o.etaDays * DAY);
        etaStr = '按这个速度 ' + (ed.getMonth() + 1) + '/' + ed.getDate() + ' 过完' + (o.etaDays > o.daysLeft ? '，晚于考试' : '');
      }
      h += '<div class="blk"><div class="bt">考前够不够<span>按最近 7 天的速度估</span></div><div class="eta">' +
        '<div class="er"><em>距考试</em><b>' + o.daysLeft + ' 天</b><i>' + o.exam + '</i></div>' +
        '<div class="er"><em>还没上过</em><b>' + o.unlearned + ' 张</b><i>共 ' + o.total + ' 张</i></div>' +
        '<div class="er"><em>每天要背</em><b>' + o.needPerDay + ' 张</b><i>才够考前过一遍</i></div>' +
        '<div class="er"><em>最近 7 天</em><b>' + (o.avg7 ? Math.round(o.avg7 * 10) / 10 + ' 张/天' : '没上新课') + '</b><i>' +
          (etaStr || '') + '</i></div>' +
        '</div>';
      if (o.avg7 >= o.needPerDay) {
        var spare = Math.floor(o.avg7 * o.daysLeft) - o.unlearned;
        h += '<div class="verdict">按现在的速度，考前能把没上过的都过一遍；' +
          '<b>' + o.daysLeft + '</b> 天 × ' + (Math.round(o.avg7 * 10) / 10) + ' 张 ≈ <b>' +
          Math.floor(o.avg7 * o.daysLeft) + '</b> 张的容量，比要背的 ' + o.unlearned + ' 张' +
          (spare > 0 ? '多出 <b>' + spare + '</b> 张。' : '正好够。') + '</div>';
      } else if (o.avg7 > 0) {
        h += '<div class="verdict">照现在的速度赶不上：每天得再多上 <b>' + (o.needPerDay - Math.round(o.avg7)) +
          '</b> 张，或者把配额从 ' + o.quota + ' 调上去。</div>';
      } else {
        h += '<div class="verdict">最近七天还没上新课。要考前过一遍，每天得开 <b>' + o.needPerDay + '</b> 张新卡。</div>';
      }
      h += '</div>';
    }

    /* 0.5 本周目标 */
    h += '<div class="blk"><div class="bt">本周目标<span>周一起算，按每日配额 × 7 天</span></div><div class="goal">' +
      '<div class="bar"><i style="width:' + o.weekPct + '%"></i></div>' +
      '<div class="top"><b>' + o.weekN + '<i> 张</i></b><u>目标 ' + o.weekTarget + ' 张 · 已完成 ' + o.weekPct + '%</u></div>' +
      '<div class="note">本周已作答 ' + o.weekAll + ' 张（含复习），新学 ' + o.weekN + ' 张；本周一到现在共 ' + o.weekDays + ' 天。' +
      (o.weekRest > 0
        ? (o.weekLeft > 1
            ? '还剩 ' + o.weekLeft + ' 天（含今天），每天再上 <b>' + o.weekNeed + '</b> 张就够。'
            : '这周就剩今天了，还差 <b>' + o.weekRest + '</b> 张，补上才达标。')
        : '本周已经达成，超出 ' + (o.weekN - o.weekTarget) + ' 张。') +
      '</div></div></div>';

    /* 1. 打卡 */
    h += '<div class="blk"><div class="bt">打卡<span>今天有作答就算打卡</span></div>' +
      '<div class="streak"><div><div class="numbig">' + o.streak + '<i>天</i></div>' +
      '<div class="sub">连续' + (o.startToday ? '（今天已打卡）' : '（今天还没打卡）') + '</div></div>' +
      '<div><div class="numbig">' + o.totalDays + '<i>天</i></div><div class="sub">累计学习</div></div></div>';
    h += '<div class="week" style="margin-top:12px">' + WD.map(function (x) { return '<span>' + x + '</span>'; }).join('') + '</div>';
    h += '<div class="grid">';
    o.grid.forEach(function (g) {
      var cls = 'cell';
      if (g.all > 0) cls += g.all >= Math.max(10, o.maxAll * 0.6) ? ' on2' : ' on';
      if (g.off === 0) cls += ' today';
      h += '<div class="' + cls + '" title="' + g.k + ' · ' + g.all + ' 张"></div>';
    });
    h += '</div><div class="note">最近 28 天，深色＝那天答得多；今天那一格带红框。</div></div>';

    /* 2. 近两周作答 */
    var mx = 0;
    o.d14.forEach(function (x) { if (x.all > mx) mx = x.all; });
    h += '<div class="blk"><div class="bt">近两周作答<span>' + (mx ? '柱高＝当天作答张数，最多 ' + mx : '还没有记录') + '</span></div>';
    if (mx) {
      h += '<div class="chart">';
      o.d14.forEach(function (x, i) {
        var pct = Math.round(x.all / mx * 100);
        /* 14 根柱子，标签隔一天给一个，末端给「今天」，避免挤成一团 */
        var lbl = i === 13 ? '今天' : (i % 2 === 0 ? Number(x.k.slice(5, 7)) + '/' + Number(x.k.slice(8, 10)) : '');
        h += '<div class="col"><i style="height:' + Math.max(1, pct) + '%' + (x.all ? '' : ';background:#ded5c8') + '"></i><b>' + lbl + '</b></div>';
      });
      h += '</div><div class="note">今天 ' + o.d14[13].all + ' 张，其中新学 ' + o.d14[13].n + ' 张；没作答的日子柱子只剩一道浅线。</div>';
    } else {
      h += '<div class="note">今天 ' + o.d14[13].all + ' 张。开始背之后，这里会按天统计作答量。</div>';
    }
    h += '</div>';

    /* 2.5 认得率 */
    h += '<div class="blk"><div class="bt">认得率<span>近 14 天，记得 / 模糊 / 忘了</span></div>';
    if (o.kAll) {
      var pOk = Math.round(o.kOk / o.kAll * 100), pBad = Math.round(o.kBad / o.kAll * 100),
          pFz = Math.max(0, 100 - pOk - pBad), a = o.d14.filter(function (x) { return x.all > 0; }).length;
      h += '<div class="rows">' +
        '<div class="r"><em>记得</em><div class="b"><i style="width:' + Math.max(pOk ? 3 : 0, pOk) + '%"></i></div><u>' + pOk + '%</u></div>' +
        '<div class="r"><em>模糊</em><div class="b"><i class="mid" style="width:' + Math.max(pFz ? 3 : 0, pFz) + '%"></i></div><u>' + pFz + '%</u></div>' +
        '<div class="r"><em>忘了</em><div class="b"><i class="forget" style="width:' + Math.max(pBad ? 3 : 0, pBad) + '%"></i></div><u>' + pBad + '%</u></div>' +
        '</div><div class="note">' + a + ' 天有作答，共 ' + o.kAll + ' 张：记得 ' + o.kOk + ' 张、模糊 ' + o.kFuzzy +
        ' 张、忘了 ' + o.kBad + ' 张。' +
        (pBad >= 15 ? '忘的比例偏高，先把配额降一点回炉，别硬上新卡。' :
          (pOk >= 70 ? '记得住，配额可以维持甚至往上加。' : '凑合，模糊的那批挑出来再背一轮更稳。')) +
        '</div>';
    } else {
      h += '<div class="note">近两周还没有作答记录。</div>';
    }
    h += '</div>';

    /* 3. 记忆持久度 */
    h += '<div class="blk"><div class="bt">记忆持久度<span>背到 5 档以上算记牢，掉档就是忘了</span></div>';
    h += '<div class="rows">';
    var names = ['没背过', '刚背过', '2 天', '4 天', '7 天', '15 天', '30 天', '60 天'];
    for (var l = 0; l <= 7; l++) {
      var n = o.lv[l], w = o.total ? Math.round(n / o.total * 100) : 0;
      /* 未学那一档用灰色，别拿红条占满屏，显得像已经背了很多 */
      h += '<div class="r"><em>' + (l === 0 ? '未学' : 'lv' + l) + '</em>' +
        '<div class="b"><i class="' + (l === 0 || !n ? 'zero' : '') + '" style="width:' + Math.max(l === 0 ? w : (n ? 3 : 0), w) + '%"></i></div>' +
        '<u>' + n + '</u></div>';
      h += '<div class="note" style="margin:2px 0 0 54px;font-size:10.5px">' + names[l] + (l === 0 ? '' : ' · 间隔 ' + [0, 1, 2, 4, 7, 15, 30, 60][l] + ' 天') + '</div>';
    }
    h += '</div><div class="note">记牢（lv5 以上）' + o.mastered + ' 张 / 全部 ' + o.total + ' 张，已开始背 ' + o.seen + ' 张。</div></div>';

    /* 4. 未来七天 */
    var mx7 = 0;
    o.due7.forEach(function (x) { if (x > mx7) mx7 = x; });
    h += '<div class="blk"><div class="bt">未来七天复习<span>按到期日排，今天含已过期的</span></div>';
    if (mx7 > 0) {
      h += '<div class="chart seven">';
      var now = new Date();
      for (var d = 0; d <= 6; d++) {
        var dt = new Date(now.getTime() + d * DAY);
        var lbl = d === 0 ? '今天' : (dt.getMonth() + 1) + '/' + dt.getDate();
        h += '<div class="col"><i style="height:' + Math.max(1, Math.round(o.due7[d] / mx7 * 100)) + '%' +
          (o.due7[d] ? '' : ';background:#ded5c8') + '"></i><b>' + lbl + '</b></div>';
      }
      h += '</div>';
    }
    h += '<div class="note">今天到期 ' + o.dueToday + ' 张；明天 ' + o.due7[1] + ' 张、后天 ' + o.due7[2] + ' 张。' +
      (o.dueToday + o.due7[1] + o.due7[2] ? '到期多就先只做复习，不追新卡。' : '这几天没有到期的卡，可以安心上新卡。') + '</div></div>';

    bd.innerHTML = h;
    var go = bd.querySelector('[data-plan="go"]');
    if (go) go.onclick = function () {
      close();
      var btn = document.querySelector('#app [data-act="daily"]');
      if (btn) { btn.click(); return; }
      location.hash = '#/';
    };
  }

  /* 首页「今日」面板下面挂入口 */
  function mount() {
    if (location.hash !== '#/' && location.hash !== '' && location.hash !== '#') return;
    var wrap = document.querySelector('#app .wrap');
    if (!wrap || wrap.querySelector('#dailybtn')) return;
    var o = stats();
    if (!o.total) return;
    var box = document.createElement('div');
    box.id = 'dailybtn';
    box.innerHTML = '<div class="panel" style="padding:4px 14px;margin:10px 0 0"><div class="glist">' +
      '<button class="grow" data-cdaily="1"><div class="gt"><b>学习报告</b><small>' + esc(entryText(o)) +
      '</small></div><div class="gp">看</div></button></div></div>';
    box.addEventListener('click', function (e) {
      var b = e.target.closest('[data-cdaily]');
      if (!b) return;
      e.preventDefault(); e.stopPropagation(); openReport();
    });
    var today = wrap.querySelector('.panel.today');
    if (today && today.parentNode) today.parentNode.insertBefore(box, today.nextSibling);
    else wrap.insertBefore(box, wrap.firstChild);
  }
  function tick() {
    try { mount(); } catch (e) { }
  }
  function init() {
    try {
      var st = document.createElement('style');
      st.textContent = CSS;
      document.head.appendChild(st);
    } catch (e) { }
    var app = document.getElementById('app');
    if (!app) return;
    try {
      var t = null;
      new MutationObserver(function () { clearTimeout(t); t = setTimeout(tick, 40); })
        .observe(app, { childList: true, subtree: true });
    } catch (e) { }
    document.addEventListener('hashchange', function () { setTimeout(tick, 90); });
    tick();
  }
  window.__dreport = openReport;
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();

</script>
<script>
/* 「我的 → 设置」每日新卡上限：五个预设档之外再给一个自定义入口
   改的是程序自己那份存档（ky_zw_v1），走程序自己的 setn，不另存第二份设置 */
(function () {
  'use strict';
  var QCSS = '' +
    '.qrow{display:flex;align-items:center;gap:6px;margin-top:9px;flex-wrap:nowrap}' +
    '.qrow input{width:64px;flex:none;border:1px solid #e2dcd2;border-radius:9px;padding:7px 8px;font-size:13px;' +
      'background:#fffdf8;color:#2b2320;font-family:Georgia,serif;-webkit-appearance:none;margin:0}' +
    '.qrow .qstep{flex:none;width:34px;border:1px solid #e2dcd2;border-radius:9px;background:#fffdf8;color:#5f574c;' +
      'font-size:13px;padding:7px 0;line-height:1}' +
    '.qrow .qbtn{flex:none;border:1px solid #a2352a;border-radius:9px;background:#a2352a;color:#fdf8f0;font-size:13px;padding:7px 12px}' +
    '.qhint{font-size:11.5px;color:#a89c8b;line-height:1.65;margin-top:6px}' +
    '.qhint b{color:#a2352a;font-weight:600}' +
    '@media (max-width:360px){.qrow input{width:56px}.qrow .qbtn{padding:7px 9px;font-size:12.5px}}';
  var QPRESET = [10, 20, 25, 30, 40], qSty = false;

  function qToast(t) {
    var el = document.getElementById('toast');
    if (!el) { el = document.createElement('div'); el.id = 'toast'; document.body.appendChild(el); }
    el.textContent = t; el.classList.add('show');
    clearTimeout(el._qt);
    el._qt = setTimeout(function () { el.classList.remove('show'); }, 2000);
  }
  function qCur() {
    try {
      var S = JSON.parse(localStorage.getItem('ky_zw_v1') || '{}') || {};
      return (S.set && S.set.newPerDay) || 25;
    } catch (e) { return 25; }
  }
  /* 借用程序自己的 setn：同一份存档、同一套重绘 */
  function qApply(v) {
    var app = document.getElementById('app');
    if (!app) { location.reload(); return; }
    var b = document.createElement('button');
    b.type = 'button'; b.style.display = 'none';
    b.setAttribute('data-act', 'setn'); b.setAttribute('data-arg', String(v));
    app.appendChild(b); b.click();
    setTimeout(function () { if (b.parentNode) b.parentNode.removeChild(b); }, 0);
  }

  function mountQuota() {
    if (location.hash !== '#/mine') return;
    var wrap = document.querySelector('#app .wrap');
    if (!wrap || wrap.querySelector('#qCustomRow')) return;
    var f = null, fs = wrap.querySelectorAll('.field'), i;
    for (i = 0; i < fs.length; i++) {
      var lb = fs[i].querySelector('label');
      if (lb && lb.textContent.indexOf('每日新卡上限') >= 0) { f = fs[i]; break; }
    }
    if (!f) return;
    if (!qSty) {
      var st = document.createElement('style');
      st.textContent = QCSS; document.head.appendChild(st); qSty = true;
    }
    var cur = qCur(), row = document.createElement('div');
    row.id = 'qCustomRow'; row.className = 'qrow';
    row.innerHTML = '<input id="qCustomIn" type="number" min="1" max="200" step="1" inputmode="numeric" value="' + cur + '">' +
      '<button class="qstep" type="button" data-q="-5">−5</button>' +
      '<button class="qstep" type="button" data-q="5">+5</button>' +
      '<button class="qbtn" type="button" data-q="set">设为每日</button>';
    var chips = f.querySelector('.chips');
    if (chips && chips.parentNode) chips.parentNode.insertBefore(row, chips.nextSibling);
    else f.appendChild(row);

    var hint = document.createElement('div');
    hint.className = 'qhint';
    hint.innerHTML = '现在每天上 <b>' + cur + ' 张</b>' +
      (QPRESET.indexOf(cur) < 0 ? '（自定义档，不在上面五个里）' : '') +
      '；填 1–200 之间的整数，改完「今天背什么」「本周目标」「考前够不够」三块一起跟着变。';
    if (row.parentNode) row.parentNode.insertBefore(hint, row.nextSibling);

    row.addEventListener('click', function (e) {
      var b = e.target.closest('[data-q]');
      if (!b) return;
      e.preventDefault(); e.stopPropagation();
      var inp = document.getElementById('qCustomIn');
      var v = parseInt(inp.value, 10);
      var k = b.getAttribute('data-q');
      if (k !== 'set') v = (isNaN(v) ? qCur() : v) + parseInt(k, 10);
      if (!(v >= 1 && v <= 200)) { qToast('填 1–200 之间的整数'); inp.value = qCur(); return; }
      inp.value = v; qApply(v); qToast('已改为每天 ' + v + ' 张');
    });
  }

  function tick() { try { mountQuota(); } catch (e) { } }
  function init() {
    var app = document.getElementById('app');
    if (!app) return;
    try {
      var t = null;
      new MutationObserver(function () { clearTimeout(t); t = setTimeout(tick, 40); })
        .observe(app, { childList: true, subtree: true });
    } catch (e) { }
    document.addEventListener('hashchange', function () { setTimeout(tick, 90); });
    tick();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();

<script>
/* 学习时长：只算在卡面上的时间（背卡 #/s、单卡 #/c/*）
   自己的存档键 ky_zw_clock，不碰程序那份 ky_zw_v1；超过 2 分钟不动就暂停计数
   1.3.9：加「每天背多久」目标 + 报告里的本周时长目标 + 首页今日面板一行时长 */
(function () {
  'use strict';
  var CK = 'ky_zw_clock', TICK = 10, IDLE = 120, GOAL_DEF = 30, GOAL_MIN = 5, GOAL_MAX = 240;

  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function dayStr(off) {
    var d = new Date(); d.setHours(0, 0, 0, 0);
    d = new Date(d.getTime() + (off || 0) * 86400000);
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function load() {
    try {
      var o = JSON.parse(localStorage.getItem(CK) || '{}');
      if (!o || !o.d) return { v: 1, d: {} };
      return o;
    } catch (e) { return { v: 1, d: {} }; }
  }
  function save(o) {
    try { localStorage.setItem(CK, JSON.stringify(o)); } catch (e) { }
  }
  function goal() {
    var g = parseInt(load().g, 10);
    return g >= GOAL_MIN && g <= GOAL_MAX ? g : GOAL_DEF;
  }
  function setGoal(n) {
    var o = load();
    o.g = n; o.t = Date.now();
    save(o);
  }
  function addSec(n) {
    if (n <= 0) return;
    var o = load(), k = dayStr(0);
    o.d[k] = (o.d[k] || 0) + n;
    o.t = Date.now();
    save(o);
  }
  function onCard() {
    var h = location.hash || '';
    return h === '#/s' || h.indexOf('#/c/') === 0;
  }
  function active() {
    if (document.visibilityState && document.visibilityState !== 'visible') return false;
    if (!onCard()) return false;
    return Date.now() - lastAct < IDLE * 1000;
  }

  var lastAct = Date.now(), lastTick = Date.now(), timer = null, pending = 0;

  function flush() {
    if (pending > 0) { addSec(pending); pending = 0; }
  }
  function beat() {
    var now = Date.now(), dt = Math.round((now - lastTick) / 1000);
    lastTick = now;
    /* 心跳按秒累计，最长一次补 12 秒，防止后台挂起时一次补一大段 */
    if (active()) pending += Math.min(dt, TICK + 2);
    if (pending >= TICK) flush();
  }
  function start() {
    if (timer) return;
    lastTick = Date.now();
    timer = setInterval(beat, TICK * 1000);
  }
  function stop() {
    beat();
    flush();
    if (timer) { clearInterval(timer); timer = null; }
  }
  ['pointerdown', 'touchstart', 'keydown', 'click', 'scroll'].forEach(function (t) {
    document.addEventListener(t, function () { lastAct = Date.now(); if (onCard()) start(); }, true);
  });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') { lastAct = Date.now(); lastTick = Date.now(); if (onCard()) start(); }
    else stop();
  });
  window.addEventListener('hashchange', function () {
    if (onCard()) { lastAct = Date.now(); lastTick = Date.now(); start(); }
    else stop();
  });
  window.addEventListener('pagehide', function () { beat(); flush(); });
  if (onCard()) start();

  /* ---- 数字与文案 ---- */
  function fmt(sec) {
    sec = Math.round(sec);
    if (sec < 60) return (sec || 0) + ' 秒';
    var m = Math.round(sec / 60);
    if (m < 60) return m + ' 分钟';
    return Math.floor(m / 60) + ' 小时 ' + (m % 60 ? (m % 60) + ' 分钟' : '整');
  }
  function mins(sec) { return Math.round(sec / 60); }
  function weekKeys() {
    var idx = (new Date().getDay() + 6) % 7, i, keys = [];
    for (i = 0; i <= idx; i++) keys.push(dayStr(-(idx - i)));
    return keys;
  }
  function stats() {
    var d = load().d || {}, g = goal(), i, k, v, today = d[dayStr(0)] || 0;
    var sum = 0, days = 0, maxK = '', maxV = 0;
    for (i = 6; i >= 0; i--) {
      k = dayStr(-i); v = d[k] || 0;
      if (v > 0) days++;
      sum += v;
      if (v > maxV) { maxV = v; maxK = k; }
    }
    var wk = weekKeys(), week = 0;
    for (i = 0; i < wk.length; i++) week += (d[wk[i]] || 0);
    return { today: today, sum: sum, days: days, maxK: maxK, maxV: maxV, g: g, week: week, left: 7 - wk.length, wdays: wk.length };
  }

  /* ---- 学习报告里插一块「学习时长」 ---- */
  function block() {
    var s = stats(), weekTarget = s.g * 7, weekMin = mins(s.week);
    var pct = Math.min(100, Math.round(s.week / (weekTarget * 60) * 100));
    var h = '<div class="blk" id="clockblk"><div class="bt">学习时长<span>只算卡面停留，2 分钟不动就暂停</span></div>';
    if (!s.sum) {
      h += '<div class="note">还没开始计时（今天目标 ' + s.g + ' 分钟）。在背卡或单卡页停一会儿，这里就会记下来。</div></div>';
      return h;
    }
    var td = s.today >= s.g * 60
      ? '今天已到 ' + s.g + ' 分钟，超出 ' + Math.max(0, mins(s.today - s.g * 60)) + ' 分钟'
      : '今天目标 ' + s.g + ' 分钟，还差 ' + Math.max(1, mins(s.g * 60 - s.today)) + ' 分钟';
    h += '<div class="streak">' +
      '<div><div class="numbig">' + fmt(s.today) + '</div><div class="sub">今天</div></div>' +
      '<div><div class="numbig">' + fmt(Math.round(s.sum / 7)) + '</div><div class="sub">最近 7 天日均</div></div>' +
      '</div>';
    h += '<div class="goal"><div class="bar"><i style="width:' + pct + '%"></i></div>' +
      '<div class="top"><b>' + weekMin + '<i> 分钟</i></b><u>本周目标 ' + weekTarget + ' 分钟 · 已完成 ' + pct + '%</u></div>' +
      '<div class="note">' + (weekMin
        ? (s.week >= weekTarget * 60
            ? '本周时长已经达成，超出 ' + (weekMin - weekTarget) + ' 分钟。'
            : (s.left > 1
                ? '周一起算，本周已停 ' + weekMin + ' 分钟；还剩 ' + s.left + ' 天（含今天），每天再 <b>' + Math.max(1, Math.ceil((weekTarget - weekMin) / s.left)) + '</b> 分钟就够。'
                : '这周就剩今天了，还差 <b>' + (weekTarget - weekMin) + '</b> 分钟，补上才达标。'))
        : '周一起算，本周还没在卡面上停过。') + '</div></div>';
    h += '<div class="note">' + td + '；最近 7 天累计 ' + fmt(s.sum) + '，其中 ' + s.days + ' 天有记录' +
      (s.maxV ? '；最久的一天是 ' + Number(s.maxK.slice(5, 7)) + '/' + Number(s.maxK.slice(8, 10)) + '（' + fmt(s.maxV) + '）' : '') +
      '。计时只在本机算，换手机会从零开始。</div></div>';
    return h;
  }
  function slot() { return String(Math.floor(Date.now() / 30000)); }
  function mountClock() {
    var box = document.getElementById('cdaily');
    if (!box) return;
    var bd = box.querySelector('.bd');
    if (!bd) return;
    var old = bd.querySelector('#clockblk');
    if (old) {
      /* 报告开着的时候时长还在走，30 秒换一次数字 */
      if (old.getAttribute('data-t') === slot()) return;
      old.outerHTML = block();
      var nw = bd.querySelector('#clockblk');
      if (nw) nw.setAttribute('data-t', slot());
      return;
    }
    bd.insertAdjacentHTML('beforeend', block());
    var n2 = bd.querySelector('#clockblk');
    if (n2) n2.setAttribute('data-t', slot());
  }

  /* ---- 首页今日面板：一行时长 ---- */
  function line() {
    var s = stats();
    if (!s.today) return '今天还没在卡面上停过 · 目标 ' + s.g + ' 分钟';
    return '今天在卡面上 ' + fmt(s.today) + (s.today >= s.g * 60
      ? ' · 已到 ' + s.g + ' 分钟'
      : ' · 还差 ' + Math.max(1, mins(s.g * 60 - s.today)) + ' 分钟到 ' + s.g + ' 分钟');
  }
  function mountHome() {
    var p = document.querySelector('#app .panel.today');
    if (!p) return;
    var old = p.querySelector('#clockhome'), t = line();
    if (old) {
      if (old.innerHTML !== t) old.innerHTML = t;
      return;
    }
    var note = p.querySelector('.note');
    var el = document.createElement('div');
    el.id = 'clockhome';
    el.className = 'note';
    el.style.marginTop = '9px';
    el.innerHTML = t;
    if (note && note.parentNode) note.parentNode.insertBefore(el, note);
    else p.appendChild(el);
  }

  /* ---- 设置：每天背多久 ---- */
  var CSS = '.cgrow{display:flex;gap:8px;align-items:center;margin-top:8px}' +
    '.cgrow input{flex:1;min-width:0;height:34px;border:1px solid #e2dcd2;border-radius:9px;background:#fffdf8;' +
    'padding:0 10px;font-size:16px;color:#2b2320;font-family:Georgia,"Times New Roman",serif;text-align:center}' +
    '.cgrow button{flex:none;height:34px;padding:0 12px;border:1px solid #e2dcd2;border-radius:9px;background:#fffdf8;color:#4a423b;font-size:13px}' +
    '.cgrow button.on{border-color:#2b2320;color:#faf7ef;background:#2b2320}' +
    '.cgrow .cgset{background:#2b2320;color:#faf7ef;border-color:#2b2320}' +
    '.cgr{font-size:12px;color:#8d8272;margin-top:6px;line-height:1.6}';
  function styleOnce() {
    if (document.getElementById('cgstyle')) return;
    var st = document.createElement('style');
    st.id = 'cgstyle'; st.textContent = CSS;
    document.head.appendChild(st);
  }
  function chipsHtml() {
    var g = goal(), arr = [20, 30, 45, 60];
    if (arr.indexOf(g) < 0) arr.push(g);
    arr.sort(function (a, b) { return a - b; });
    return '<div class="chips">' + arr.map(function (x) {
      return '<button class="tag ' + (g === x ? 'on' : '') + '" data-cg="' + x + '">' + x + ' 分钟</button>';
    }).join('') + '</div>';
  }
  function refreshField(f) {
    var g = goal(), c = f.querySelector('.chips');
    if (c) c.outerHTML = chipsHtml();
    var inp = f.querySelector('#cgIn');
    if (inp) inp.value = g;
    var r = f.querySelector('.cgr');
    if (r) r.innerHTML = '现在每天记 <b>' + g + ' 分钟</b>，本周目标 ' + (g * 7) + ' 分钟（周一起算）。只影响学习报告里的时长目标，不改每日张数。';
  }
  function applyGoal(n, f) {
    if (!(n >= GOAL_MIN && n <= GOAL_MAX)) {
      var r = f.querySelector('.cgr');
      if (r) r.innerHTML = '填 ' + GOAL_MIN + '–' + GOAL_MAX + ' 之间的整数分钟；已退回 ' + goal() + ' 分钟。';
      var inp = f.querySelector('#cgIn');
      if (inp) inp.value = goal();
      return;
    }
    setGoal(n);
    refreshField(f);
    var ob = document.querySelector('#clockblk');
    if (ob) ob.removeAttribute('data-t');
    mountClock(); mountHome();
  }
  function mountField() {
    if (location.hash !== '#/mine') return;
    var wrap = document.querySelector('#app .wrap');
    if (!wrap || wrap.querySelector('#clockgoal')) return;
    var fields = wrap.querySelectorAll('.field'), anchor = null, i;
    for (i = 0; i < fields.length; i++) {
      var lab = fields[i].querySelector('label');
      if (lab && lab.textContent.indexOf('每日新卡上限') >= 0) { anchor = fields[i]; break; }
    }
    if (!anchor) return;
    styleOnce();
    var f = document.createElement('div');
    f.className = 'field'; f.id = 'clockgoal';
    f.innerHTML = '<label>每天背多久（分钟）</label>' + chipsHtml() +
      '<div class="cgrow"><button type="button" data-cg="-5">−5</button>' +
      '<input id="cgIn" type="number" inputmode="numeric" min="' + GOAL_MIN + '" max="' + GOAL_MAX + '" step="1" value="' + goal() + '">' +
      '<button type="button" data-cg="5">+5</button><button type="button" class="cgset">存下</button></div>' +
      '<div class="cgr"></div>';
    anchor.parentNode.insertBefore(f, anchor.nextSibling);
    refreshField(f);
    f.addEventListener('click', function (e) {
      var b = e.target.closest('[data-cg]');
      if (b) {
        e.preventDefault(); e.stopPropagation();
        var v = b.getAttribute('data-cg');
        if (v === '-5' || v === '5') {
          var cur = parseInt(f.querySelector('#cgIn').value, 10);
          if (!(cur >= GOAL_MIN && cur <= GOAL_MAX)) cur = goal();
          applyGoal(cur + parseInt(v, 10), f);
        } else {
          applyGoal(parseInt(v, 10), f);
        }
        return;
      }
      if (e.target.closest('.cgset')) {
        e.preventDefault(); e.stopPropagation();
        applyGoal(parseInt(f.querySelector('#cgIn').value, 10), f);
      }
    });
  }

  /* ---- 统一挂载 ---- */
  function watch() {
    try {
      new MutationObserver(function () { mountClock(); mountHome(); mountField(); }).observe(document.body, { childList: true, subtree: true });
    } catch (e) { }
    mountClock(); mountHome(); mountField();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', watch);
  else watch();
  setInterval(function () { mountClock(); mountHome(); }, 30000);
})();

<script>
/* 背卡辅助：读音 / 自动朗读 / 勾出句子骨架
   只动显示层（背卡会话 #/s、单卡页 #/c/…），不改程序的数据与排期
   设置存自己的存档键 ky_zw_read = {v:1, auto:0, skel:1} */
(function () {
  'use strict';
  var RK = 'ky_zw_read', lastQ = '', lastA = '';

  function load() {
    try {
      var o = JSON.parse(localStorage.getItem(RK) || '{}');
      if (!o || o.v !== 1) return { v: 1, auto: 0, skel: 1, rate: 0.92 };
      if (typeof o.auto !== 'number') o.auto = 0;
      if (typeof o.skel !== 'number') o.skel = 1;
      if (typeof o.rate !== 'number') o.rate = 0.92;
      return o;
    } catch (e) { return { v: 1, auto: 0, skel: 1, rate: 0.92 }; }
  }
  function save(o) {
    o.v = 1;
    try { localStorage.setItem(RK, JSON.stringify(o)); } catch (e) { }
  }

  /* ---- 读音 ---- */
  function speechText(s) {
    /* 占位词（主题词 / 年份）不念中文，统一读成 X，句子听着才顺 */
    return String(s || '').replace(/[\u4e00-\u9fff][\u4e00-\u9fff·、，]*/g, ' X ').replace(/[\u00b7]/g, ' ')
      .replace(/\s+/g, ' ').replace(/\s*X\s*(X\s*)+/g, ' X ').trim();
  }
  function canSpeak() { return !!window.speechSynthesis && typeof window.SpeechSynthesisUtterance === 'function'; }
  function speak(txt, rate) {
    if (!canSpeak() || !txt) return false;
    var s = speechText(txt);
    if (!/[A-Za-z]/.test(s)) return false;
    try {
      window.speechSynthesis.cancel();
      var u = new window.SpeechSynthesisUtterance(s);
      u.lang = 'en-US';
      u.rate = rate || 0.92;
      u.pitch = 1;
      var vs = window.speechSynthesis.getVoices() || [], v = null, i;
      for (i = 0; i < vs.length; i++) {
        if (/^en(-|_)?(US|GB|AU)?/i.test(vs[i].lang || vs[i].language || '')) { v = vs[i]; break; }
      }
      if (v) u.voice = v;
      window.speechSynthesis.speak(u);
      return true;
    } catch (e) { return false; }
  }

  /* ---- 骨架词 ---- */
  var WORDS = ['as a result', 'in addition', 'on the contrary', 'in contrast', 'for example', 'for instance',
    'in conclusion', 'to sum up', 'in short', 'in particular', 'compared with', 'rather than', 'instead of',
    'due to', 'thanks to', 'in terms of', 'not only', 'but also', 'the more', 'the less', 'at the same time',
    'however', 'therefore', 'thus', 'hence', 'moreover', 'furthermore', 'besides', 'consequently', 'meanwhile',
    'nevertheless', 'whereas', 'although', 'overall', 'illustrates', 'illustrate', 'shows', 'show', 'demonstrates',
    'demonstrate', 'indicates', 'indicate', 'reveals', 'reveal', 'suggests', 'suggest', 'reflects', 'reflect',
    'accounts for', 'constitutes', 'constitute', 'witnessed', 'experienced', 'saw', 'rose', 'rise', 'fell', 'fall',
    'increased', 'increase', 'decreased', 'decrease', 'remained', 'remain', 'fluctuated', 'fluctuate', 'grew', 'grow',
    'dropped', 'drop', 'climbed', 'climb', 'surged', 'surge', 'declined', 'decline', 'doubled', 'tripled'];
  var RE = new RegExp('(' + WORDS.map(function (w) {
    return w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/ /g, '\\s+');
  }).join('|') + ')', 'gi');

  function isLetter(c) { return c ? /[A-Za-z]/.test(c) : false; }
  function highlight(el) {
    var nodes = [], w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null, false), n;
    while ((n = w.nextNode())) {
      if (!n.nodeValue || !n.nodeValue.trim()) continue;
      if (n.parentNode && n.parentNode.closest && n.parentNode.closest('.zd-cl,.ph')) continue;
      nodes.push(n);
    }
    nodes.forEach(function (node) {
      var s = node.nodeValue, out = '', i = 0, m;
      RE.lastIndex = 0;
      while ((m = RE.exec(s))) {
        var st = m.index, ed = st + m[0].length;
        var pre = st > 0 ? s.charAt(st - 1) : '', post = ed < s.length ? s.charAt(ed) : '';
        var multi = /\s/.test(m[0]);
        if (!multi && (isLetter(pre) || isLetter(post))) continue;
        out += s.slice(i, st) + '[[[' + s.slice(st, ed) + ']]]';
        i = ed;
        if (i >= s.length) break;
      }
      if (!out) return;
      out += s.slice(i);
      var frag = document.createDocumentFragment(), parts = out.split(/\[\[\[|\]\]\]/), k;
      for (k = 0; k < parts.length; k++) {
        if (!parts[k]) continue;
        if (k % 2 === 1) {
          var sp = document.createElement('span');
          sp.className = 'zd-cl';
          sp.textContent = parts[k];
          frag.appendChild(sp);
        } else {
          frag.appendChild(document.createTextNode(parts[k]));
        }
      }
      if (node.parentNode) node.parentNode.replaceChild(frag, node);
    });
  }

  /* ---- 读音按钮 ---- */
  function addBtn(el) {
    var nx = el.nextElementSibling;
    if (nx && nx.getAttribute('data-zspk') === '1') { nx.setAttribute('data-src', el.textContent); return nx; }
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'zspk';
    b.setAttribute('data-zspk', '1');
    b.textContent = '读音';
    b.addEventListener('click', function (e) {
      e.preventDefault(); e.stopPropagation();
      if (!canSpeak()) { b.textContent = '这台手机不支持读音'; return; }
      var host = b.previousElementSibling;
      var ok = speak(host ? host.textContent : '', load().rate);
      b.textContent = ok ? '再读一遍' : '读不了';
      setTimeout(function () { b.textContent = '读音'; }, 1800);
    });
    if (el.parentNode) el.parentNode.insertBefore(b, el.nextSibling);
    return b;
  }

  /* ---- 设置 ---- */
  var CSS = '.zspk{display:inline-block;margin-top:7px;margin-bottom:2px;padding:0 9px;height:23px;line-height:21px;' +
    'border:1px solid #e2dcd2;border-radius:5px;background:#fbf8f1;color:#857a6c;font-size:11.5px;font-family:inherit;letter-spacing:.01em}' +
    '.zspk:active{background:#f1eae0}' +
    '.zd-cl{color:#8c2f24}' +
    '.zsr{display:flex;gap:8px;align-items:center;margin-top:9px;flex-wrap:wrap}' +
    '.zsr>span{font-size:12.5px;color:#6f655b}' +
    '.zsr input[type=range]{accent-color:#2b2320;background:none;border:none;padding:0;height:20px}' +
    '.zsr input[type=range]{flex:1;min-width:90px}' +
    '.zsr .zsrate{font-size:12px;color:#8d8272;min-width:46px;text-align:right}' +
    '.zsnote{font-size:12px;color:#8d8272;margin-top:6px;line-height:1.6}';
  function styleOnce() {
    if (document.getElementById('zsstyle')) return;
    var st = document.createElement('style');
    st.id = 'zsstyle'; st.textContent = CSS;
    document.head.appendChild(st);
  }
  function fieldHtml() {
    var o = load();
    return '<div class="chips">' +
      '<button class="tag ' + (o.auto ? '' : 'on') + '" data-zr="auto0">要读了才读</button>' +
      '<button class="tag ' + (o.auto ? 'on' : '') + '" data-zr="auto1">自动读一遍</button>' +
      '</div>' +
      '<div class="chips" style="margin-top:8px">' +
      '<button class="tag ' + (o.skel ? 'on' : '') + '" data-zr="skel1">勾出骨架</button>' +
      '<button class="tag ' + (o.skel ? '' : 'on') + '" data-zr="skel0">不勾</button>' +
      '</div>' +
      '<div class="zsr"><span>语速</span><input id="zsRate" type="range" min="60" max="120" step="1" value="' + Math.round((o.rate || 0.92) * 100) + '"><span class="zsrate">' + (o.rate || 0.92).toFixed(2) + '</span></div>' +
      '<div class="zsnote">读音用手机自带的英文朗读，不联网、不占流量；离线单文件也能用。骨架把连接词、表示升降的词勾成暗红，长句先看框架再背细节。</div>';
  }
  function refreshField(f) {
    f.innerHTML = '';
    var lab = document.createElement('label');
    lab.textContent = '背卡读音与骨架';
    f.appendChild(lab);
    var tmp = document.createElement('div');
    tmp.innerHTML = fieldHtml();
    while (tmp.firstChild) f.appendChild(tmp.firstChild);
    bindField(f);
  }
  function bindField(f) {
    f.onclick = function (e) {
      var b = e.target.closest('[data-zr]');
      if (!b) return;
      e.preventDefault(); e.stopPropagation();
      var v = b.getAttribute('data-zr'), o = load();
      if (v === 'auto0') o.auto = 0;
      else if (v === 'auto1') o.auto = 1;
      else if (v === 'skel1') o.skel = 1;
      else if (v === 'skel0') o.skel = 0;
      save(o);
      refreshField(f);
      run(true);
    };
    f.oninput = function (e) {
      if (!e.target || e.target.id !== 'zsRate') return;
      var o = load();
      o.rate = parseInt(e.target.value, 10) / 100;
      save(o);
      var lab = f.querySelector('.zsrate');
      if (lab) lab.textContent = o.rate.toFixed(2);
    };
  }
  function mountField() {
    if (location.hash !== '#/mine') return;
    var wrap = document.querySelector('#app .wrap');
    if (!wrap || wrap.querySelector('#zsread')) return;
    styleOnce();
    var f = document.createElement('div');
    f.className = 'field'; f.id = 'zsread';
    refreshField(f);
    var anchor = wrap.querySelector('#clockgoal');
    if (!anchor) {
      var fields = wrap.querySelectorAll('.field');
      for (var i = 0; i < fields.length; i++) {
        var lab = fields[i].querySelector('label');
        if (lab && lab.textContent.indexOf('每日新卡上限') >= 0) { anchor = fields[i]; break; }
      }
    }
    if (anchor && anchor.parentNode) anchor.parentNode.insertBefore(f, anchor.nextSibling);
    else wrap.appendChild(f);
  }

  /* ---- 主流程 ---- */
  function onPage() {
    var h = location.hash || '';
    return h === '#/s' || h.indexOf('#/c/') === 0;
  }
  function txt(el) { return el ? el.textContent.replace(/\s+/g, ' ').trim() : ''; }
  function run(force) {
    if (!onPage()) return;
    var o = load(), els = document.querySelectorAll('#app .q-en, #app .ce'), i, el;
    var ptxt = txt(document.querySelector('#app .ses-inner > .q-en'));
    for (i = 0; i < els.length; i++) {
      el = els[i];
      if (el.getAttribute('data-zs') === txt(el)) continue;
      el.setAttribute('data-zs', txt(el));
      /* 答案区那一行英文跟题面一模一样时不再挂按钮，一颗就够 */
      if (ptxt && txt(el) === ptxt && el.parentNode && el.parentNode.className === 'ans') {
        var nb = el.nextElementSibling;
        if (nb && nb.getAttribute('data-zspk') === '1') nb.parentNode.removeChild(nb);
        continue;
      }
      if (o.skel && !/^[\u4e00-\u9fff]/.test(txt(el))) highlight(el);
      if (/[A-Za-z]/.test(txt(el))) addBtn(el);
    }
    if (!o.auto) return;
    var q = document.querySelector('#app .ses-inner > .q-en') ||
      (location.hash.indexOf('#/c/') === 0 ? document.querySelector('#app .q-en') : null);
    var a = document.querySelector('#app .ans .q-en');
    var qt = txt(q), at = txt(a);
    if (qt && qt !== lastQ) { lastQ = qt; if (/[A-Za-z]/.test(qt)) setTimeout(function () { speak(qt, o.rate); }, 240); }
    if (at && at !== lastA && at !== qt) { lastA = at; if (/[A-Za-z]/.test(at)) setTimeout(function () { speak(at, o.rate); }, 320); }
  }
  var pending = false;
  function kick() {
    if (pending) return;
    pending = true;
    setTimeout(function () { pending = false; run(); }, 180);
  }
  function watch() {
    try {
      new MutationObserver(function () { kick(); mountField(); }).observe(document.body, { childList: true, subtree: true });
    } catch (e) { }
    styleOnce(); run(); mountField();
    window.addEventListener('hashchange', function () { lastQ = ''; lastA = ''; setTimeout(function () { run(); mountField(); }, 260); });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', watch);
  else watch();
})();

</script>

<style id="packShellCSS">
html.shell .nav{display:none!important}
html.shell body{padding-bottom:74px!important}
/* 嵌入态隐藏英语单科「已更新至 v1.3.10」横幅，版本统一由壳管理 */
html.shell #verbar{display:none!important}
/* 壳内返回键：悬浮在英语包顶栏左侧，标题右移避让 */
html.shell .hd{padding-left:54px!important}
html.shell #shellBack{position:fixed;left:10px;top:calc(env(safe-area-inset-top,0px) + 10px);
  width:36px;height:36px;border-radius:50%;z-index:60;padding:0;
  display:flex;align-items:center;justify-content:center;
  background:rgba(255,253,247,.78);box-shadow:0 2px 10px rgba(30,26,18,.13);
  color:#3a352b;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:0;cursor:pointer}
html.shell #shellBack svg{width:19px;height:19px}
html.shell #shellBack:active{transform:scale(.92)}
</style>
<script id="packBridge">
(function(){
  var SK='ky_zw_v1';
  /* 壳底栏 tab → 包内 hash */
  var MAP={today:'#/', words:'#/lib', drill:'#/test', home:'#/', lib:'#/lib', test:'#/test'};
  /* 包内 hash → 壳底栏 tab（反向，用于高亮同步） */
  var RMAP={'#/':'today','#/lib':'words','#/test':'drill'};
  function post(m){ try{ if(window.parent!==window) window.parent.postMessage(Object.assign({src:'pack'},m),'*'); }catch(e){} }
  /* 壳内返回键 */
  (function(){
    var b=document.createElement('button');
    b.id='shellBack'; b.setAttribute('aria-label','返回书库');
    b.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>';
    b.onclick=function(){ post({t:'back'}); };
    function mount(){ (document.body||document.documentElement).appendChild(b); }
    if(document.body) mount(); else document.addEventListener('DOMContentLoaded',mount);
  })();
  var embedded=(window.parent!==window);
  if(embedded) document.documentElement.classList.add('shell');
  function curTab(){
    var h=location.hash||'#/';
    if(h==='#/lib') return 'words';
    if(h==='#test'||h.indexOf('#/test')===0) return 'drill';
    if(h.indexOf('#/check')===0) return 'drill';
    if(RMAP[h]) return RMAP[h];
    /* 分组 / 卡片 / 会话等子页归到「今日」高亮 */
    return 'today';
  }
  function stat(){
    try{
      var D=(window.__DATA__||{}), cs=(D&&D.cards)||[];
      var st={}; try{ st=JSON.parse(localStorage.getItem(SK)||'{}')||{}; }catch(e){}
      var c=st.c||{}, seen=0;
      for(var i=0;i<cs.length;i++){ var r=c[cs[i].id]; if(r&&r.lv>0) seen++; }
      var due=cs.length-seen;
      post({t:'stat', pct: cs.length? Math.round(seen/cs.length*100):0, items:{recite:seen,total:cs.length,due:due}});
    }catch(e){}
  }
  window.addEventListener('message',function(e){
    if(typeof e.data!=='object'||e.data===null) return;
    var d=e.data||{}; if(d.src!=='shell') return;
    if(d.t==='tab'){ var h=MAP[d.id]; if(h!==undefined && location.hash!==h) location.hash=h; }
    /* theme 消息：原项目只有浅色、固定字号，显式忽略，不报错 */
  });
  /* 包内更新记录统一交给壳，不再显示单科旧版本面板 */
  window.showVerLog=function(){ post({t:'askMe'}); };
  /* 包内「我的」一律交给壳 */
  document.addEventListener('click',function(ev){
    var el=ev.target;
    while(el && el!==document){
      if(el.tagName==='A' && el.getAttribute('href')==='#/mine'){ ev.preventDefault(); ev.stopPropagation(); post({t:'askMe'}); return; }
      el=el.parentNode;
    }
  },true);
  window.addEventListener('hashchange',function(){
    if(!embedded) return;
    setTimeout(stat,120);
    var t=curTab(); if(t) post({t:'tab',id:t});
  });
  window.addEventListener('load',function(){
    if(!embedded) return;
    setTimeout(function(){
      post({t:'ready'});
      var t=curTab(); if(t) post({t:'tab',id:t});
      stat();
    },300);
    setInterval(stat,6000);
  });
})();
</script>
