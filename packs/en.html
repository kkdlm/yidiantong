<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
:root{
  --paper:#f4f1e8; --card:#fffdf7; --ink:#1f1d1a; --ink2:#413c33;
  --muted:#8b8375; --line:#ded6c5; --line2:#eae3d3;
  --red:#a2352a; --red-w:#f6e7e3; --green:#2f5a4d; --green-w:#e6efe9;
  --amber:#a3772a; --amber-w:#f7eed9; --blue:#3b5566;
}
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink)}
body{
  font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Source Han Sans SC",sans-serif;
  padding-bottom:calc(62px + env(safe-area-inset-bottom));
  overscroll-behavior-y:contain;
}
img,svg{max-width:100%}
h1,h2,h3,p,ul,ol{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
#app{max-width:560px;margin:0 auto;min-height:100vh;background:var(--paper)}

/* ---------- 顶栏 ---------- */
.hd{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
  gap:10px;padding:calc(14px + env(safe-area-inset-top)) 16px 10px;background:var(--paper);
  border-bottom:1px solid var(--line2);
}
.hd-t{font-size:17px;font-weight:600;letter-spacing:.5px}
.hd-s{font-size:12px;color:var(--muted);font-weight:400;margin-left:6px}
.hd-r{font-size:12px;color:var(--muted);white-space:nowrap}
.back{display:inline-flex;align-items:center;gap:4px;height:32px;padding:0 10px 0 0;font-size:14px;color:var(--ink2)}
.back:before{content:"";width:8px;height:8px;border-left:1.5px solid var(--ink2);border-bottom:1.5px solid var(--ink2);transform:rotate(45deg);margin-right:6px;margin-left:4px}

.wrap{padding:14px 16px 28px}
.sec-t{display:flex;align-items:baseline;justify-content:space-between;margin:22px 0 10px}
.sec-t h2{font-size:14px;font-weight:600;letter-spacing:.5px}
.sec-t span{font-size:11.5px;color:var(--muted)}

/* ---------- 卡片/面板 ---------- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px}
.pad{padding:14px 14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.k{font-size:13px;color:var(--muted)}
.v{font-size:13px;color:var(--ink2)}
.num{font-variant-numeric:tabular-nums}

/* 今日 */
.today{padding:16px 15px 14px;position:relative;overflow:hidden}
.today:before{content:"";position:absolute;left:0;top:0;width:3px;height:100%;background:var(--red)}
.today .big{display:flex;align-items:flex-end;gap:6px;margin:2px 0 2px}
.today .big b{font-size:34px;line-height:1;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.today .big i{font-style:normal;font-size:12px;color:var(--muted);padding-bottom:3px}
.tl{display:flex;gap:16px;margin-top:10px}
.tl div{font-size:12px;color:var(--muted)}
.tl b{display:block;font-size:16px;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.bar{height:4px;background:var(--line2);border-radius:2px;overflow:hidden;margin:12px 0 0}
.bar i{display:block;height:100%;background:var(--green);transition:width .25s}
.bar.r i{background:var(--red)}

/* 按钮 */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  height:46px;padding:0 16px;border-radius:8px;border:1px solid var(--line);
  background:var(--card);font-size:15px;font-weight:500;width:100%;
}
.btn:active{background:#f0ebde}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#faf7ef}
.btn.primary:active{background:#3a352c}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink2);height:40px}
.btn.sm{height:36px;font-size:13.5px;padding:0 12px;width:auto;border-radius:7px}
.btn.danger{color:var(--red);border-color:#e5cfc8}
.btns{display:flex;gap:10px}
.btns .btn{width:auto;flex:1}

/* ---------- 分组行 ---------- */
.glist{border-top:1px solid var(--line2)}
.grow{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:13px 2px 13px 0;border-bottom:1px solid var(--line2);
}
.grow:active{background:#efeade}
.grow .gt{flex:1;min-width:0}
.grow .gt b{display:block;font-size:14.5px;font-weight:600;letter-spacing:.2px}
.grow .gt small{display:block;font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.45}
.grow .gp{flex:0 0 auto;text-align:right;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.grow .gp b{display:block;font-size:13px;color:var(--ink2);font-weight:600}
.chev:after{content:"";display:block;width:7px;height:7px;border-top:1.5px solid var(--line);border-right:1.5px solid var(--line);transform:rotate(45deg);margin-left:2px}
.chev{border-color:transparent!important}

/* 细进度 */
.mini{height:3px;background:var(--line2);border-radius:2px;margin-top:7px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--green)}

/* 标签 */
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:11.5px;line-height:22px;padding:0 10px;border:1px solid var(--line);border-radius:4px;color:var(--ink2);background:#fbf8f1;white-space:nowrap;flex:0 0 auto}
.tag.on{background:var(--ink);border-color:var(--ink);color:#faf7ef}
.tag.red{color:var(--red);border-color:#e2c9c2;background:#fbf1ee}
.chips{display:flex;flex-wrap:wrap;gap:7px;padding:2px 0 6px}


/* 档位标记 */
.dotp{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;vertical-align:1px}
.dotp.p1{background:var(--red)}
.dotp.p2{background:var(--amber)}
.dotp.p3{background:#bdb4a1}

/* ---------- 学习卡 ---------- */
.ses{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding-bottom:104px}
.ses-hd{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line2);padding:12px 16px 0}
.ses-hd .r1{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted)}
.dirsw{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--card)}
.dirsw button{font-size:11.5px;line-height:24px;padding:0 9px;color:var(--muted);letter-spacing:.2px;white-space:nowrap}
.dirsw button+button{border-left:1px solid var(--line2)}
.dirsw button.on{background:var(--ink);color:#faf7ef}
.xbtn{width:30px;height:30px;display:flex;align-items:center;justify-content:center;margin-left:-6px;color:var(--ink2);font-size:20px;line-height:1}
.ses-bar{height:3px;background:var(--line2);margin-top:9px;overflow:hidden}
.ses-bar i{display:block;height:100%;background:var(--ink);transition:width .2s}
.ses-body{flex:1;display:flex;flex-direction:column;padding:0 18px}
.qtag{font-size:11px;letter-spacing:.6px;color:var(--muted);margin-bottom:14px}
.qtag b{color:var(--red);font-weight:600}

.q-en{
  font-family:Georgia,"Times New Roman","Songti SC",serif;
  font-size:19px;line-height:1.62;letter-spacing:.2px;color:var(--ink);
  word-break:break-word;
}
.q-en.long{font-size:17px;line-height:1.62}
.q-zh{font-size:17px;line-height:1.7;color:var(--ink)}
.ph{color:var(--red);font-style:normal;border-bottom:1px dashed rgba(162,53,42,.35);white-space:nowrap}

.ans{margin-top:22px;padding-top:16px;border-top:1px dashed var(--line)}
.ans .lbl{font-size:11px;letter-spacing:.5px;color:var(--muted);margin-bottom:6px}
.tip{margin-top:14px;padding:11px 12px;background:#faf6ea;border:1px solid var(--line2);border-radius:8px;font-size:12.5px;line-height:1.65;color:var(--ink2)}
.tip b{color:var(--red);font-weight:600}
.src{display:inline-block;font-size:10.5px;color:var(--muted);margin-top:10px;letter-spacing:.3px}

.idle{font-size:13px;color:var(--muted);text-align:center;padding:7px 0}

/* 答题输入 */
.wr{margin-top:16px}
.wr textarea{
  width:100%;min-height:96px;padding:12px;border:1px solid var(--line);border-radius:8px;
  background:var(--card);font-family:Georgia,"Times New Roman",serif;font-size:16px;line-height:1.6;resize:vertical;
}
.wr textarea:focus{outline:none;border-color:#b9ae97}
.hintrow{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:12px;color:var(--muted)}
.score{font-size:13px;margin:14px 0 6px}
.score b{font-size:17px;font-variant-numeric:tabular-nums}
.score .ok{color:var(--green)}
.score .mid{color:var(--amber)}
.score .no{color:var(--red)}
.miss{color:var(--red);border-bottom:1px solid rgba(162,53,42,.5)}
.opt{
  display:block;width:100%;text-align:left;padding:12px 13px;border:1px solid var(--line);border-radius:8px;
  background:var(--card);margin-bottom:8px;font-family:Georgia,"Times New Roman",serif;font-size:15px;line-height:1.5;
}
.opt:active{background:#f0ebde}
.opt.right{border-color:#a9c6b8;background:var(--green-w)}
.opt.wrong{border-color:#dfbcb3;background:var(--red-w)}

/* 底部操作条 */
.act{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  max-width:560px;margin:0 auto;padding:10px 16px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(to bottom,rgba(244,241,232,.82),var(--paper) 40%);
  border-top:1px solid var(--line2);
}
.grade{display:flex;gap:8px}
.grade button{
  flex:1;height:50px;border-radius:9px;border:1px solid;font-size:14px;font-weight:600;letter-spacing:.3px;
}
.grade .g0{border-color:#dfbcb3;color:var(--red);background:var(--red-w)}
.grade .g1{border-color:#e2d3b1;color:var(--amber);background:var(--amber-w)}
.grade .g2{border-color:#aec9bb;color:var(--green);background:var(--green-w)}
.grade button:active{filter:brightness(.97)}
.act .row2{display:flex;gap:10px}
.act .row2 .btn{flex:1}

/* 底部导航 */
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;max-width:560px;margin:0 auto;
  display:flex;background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.nav a{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  height:54px;font-size:12.5px;color:var(--muted);text-decoration:none;letter-spacing:.4px;
}
.nav a b{font-weight:500}
.nav a.on{color:var(--ink);font-weight:600}
.nav a.on b{position:relative}
.nav a.on b:after{content:"";position:absolute;left:50%;bottom:-6px;width:16px;height:2px;background:var(--red);transform:translateX(-50%)}

/* 统计 */
.stat2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat2 .panel{padding:13px 14px}
.stat2 .lab{font-size:11.5px;color:var(--muted);letter-spacing:.3px}
.stat2 .val{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
.stat2 .val small{font-size:12px;color:var(--muted);font-weight:400;margin-left:2px}
.heat{display:flex;gap:4px;margin-top:4px}
.heat .c{flex:1;height:26px;border-radius:3px;background:var(--line2)}
.heat .c.l1{background:#cfe0d5}.heat .c.l2{background:#9dbfae}.heat .c.l3{background:#5f8b79}.heat .c.l4{background:var(--green)}
.heat-x{display:flex;gap:4px;margin-top:5px;font-size:9.5px;color:var(--muted)}
.heat-x span{flex:1;text-align:center;font-variant-numeric:tabular-nums}
.bars{margin-top:6px}
.bars .b{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.bars .b .lb{width:78px;font-size:12px;color:var(--ink2);flex:0 0 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bars .b .bb{flex:1;height:8px;background:var(--line2);border-radius:4px;overflow:hidden}
.bars .b .bb i{display:block;height:100%;background:var(--green)}
.bars .b .vv{width:52px;text-align:right;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 auto}
.empty{text-align:center;color:var(--muted);font-size:13px;padding:30px 0}

/* 表单 */
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;letter-spacing:.3px}
.field input,.field textarea,.field select{
  width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);font-size:15px;
}
.field input:focus,.field textarea:focus{outline:none;border-color:#b9ae97}
.note{font-size:12px;color:var(--muted);line-height:1.7}
.note b{color:var(--ink2)}
.hr{height:1px;background:var(--line2);margin:18px 0}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line2);font-size:13.5px}
.kv:last-child{border-bottom:0}
.kv span{color:var(--muted);flex:0 0 auto}
.kv b{font-weight:500;text-align:right}

/* 吐司 */
.toast{
  position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(8px);
  background:rgba(31,29,26,.92);color:#f7f3e9;font-size:13px;padding:9px 14px;border-radius:6px;
  opacity:0;pointer-events:none;transition:.22s;z-index:60;max-width:80%;text-align:center;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.sum{text-align:center;padding:26px 18px}
.sum .ring{font-size:44px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.sum .sub{font-size:12px;color:var(--muted);letter-spacing:.6px}
.sum .st3{display:flex;justify-content:center;gap:26px;margin:22px 0}
.sum .st3 div{font-size:11px;color:var(--muted)}
.sum .st3 b{display:block;font-size:19px;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}

.ses-inner{margin-top:clamp(56px,15vh,150px);margin-bottom:auto;padding:6px 0 10px}
.secbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:15px 0 13px;border-bottom:1px solid var(--line2)}
.secbtn .t{flex:1;min-width:0}
.secbtn .t b{display:block;font-size:15px;font-weight:600}
.secbtn .t small{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.secbtn .c{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.glist.sub{margin-left:2px;padding-left:12px;border-left:2px solid var(--line2)}
.glist.sub .grow .gt b{font-size:14px;font-weight:500}

/* 组卡：一组多说法，逐个背 */
.gwdots{display:flex;gap:3px;margin:0 0 16px}
.gwdots i{flex:1;height:3px;border-radius:2px;background:var(--line2)}
.gwdots i.done{background:#b8c9be}
.gwdots i.cur{background:var(--red)}
.gwtpl{
  font-family:Georgia,"Times New Roman","Songti SC",serif;
  font-size:18px;line-height:1.75;letter-spacing:.2px;color:var(--ink);word-break:break-word;
}
.gwtpl.long{font-size:16.5px}
.gwblank{display:inline-block;min-width:80px;margin:0 4px;border-bottom:1.5px solid var(--red);vertical-align:-2px;height:1.15em}
.gwword{color:var(--green);border-bottom:1.5px solid #a9c6b8}
.gwmore{margin-top:16px}
.foldbtn{font-size:12.5px;color:var(--ink2);border:1px solid var(--line);border-radius:6px;padding:8px 11px;background:#fbf8f1;letter-spacing:.2px}
.gwlist{margin-top:9px;font-family:Georgia,"Times New Roman",serif;font-size:13.5px;line-height:2;color:var(--ink2)}
.gwlist span{display:inline-block;margin-right:12px}
.gwlist span.on{color:var(--green);font-weight:600}

/* ---------- 启动画面（装到主屏后先看到它，再淡出） ---------- */
#splash{
  position:fixed;inset:0;z-index:99;background:var(--paper);color:var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:0 24px calc(24px + env(safe-area-inset-bottom));
  transition:opacity .32s ease;
}
#splash.gone{opacity:0;pointer-events:none}
#splash .sp-mark{display:flex;flex-direction:column;align-items:center;gap:9px}
#splash .sp-mark span{display:block;height:13px;border-radius:7px}
#splash .sp-t{
  margin-top:26px;letter-spacing:1.2px;
  font:600 26px/1.35 "Songti SC",ui-serif,Georgia,"Noto Serif CJK SC","Source Han Serif SC",serif;
}
#splash .sp-r{width:44px;height:3px;border-radius:2px;background:var(--red);margin:14px 0 11px}
#splash .sp-s{font-size:13px;color:var(--muted);letter-spacing:.4px}
#splash .sp-dot{margin-top:32px;display:flex;gap:6px}
#splash .sp-dot i{width:5px;height:5px;border-radius:50%;background:var(--line);animation:spb 1.1s infinite ease-in-out}
#splash .sp-dot i:nth-child(2){animation-delay:.16s}
#splash .sp-dot i:nth-child(3){animation-delay:.32s}
@keyframes spb{0%,100%{opacity:.35;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
@media (prefers-reduced-motion:reduce){#splash .sp-dot i{animation:none;opacity:.5}}


</style>
</head>
<body>
<div id="splash" role="presentation">
  <div class="sp-mark" style="display:block;width:78px;height:78px;border-radius:17px;background:#a2352a;color:#f4f1e8;font:600 46px/76px Georgia,'Times New Roman',serif;text-align:center">E</div>
  <div class="sp-t">考研英语大作文</div>
  <div class="sp-r"></div>
  <div class="sp-s">背诵程序 · 404 张卡 · 大作文 + 小作文</div>
  <div class="sp-dot"><i></i><i></i><i></i></div>
</div>
<script>
(function () {
  var sp = document.getElementById('splash');
  if (!sp) return;
  var done = false, t0 = Date.now();
  function hide() {
    if (done) return;
    var wait = 640 - (Date.now() - t0);          // 至少停留 0.64s，避免一闪而过
    if (wait > 0) return setTimeout(hide, wait);
    done = true;
    sp.className = 'gone';
    setTimeout(function () { if (sp.parentNode) sp.parentNode.removeChild(sp); }, 380);
  }
  window.__hideSplash = hide;
  function arm() {
    var app = document.getElementById('app');
    if (!app) return setTimeout(arm, 60);
    if (app.children.length) { hide(); return; }
    if (window.MutationObserver) {
      var ob = new MutationObserver(function () {

":"2023 英二 · 动态图（一条线一直升 / 一直降）","eg":"The chart above illustrates the changes in Chinese residents' health literacy level from 2012 to 2021, during which it rose steadily.","egzh":"上方折线图展示了 2012—2021 年我国居民健康素养水平的变化，其间该水平稳步上升。"},{"id":"b_c4","g":"p1_overall","p":1,"en":"The chart above illustrates the changes in 主题词 from 年份 to 年份, among which the rise in 单项 was the most striking.","zh":"上方图表展示了主题词从年份到年份的变化，其中单项的上升最为显著。","tip":"动态·多方向。与单方向句句式统一，最好记。最显著的若是下降：rise 换 fall / decline / drop，句型不动。","sr":"精选","q":"2019 英二 · 动态图（有升有降，多变量）","eg":"The chart above illustrates the changes in graduates' choices from 2013 to 2018, among which the rise in the proportion pursuing further study was the most striking.","egzh":"上方柱状图展示了 2013—2018 年毕业生去向选择的变化，其中选择深造比例的上升最为显著。"},{"id":"b_c5","g":"p1_overall","p":2,"en":"主题词 experienced divergent trends from 年份 to 年份, with 单项 rising most sharply.","zh":"主题词在年份至年份间经历了分化性趋势，其中单项上升最为剧烈。","tip":"Divergent + with，多方向备用。","sr":"主补","q":"2019 英二 · 一升一降（两个变量走向相反）","eg":"As reflected in the chart, graduates' choices moved in opposite directions from 2013 to 2018, the proportion entering the workforce falling while that pursuing further study rising.","egzh":"如图所示，毕业生去向在 2013—2018 年间走向相反：就业比例下降，而深造比例上升。"},{"id":"b_c7","g":"p1_overall","p":1,"en":"The bar chart above presents the distribution of 主题词, with 占比最高项 accounting for the largest share.","zh":"上方柱状图呈现了主题词的分布情况，其中占比最高项所占份额最大。","tip":"静态图主背。3D 里的 distribution，最通用。with + 宾语 + 现在分词，别写成谓语。","sr":"精选","q":"2024 英二 · 静态图（只有占比，没有年份趋势）","eg":"The bar chart above presents the distribution of students' gains from the labor practice course, with acquiring relevant knowledge accounting for the largest share.","egzh":"上方柱状图呈现了劳动实践课学生收获的分布，其中「获得相关知识」所占份额最大。"},{"id":"b_c9","g":"p1_overall","p":2,"en":"The chart above reveals a striking disparity in 主题词, with the proportions ranging from 最低值 to 最高值.","zh":"上方图表揭示了主题词中显著的差距，各项占比从最低值到最高值不等。","tip":"3D 里的 disparity。精选漏收此句，主模板静态图待选 3。","sr":"主补","q":"2024 英二 · 静态图 · 各项差距悬殊时","eg":"The chart above reveals a striking disparity in students' gains, with the proportions ranging from 32.6% to 91.3%.","egzh":"上方图表揭示了学生收获中的显著差距，各项占比从 32.6% 到 91.3% 不等。"},{"id":"b_c10","g":"p1_overall","p":1,"en":"The chart on the left illustrates 左图主题, while the chart on the right presents 右图主题.","zh":"左图展示了左图主题，右图呈现了右图主题。","tip":"双图表主背。静静 / 动静 / 动动三种组合骨架完全不变，只换每幅图里的主题用词。","sr":"精选","q":"2026 英一 · 双图表（一左一右两张）","eg":"The chart on the left illustrates consumers' attitudes towards elderly-care robots, while the chart on the right lists their major concerns about such robots.","egzh":"左图展示消费者对养老机器人的态度，右图列出他们对此类机器人的主要顾虑。"},{"id":"b_c12","g":"p1_overall","p":2,"en":"The two charts present 总主题: the pie chart shows 图1内容, while the bar chart on the right lists 图2内容.","zh":"两张图表共同呈现了总主题：饼图展示图1内容，右侧柱状图列出图2内容。","tip":"总分结构，想拉长句子时用。","sr":"精选","q":"2026 英一 · 双图表拉长版（总分结构）","eg":"The two charts present consumers' responses to elderly-care robots: the pie chart shows their acceptance rates, while the bar chart on the right lists their major concerns.","egzh":"两张图表共同呈现消费者对养老机器人的反应：饼图是接受度，右侧柱状图是主要顾虑。"},{"id":"b_c13","g":"p1_overall","p":1,"en":"The chart above provides information about 主题词 from 年份 to 年份.","zh":"上方图表提供了年份至年份间主题词的相关信息。","tip":"万能应急主背。看不懂图、时间紧时兜底，几乎不用判断词性。","sr":"精选","q":"兜底 · 图看不懂、时间紧（有年份变化）","eg":"The chart above provides information about Chinese residents' spending habits from 2015 to 2020.","egzh":"上方图表提供了 2015—2020 年间我国居民消费习惯的相关信息。（示范）"},{"id":"b_d1","g":"p1_detail","p":1,"en":"To be specific, the percentage of A decreased remarkably from X% to Y%. However, the percentage of B climbed significantly from M% to N%. Meanwhile, the percentage of C rose slightly, from P% to Q%.","zh":"具体而言，A 的比例从 X% 大幅降至 Y%。然而，B 的比例从 M% 显著升至 N%。与此同时，C 的比例从 P% 小幅升至 Q%。","tip":"动态公式 1。三个数据必须配三种动词 + 副词（decreased remarkably / climbed significantly / rose slightly），不许重复；during the same period 可省。","sr":"精选","q":"2019 英二 · 动态细节（三个数据配三种动词 + 副词）","eg":"To be specific, the percentage of graduates entering the workforce decreased remarkably from 68.1% to 60.7%. However, the proportion pursuing further study climbed significantly from 26.3% to 34.0%. Meanwhile, the proportion starting a business rose slightly, from 1.3% to 2.6%.","egzh":"具体而言，直接就业的毕业生比例从 68.1% 大幅降至 60.7%；然而，深造比例从 26.3% 显著升至 34.0%；同时，创业比例从 1.3% 小幅升至 2.6%。"},{"id":"b_d2","g":"p1_detail","p":2,"en":"The proportion of A was X% in 年份1, compared with Y% in 年份2, showing an increase of XX percentage points.","zh":"A 在年份1 占 X%，而年份2 为 Y%，表明增长了 XX 个百分点。","tip":"动态公式 2。只写一个变量、强调增量。比例的增长用 percentage points，数量用 units，单位别漏。","sr":"精选","q":"单变量 · 只强调增量 / 减量（示范）","eg":"The proportion of consumers choosing electric vehicles was 5% in 2018, compared with 20% in 2023, showing an increase of 15 percentage points.","egzh":"选择电动车的消费者比例 2018 年为 5%，2023 年为 20%，增长了 15 个百分点。（示范）"},{"id":"b_d3","g":"p1_detail","p":2,"en":"The figure for A in 年份2 was nearly twice that in 年份1.","zh":"年份2 中 A 的数值接近年份1 的两倍。","tip":"动态公式 3。2 倍 twice，3 倍 triple，4 倍以上 four times；三种表达任选：twice that in / twice as high as that in / twice the 年份 figure。","sr":"精选","q":"倍数关系 · 同一变量两个年份（示范）","eg":"The number of residents in the city in 2023 was nearly twice that in 2013.","egzh":"该市 2023 年的居民数量接近 2013 年的两倍。（示范）"},{"id":"b_d4","g":"p1_detail","p":1,"en":"To be specific, the percentages of 主题词1, 主题词2, 主题词3 account for X%, Y%, Z% respectively. Notably, 占比最多项 tops the list, at X%, followed by 占比次多项 at Y%.","zh":"具体而言，主题词1、2、3 的比例分别为 X%、Y%、Z%。值得注意的是，占比最多项以 X% 居首，其次是 Y% 的占比次多项。","tip":"静态公式 1。主语是 percentages，谓语用复数 account；排名只写前两项，否则头重脚轻；总体句已写过「占比最高」时后半句可省。","sr":"精选","q":"2024 英二 · 静态细节 + 排名（只写前两项）","eg":"To be specific, the percentages of students who acquired relevant knowledge, improved practical skills and felt comfortable account for 91.3%, 84.8% and 54.4% respectively. Notably, acquiring relevant knowledge tops the list, at 91.3%, followed by improving practical skills at 84.8%.","egzh":"具体而言，获得相关知识、提高实践技能、心情舒畅的学生比例分别为 91.3%、84.8%、54.4%；其中获得相关知识以 91.3% 居首，其次是 84.8% 的提高实践技能。"},{"id":"b_d5","g":"p1_detail","p":2,"en":"The percentage of A was about 1.8 times that of B in 年份.","zh":"年份里 A 的比例约为 B 的 1.8 倍。","tip":"静态倍数。静态没有年份趋势，倍数句改成同一年份两个变量对比。","sr":"精选","q":"静态倍数 · 同一年份两个变量对比（示范）","eg":"The percentage of students choosing online courses was about 1.8 times that of those choosing offline ones in 2024.","egzh":"2024 年选择线上课程的学生比例约为选择线下课程的 1.8 倍。（示范，数字按题目换）"},{"id":"b_e1","g":"p1_phen","p":1,"en":"It is apparent from the statistics that …","zh":"从这些统计数据可以明显看出，……","tip":"过渡句主背。The chart conveys a message / The purpose of the chart is to remind us 语气偏图画，图表首段别主用。","sr":"精选","q":"2023 英二 · 数据 → 现象 的过渡句","eg":"It is apparent from the statistics that health literacy has become a growing concern among Chinese residents.","egzh":"从这些数据可以明显看出，健康素养已成为我国居民日益关注的问题。"},{"id":"b_e4","g":"p1_phen","p":2,"en":"The chart clearly communicates its intended meaning: …","zh":"这幅图清楚地传达了它的意图：……","tip":"过渡句备用，冒号后接完整现象句。","sr":"主补","q":"备用过渡 · 冒号后接完整现象句（示范）","eg":"The chart clearly communicates its intended meaning: elderly-care robots are winning public acceptance.","egzh":"图表清楚传达了它的意图：养老机器人正获得公众认可。（示范）"},{"id":"b_e5","g":"p1_phen","p":1,"en":"主题词 has drawn growing attention from the public.","zh":"主题词已受到公众越来越广泛的关注。","tip":"现象方案 4，态度型图表首选（新技术 / 新观念 / 新生活方式，26 英一养老机器人、26 英二户外活动都属此类）。可加 with safety as their top concern。","sr":"精选","q":"2026 英一 · 态度型图表（新技术 / 新观念 / 新生活方式）","eg":"Elderly-care robots have drawn growing attention from the public, with safety as their top concern.","egzh":"养老机器人已受到公众越来越广泛的关注，安全是首要关切。"},{"id":"b_e6","g":"p1_phen","p":2,"en":"主题词 is becoming common / popular / prevalent among people nowadays.","zh":"如今，主题词在人们当中正变得普遍 / 流行 / 盛行。","tip":"现象方案 3。某现象变得普遍流行时用。","sr":"精选","q":"2026 英二 · 某现象正变得普遍（户外活动 / 在线学习）","eg":"Online learning is becoming prevalent among college students nowadays.","egzh":"如今在线学习在大学生中正变得盛行。"},{"id":"b_e8","g":"p1_phen","p":2,"en":"Recent years have witnessed the rapid development of 主题词.","zh":"近年来，主题词得到了快速发展。","tip":"现象方案 1。实体行业配 develop；抽象的水平 / 率 / 数量配 improve / rise，写成 a sharp rise in the level / rate。","sr":"精选","q":"实体行业（快递 / 旅游）· 近年快速发展","eg":"Recent years have witnessed the rapid development of the express delivery industry.","egzh":"近年来快递业得到了快速发展。"},{"id":"b_f1","g":"p2","p":1,"en":"Three key reasons, from my perspective, account for this phenomenon.","zh":"在我看来，有三点主要原因促成了这一现象。","tip":"原因过渡主背。英一写三点，英二写两点到三点；图表题用 phenomenon，图画、文字观点题可换 viewpoint。","sr":"精选","q":"所有图表题 · 第二段开头（英一写三点，英二 2~3 点）","eg":"Three key reasons, from my perspective, account for this phenomenon.","egzh":"在我看来，有三点主要原因促成了这一现象。"},{"id":"b_f2","g":"p2","p":2,"en":"Several factors contribute to this phenomenon.","zh":"若干因素共同促成了这一现象。","tip":"原因过渡备用。","sr":"精选"},{"id":"b_f5","g":"p2","p":1,"en":"To begin with, for instance, my roommate, Kevin, is passionate about 主题词, which helps him cultivate practical skills and a spirit of cooperation. Consequently, he earns the respect of our entire class.","zh":"首先，例如，我的室友凯文热衷于主题词，这帮助他培养了实践技能与合作精神；因此，他赢得了全班同学的尊重。","tip":"原因 1 · 身边举例，开场用（固定主套第一句）。不要背马云、爱迪生这类名人事例。","sr":"精选","q":"身边举例 · 劳动实践 / 合作类（讲义填法示范）","eg":"To begin with, for instance, my roommate Kevin is passionate about practical courses, which helps him cultivate practical skills and a spirit of cooperation. Consequently, he earns the respect of our entire class.","egzh":"首先，例如我的室友 Kevin 热衷于实践类课程，这帮助他培养了实践技能与合作精神；因此他赢得了全班同学的尊重。"},{"id":"b_f6","g":"p2","p":1,"en":"For instance, my hometown, a livable city, places a high priority on 主题词, which enables residents to 做某事. During this period, 结果.","zh":"例如，我的家乡是一座宜居城市，高度重视主题词，这使居民能够做某事。在此期间，结果。","tip":"原因 1 的四步组装：引出例子 → 现状简单句 → which 结果从句 → 结果 / 心态句（篇幅紧可省）。主体换 my grandfather / my neighbor's son / a nursing home in my city。","sr":"主补","q":"家乡举例 · 2024 英一城市公园（按范文改写）","eg":"For instance, my hometown, a livable city, places a high priority on building parks, which enables residents to exercise outdoors every day.","egzh":"例如我的家乡，一座宜居城市，高度重视公园建设，这让居民每天都能在户外锻炼。（按范文改写）"},{"id":"b_f7","g":"p2","p":1,"en":"What's more, definitely no one can deny the fact that 主题词 plays a crucial role in 某方面.","zh":"其次，毋庸置疑，主题词在某方面起着关键作用。","tip":"原因 2 · 从句说理，骨架万年不变，只换主题词和某方面。单数 plays，复数 play。","sr":"精选","q":"2026 英二 · 户外活动（从句说理，最万能）","eg":"What's more, definitely no one can deny the fact that outdoor activities play a crucial role in students' physical and mental health.","egzh":"其次，毋庸置疑，户外活动对学生身心健康起着关键作用。"},{"id":"b_f8","g":"p2","p":1,"en":"Last but not least, the majority of people believe that 主题词 will provide them with a broader platform to 做某事, which may put them in a beneficial position in the future.","zh":"最后，大多数人认为主题词将为他们提供更广阔的平台去做某事，这或许能使他们在未来处于有利地位。","tip":"原因 3 · 群众路线，固定主套第三句。which 逻辑要配对：个人发展配 beneficial position / competitive edge，健康生活配 quality of life / relieve the burden，社会配 contribute to。","sr":"精选","q":"群众路线 · 养老机器人（多数人怎么看）","eg":"To begin with, the majority of people believe that elderly-care robots will provide them with a broader platform to care for their aging parents, which relieves the burden on their families.","egzh":"首先，大多数人认为养老机器人能为他们提供更广阔的平台去照顾年迈父母，这减轻了家庭负担。"},{"id":"b_f9","g":"p2","p":2,"en":"Not only does 主题词 improve 某方面, but it also enables them to 某方面.","zh":"主题词不仅能改善某方面，还能使他们在某方面受益。","tip":"倒装加分句，替换任意一句。前半动词可换 enhance / promote / boost / cultivate / facilitate；后半可换 help / allow / encourage / deepen / relieve。复数主语用 do，but also 后用 they。","sr":"精选","q":"2026 英一 · Not only 倒装（第三条原因）","eg":"Not only does the application of elderly-care robots improve the quality of life for the elderly, but it also relieves the burden on their families.","egzh":"养老机器人的应用不仅改善了老年人的生活质量，也减轻了家庭的负担。"},{"id":"b_h1","g":"p3","p":1,"en":"All in all, it is not difficult to draw the conclusion that enough attention must be paid to 主题词 by ourselves and our community.","zh":"总之，我们不难得出结论：我们自身与社会都必须对主题词给予足够重视。","tip":"总结主背。描述已取得的进展用 has been paid，提今后要求用 must be paid；by 后对象随题目换。","sr":"精选","q":"养老机器人 / 三类作文通用 · 第三段总结","eg":"All in all, it is not difficult to draw the conclusion that enough attention must be paid to elderly-care robots by ourselves and our community.","egzh":"总之，我们不难得出结论：我们自身与社会都必须对养老机器人给予足够重视。"},{"id":"b_h5","g":"p3","p":2,"en":"By no means should we underestimate the profound impact of 主题词.","zh":"我们绝不应低估主题词所产生的深远影响。","tip":"总结倒装，想用上分句式时。Never can we / On no account should we / Under no circumstances can we 同族。","sr":"精选","q":"文化交流 · 倒装总结（想上分句式时）","eg":"By no means should we underestimate the profound impact of cultural exchange.","egzh":"我们绝不应低估文化交流所产生的深远影响。"},{"id":"b_h6","g":"p3","p":1,"en":"For one thing, it is imperative for the authorities to formulate relevant policies and regulations to 解决问题/保障主题词.","zh":"一方面，政府有必要制定相关政策法规，以解决问题 / 保障主题词。","tip":"措施·政府角度主背。make strict laws / formulate policies / allocate more funds / launch public initiatives 可换。必须回扣题目痛点，不写万能空话。","sr":"精选","q":"养老机器人 · 政府措施（第三段第一句）","eg":"For one thing, it is imperative for the authorities to formulate relevant regulations to ensure the safe use of elderly-care robots.","egzh":"一方面，政府有必要制定相关法规，以确保养老机器人的安全使用。"},{"id":"b_h7","g":"p3","p":1,"en":"For another, ordinary individuals ought to spare no pains to attach great importance to 主题词 in daily life.","zh":"另一方面，普通人应当在日常生活中不遗余力地高度重视主题词。","tip":"措施·个人角度主背。We should → It is our duty to / We are obliged to；spare no pains to → make concerted efforts to / take concrete steps to。","sr":"精选","q":"个人措施 · 任何题目都能用（第三段第二句）","eg":"For another, ordinary individuals ought to spare no pains to attach great importance to health knowledge in daily life.","egzh":"另一方面，普通人也应在日常生活中不遗余力地重视健康知识。"},{"id":"b_h8","g":"p3","p":2,"en":"When it comes to concrete solutions, some people hold that 实施方A must take responsibility for 主题词. In fact, it is 实施方C that plays a crucial role in 主题方面.","zh":"谈到具体解决方案，一些人认为实施方A 必须承担起主题词的责任；事实上，正是实施方C 在主题方面起着关键作用。","tip":"措施方案 2。主题词、实施方、措施都较短的题目才用，写出来偏长。主题方面不要和前面主题词写得一模一样。","sr":"精选","q":"学生心理健康 · 措施方案 2（先主流做法再转折）","eg":"When it comes to concrete solutions, some people hold that schools must take responsibility for students' mental health. In fact, it is families that play a crucial role in children's psychological well-being.","egzh":"谈到具体方案，有人认为学校必须为学生心理健康负责；事实上，正是家庭在孩子心理健全上起关键作用。"},{"id":"b_i1","g":"p3","p":1,"en":"In this way, hopefully, we may embrace a brighter and more promising future.","zh":"如此一来，我们有望拥抱一个更加光明、更有希望的未来。","tip":"畅想主背，不用改任何词。时间紧、字数不够直接用，但属于通用套话。","sr":"精选","q":"结尾套句 · 时间紧 / 字数不够直接用","eg":"In this way, hopefully, we may embrace a brighter and more promising future.","egzh":"如此，我们有望拥抱一个更加光明、更有希望的未来。"},{"id":"b_j1","g":"p3","p":2,"en":"For the reasons given above, we can predict that an increasing number of people will focus on 主题词, and this trend is likely to continue in the near future.","zh":"基于以上原因，我们可以预测，越来越多的人将关注主题词，而且这一趋势在不久的将来很可能延续下去。","tip":"图表专用·趋势预测。第三段不写措施、改预测趋势时用；深度不及建议措施，仅应急。","sr":"精选","q":"图表专用 · 第三段不写措施、改预测趋势","eg":"For the reasons given above, we can predict that an increasing number of people will focus on health literacy, and this trend will continue in the years to come.","egzh":"基于上述原因，可以预见将有越来越多人关注健康素养，这一趋势在未来几年仍将持续。（示范）"},{"id":"b_k1","g":"p4_pic","p":1,"en":"As is symbolically depicted in the picture above, …","zh":"如图象征性所示，……","tip":"引入图画主背。symbolically 与 vividly / clearly 可互换，背不踏实就换 vividly。两幅图、一图一表不要用这句。","sr":"精选","q":"2004 英一 · 跑步冲线（单图，非对话）","eg":"As is symbolically depicted in the picture above, on the playground runs a young man, rushing to the finishing line.","egzh":"如图象征性所示，操场上跑着一位年轻人，正冲向终点线。"},{"id":"b_k3","g":"p4_pic","p":2,"en":"What is clearly conveyed in the picture is that …","zh":"图片明确传达出的是：……","tip":"引入备用。","sr":"精选","q":"2004 英一 · 备用引入（图片明确传达的是…）","eg":"What is clearly conveyed in the picture is that perseverance leads to success.","egzh":"图片明确传达出的是：坚持带来成功。"},{"id":"b_k6","g":"p4_pic","p":1,"en":"As is symbolically depicted in the picture above, in front of us stands 主体, doing 主要动作, with 表情细节.","zh":"如图象征性所示，我们面前站着主体，正在做主要动作，神情表情细节。","tip":"单图非对话公式：环境 + 基本动作 + 主体 + 主要动作（doing）+ with 细节。想不出细节可省，不扣分。","sr":"精选","q":"2004 英一 · 单图五要素公式（环境 + 动作 + 主体 + doing + with）","eg":"As is symbolically depicted in the picture above, on the playground runs a young man, active as well as vigorous, rushing to the finishing line, with a sweet smile on his face.","egzh":"如图象征性所示，操场上跑着一位年轻人，既活跃又有活力，正冲向终点线，脸上带着灿烂笑容。"},{"id":"b_k9","g":"p4_pic","p":1,"en":"As is symbolically depicted in the picture above, in front of us stand 主体A and 主体B, talking heatedly. One argues that 观点A. By contrast, the other maintains that 观点B.","zh":"如图象征性所示，我们面前站着主体A 和主体B，正热烈交谈。一人认为观点A；相比之下，另一人坚持认为观点B。","tip":"对话型。推荐转述，不要逐字直引；argue / maintain / point out 三个够用。对比关联词 By contrast / However / Meanwhile / On the contrary / Conversely。","sr":"精选","q":"2022 英一 · 两人谈讲座（对话型）","eg":"As is symbolically depicted in the picture above, in front of us stand two girls, talking about campus lectures. One argues that campus lectures are irrelevant to her major and a waste of time. By contrast, the other maintains that attending such lectures is highly beneficial nonetheless.","egzh":"如图象征性所示，我们面前站着两位女生，正在谈论校园讲座。一人认为讲座与专业无关、浪费时间；另一人坚持认为参加仍大有裨益。"},{"id":"b_k10","g":"p4_pic","p":1,"en":"The cartoons provide us with a thought-provoking scene: 左图主体 is doing 动作A. However, 右图主体 is doing 动作B.","zh":"两幅漫画向我们呈现了一个发人深省的场景：左图主体正在做动作A；然而，右图主体正在做动作B。","tip":"两幅图。名词动词一律用复数、时态一致；中间必须加连词（相似 Similarly / 对比 While / 同时 Meanwhile / 递进 Moreover）。","sr":"精选","q":"2020 英一 · 好习惯与拖延（两幅图）","eg":"The cartoons provide us with a thought-provoking scene: the girl in the left picture is fully focused on her homework. However, in the right picture, the boy is lying on the sofa, telling himself that he will not start until the deadline.","egzh":"两幅漫画呈现了一个发人深省的场景：左图女孩全神贯注做作业；而右图男孩躺在沙发上，告诉自己拖到最后一刻才开始。"},{"id":"b_k12","g":"p4_pic","p":1,"en":"As is vividly depicted in the cartoon and clearly shown in the chart above, 简单图画描述, and the chart illustrates 图表总体描述.","zh":"正如上方漫画生动描绘、图表清楚展示的那样，简单图画描述；同时，图表展示了图表总体描述。","tip":"一图一表（2024 英一）。两边都写简单句、不展开细节，简单叠加即可。","sr":"精选","q":"2024 英一 · 一图一表（图画 + 图表叠加）","eg":"As is vividly depicted in the cartoon and clearly shown in the chart above, a girl is sitting in front of a computer learning online, and the chart illustrates the popularity of online courses over the past decade.","egzh":"正如上方漫画生动描绘、图表清楚展示的那样，一位女孩坐在电脑前在线学习；图表则展示了近十年在线课程的普及程度。"},{"id":"b_k13","g":"p4_pic","p":2,"en":"The cartoon above depicts 图画描述, while the chart below illustrates 图表总体描述.","zh":"上方漫画描绘了图画描述，而下方图表展示了图表总体描述。","tip":"一图一表备用写法。","sr":"精选","q":"2024 英一 · 一图一表备用写法","eg":"The cartoon above depicts a girl learning online at home, while the chart below illustrates the growing popularity of online courses.","egzh":"上方漫画描绘一位女孩在家在线学习，下方图表展示在线课程日益普及。（示范）"},{"id":"b_k14","g":"p4_pic","p":1,"en":"The primary intention of the drawing is to remind the whole society that …","zh":"这幅画的主要意图是提醒全社会，……","tip":"主题阐述过渡句主背。对象越具体越好：24、25 年用 residents，23 年用 rural residents，22 年用 undergraduates，不要一律 the public。","sr":"精选","q":"2004 英一 · 图画第一段收尾（主题阐述）","eg":"The primary intention of the drawing is to remind the whole society that perseverance is of vital importance.","egzh":"这幅画的主要意图是提醒全社会：坚持至关重要。"},{"id":"b_k16","g":"p4_pic","p":1,"en":"主题词 is so indispensable that the subject deserves the highest level of attention and consideration.","zh":"主题词如此不可或缺，以至于这一话题理应得到最高程度的关注与重视。","tip":"中心思想方案 1，最万能。主题词要具体到事情本身（信心匮乏 / 环境恶化 / 文化交流 / 广泛学习 / 行动 / 榜样 / 选择），不能只写一个 important。","sr":"精选","q":"意志品质类（信心 / 坚持 / 勇气）· 中心思想句","eg":"Self-confidence is so indispensable that the subject deserves the highest level of attention and consideration.","egzh":"自信如此不可或缺，值得给予最高程度的重视与考量。（示范，主题词按题换）"},{"id":"b_m1","g":"p5_txt","p":1,"en":"It cannot be denied that 主题词 plays a key role in people's work and life.","zh":"不可否认，主题词在人们的工作与生活中起着关键作用。","tip":"引出主题兜底句。首选自己改写原文（同义替换 / 主被动互换 / 高度概括 / 换修饰语位置），实在改写不出才用它。","sr":"精选","q":"文字作文兜底 · 引出主题（任何文字题）","eg":"It cannot be denied that reading plays a key role in people's work and life.","egzh":"不可否认，阅读在人们的工作和生活中起着关键作用。（示范，主题词按题换）"},{"id":"b_m4","g":"p5_txt","p":2,"en":"With the rapid advancement of society and technology, 主题词 has become a common phenomenon in our daily lives.","zh":"随着社会与科技的快速发展，主题词已成为我们日常生活中的普遍现象。","tip":"社会普遍现象类用。26 英二那篇「孩子与屏幕」就是这句起的。","sr":"精选","q":"2026 英二 · 孩子与屏幕（社会普遍现象类）","eg":"With the rapid advancement of society and technology, children's addiction to screens has become a common phenomenon in our daily lives.","egzh":"随着社会与科技的快速进步，孩子沉迷屏幕已成为日常生活中常见的现象。"},{"id":"b_m6","g":"p5_txt","p":1,"en":"According to the author, 改写作者核心观点.","zh":"作者认为，改写作者核心观点。","tip":"改写观点主背。题干要求「说明作者观点」，必须写这一句；作者观点虽有两三句，挑最容易改写的一句改。","sr":"精选","q":"文字题 · 题干要求「说明作者观点」时必写","eg":"According to the author, parents should set limits on children's screen time instead of blaming schools alone.","egzh":"根据作者观点，家长应为孩子的屏幕时间设限，而不是只责怪学校。（示范，按原文改写）"},{"id":"b_m7","g":"p5_txt","p":2,"en":"The author believes that …","zh":"作者认为，……","tip":"改写观点同义说法：Therefore, the author holds that / In the opinion of the author，换汤不换药。","sr":"精选","q":"文字题 · 观点同义说法（Therefore / In the author's view）","eg":"Therefore, the author holds that reading widely is essential to a college student's growth.","egzh":"因此，作者认为广泛阅读对大学生的成长至关重要。（示范）"},{"id":"b_m8","g":"p5_txt","p":1,"en":"I fully agree with the author's viewpoint.","zh":"我完全赞同作者的观点。","tip":"表明态度·完全同意，首选。这句虽短但题干明确要求，绝不能省。观点正确积极的题必须同意。","sr":"精选","q":"完全同意 · 观点积极正确的题必须表态","eg":"I fully agree with the author's viewpoint.","egzh":"我完全同意作者的观点。"},{"id":"b_m9","g":"p5_txt","p":2,"en":"I strongly disagree with the author's opinion.","zh":"我强烈不赞同作者的观点。","tip":"强烈反对。开放型题（如孩子沉迷屏幕该怪谁）三种立场均可，选你最好论证的那个。","sr":"精选","q":"开放型题（如孩子沉迷屏幕该怪谁）· 三种立场都可","eg":"I strongly disagree with the author's opinion that schools should bear all the responsibility.","egzh":"我强烈反对作者认为学校应承担全部责任的观点。（示范）"},{"id":"b_n1","g":"p6_page","p":1,"en":"The chart on the left illustrates 左图主题, while the chart on the right presents 右图主题. To be specific, the proportions of A, B, C account for X%, Y%, Z% respectively. Notably, 占比最高项 tops the list, at X%, followed by 占比次多项 at Y%. It is apparent from the statistics that 主题词 has drawn growing attention from the public.","zh":"左图展示左图主题，右图呈现右图主题。具体而言，A、B、C 的比例分别为 X%、Y%、Z%。值得注意的是，最高项以 X% 居首，其次是 Y% 的次高项。从数据可见，主题词已受到公众越来越广泛的关注。","tip":"图表第一段整段骨架。双图表 / 静态为主，英一英二通用。","sr":"精选","q":"2026 英一 · 图表第一段整段（双图表 + 静态为主）","eg":"The chart on the left illustrates consumers' attitudes towards elderly-care robots, while the chart on the right presents their major concerns. To be specific, the proportions of respondents who fully accept, partially accept and reject these robots account for 39.3%, 32.8% and 27.9% respectively.","egzh":"左图展示消费者对养老机器人的态度，右图呈现其主要顾虑。具体而言，完全接受、部分接受、拒绝的受访者分别占 39.3%、32.8%、27.9%。"},{"id":"b_n2","g":"p6_page","p":1,"en":"Three key reasons, from my perspective, account for this phenomenon. To begin with, for instance, my roommate, Kevin, is passionate about 主题词, which helps him cultivate practical skills and a spirit of cooperation. Consequently, he earns the respect of our entire class. What's more, definitely no one can deny the fact that 主题词 plays a crucial role in 某方面. Last but not least, the majority of people believe that 主题词 will provide them with a broader platform to 做某事, which may put them in a beneficial position in the future.","zh":"在我看来，有三点主要原因促成这一现象。首先，例如，我的室友凯文热衷于主题词，这帮助他培养了实践技能与合作精神；因此他赢得了全班尊重。其次，毋庸置疑，主题词在某方面起着关键作用。最后，大多数人认为主题词将为他们提供更广阔的平台去做某事，使其未来处于有利地位。","tip":"第二段整段骨架，三类作文通用。顺序固定：举例 → 说理 → 群众。","sr":"精选","q":"2024 英二 · 第二段整段（举例 → 说理 → 群众）","eg":"Three key reasons, from my perspective, account for this phenomenon. To begin with, for instance, my roommate Kevin is passionate about practical courses, which helps him cultivate practical skills. What's more, no one can deny that practical courses play a crucial role in students' all-round development.","egzh":"在我看来有三点原因。首先，例如我的室友 Kevin 热衷实践课程，这帮他培养实践技能；其次，无人能否认实践课对学生全面发展起关键作用。"},{"id":"b_n3","g":"p6_page","p":1,"en":"All in all, it is not difficult to draw the conclusion that enough attention must be paid to 主题词 by ourselves and our community. For one thing, it is imperative for the authorities to formulate relevant policies and regulations to 保障主题词. For another, ordinary individuals ought to spare no pains to attach great importance to 主题词 in daily life. In this way, hopefully, we may embrace a brighter and more promising future.","zh":"总之，我们不难得出结论：自身与社会都必须重视主题词。一方面，政府有必要制定相关政策法规以保障主题词；另一方面，普通人应在日常生活中高度重视主题词。如此，我们有望迎来更光明、更有希望的未来。","tip":"第三段整段骨架，三类作文通用。","sr":"精选","q":"2023 英二 · 第三段整段（总结 + 两条措施 + 畅想）","eg":"All in all, enough attention must be paid to public health literacy by ourselves and our community. For one thing, it is imperative for the authorities to launch more health education campaigns. For another, ordinary individuals ought to spare no pains to attach great importance to health knowledge in daily life.","egzh":"总之，我们自身与社会都必须高度重视公众健康素养。一方面政府应多办健康教育；另一方面普通人也应在日常重视健康知识。"},{"id":"b_n4","g":"p6_page","p":1,"en":"As is symbolically depicted in the picture above, in front of us stands 主体, doing 主要动作, with 细节. The primary intention of the drawing is to remind the whole society that 主题词 is so indispensable that the subject deserves the highest level of attention and consideration.","zh":"如图象征性所示，我们面前站着主体，正在做主要动作，神情细节。这幅画的主要意图是提醒全社会：主题词如此不可或缺，理应得到最高程度的关注与重视。","tip":"图画第一段整段，只换这一段，二三段沿用 n2 / n3。","sr":"精选","q":"2004 英一 · 图画第一段整段（只换第一段，二三段用 n2 / n3）","eg":"As is symbolically depicted in the picture above, in front of us stands a young man, rushing to the finishing line, with a sweet smile on his face. The primary intention of the drawing is to remind the whole society that perseverance is of vital importance.","egzh":"如图象征性所示，我们面前站着一个年轻人，正冲向终点线，脸上带着笑容；这幅画意在提醒全社会，坚持至关重要。"},{"id":"b_n5","g":"p6_page","p":1,"en":"It cannot be denied that 主题词 plays a key role in people's work and life. According to the author, 作者观点. I fully agree with the author's viewpoint.","zh":"不可否认，主题词在人们的工作与生活中起着关键作用。作者认为，作者观点。我完全赞同作者的观点。","tip":"文字第一段整段，只换这一段，二三段沿用 n2 / n3。","sr":"精选","q":"文字题 · 第一段整段（引出 → 观点 → 表态）","eg":"It cannot be denied that screens play a key role in children's life. According to the author, parents should set limits on screen time. I fully agree with the author's viewpoint.","egzh":"不可否认屏幕在孩子生活中起关键作用。作者认为家长应限制屏幕时间，我完全同意这一观点。"},{"id":"c_inc","g":"v_inc","p":1,"en":"increase / rise / grow / expand / climb / jump / surge / soar","zh":"增加（8 个）","tip":"强度：rise / increase / grow 平，climb / expand 中，jump / surge / soar 猛。例：The health literacy level of Chinese residents rose from 8.8% in 2012 to 25.4% in 2021.","sr":"主补","alts":["increase","rise","grow","expand","climb","jump","surge","soar"],"q":"动态图 · 说「上升」时（2019 英二 / 2023 英二）","eg":"The proportion pursuing further study climbed significantly from 26.3% to 34.0%.","egzh":"选择深造的比例从 26.3% 显著升至 34.0%。"},{"id":"c_dec","g":"v_dec","p":1,"en":"decrease / decline / diminish / shrink / drop / fall","zh":"减少（6 个）","tip":"fall 最短最通用，drop 口语感稍强，diminish / shrink 偏「缩水」。例：The proportion of graduates entering the workforce fell from 68.1% to 60.7%.","sr":"主补","alts":["decrease","decline","diminish","shrink","drop","fall"],"q":"动态图 · 说「下降」时（2019 英二）","eg":"The percentage of graduates entering the workforce decreased remarkably from 68.1% to 60.7%.","egzh":"直接就业的毕业生比例从 68.1% 大幅降至 60.7%。"},{"id":"c_flat","g":"v_flat","p":1,"en":"remain flat / stay at / stand at / stabilize","zh":"持平（4 个）","tip":"例：The figure stood at roughly 30% throughout the period. / It stayed relatively flat at 50% in 2021 and 2022.","sr":"主补","alts":["remain flat","stay at","stand at","stabilize"],"q":"动态图 · 某段时间「持平」（示范）","eg":"The figure stood at roughly 30% throughout the period.","egzh":"该数值在整个时期基本维持在 30% 左右。（示范）"},{"id":"c_fluct","g":"v_fluct","p":1,"en":"vary / rise and fall / fluctuate","zh":"波动（3 个）","tip":"例：The share fluctuated between 10% and 15%. / The level fluctuated notably in the latter years, dropping to 50% before recovering to 55%.","sr":"主补","alts":["vary","rise and fall","fluctuate"],"q":"动态图 · 「来回波动」（示范）","eg":"The share fluctuated between 10% and 15% over the decade.","egzh":"该比例十年间在 10%—15% 之间波动。（示范）"},{"id":"c_fast","g":"v_fast","p":1,"en":"sharply / markedly / notably / remarkably / significantly / dramatically","zh":"迅速地（6 个）","tip":"全放动词后。例：The number of rural parcels rose dramatically after 2019. 三个数据要配三种，别一段里全用 significantly。","sr":"主补","alts":["sharply","markedly","notably","remarkably","significantly","dramatically"],"q":"动态图 · 「迅猛变化」（快递量示范）","eg":"The number of rural parcels rose dramatically after 2015.","egzh":"农村快递量在 2015 年后急剧上升。（示范）"},{"id":"c_slow","g":"v_slow","p":1,"en":"slightly / gradually / steadily / modestly / a modest rise","zh":"缓慢地（5 个）","tip":"例：The proportion pursuing further study rose gradually from 26.3% to 34.0%. a modest rise 是名词短语，作宾语用。","sr":"主补","alts":["slightly","gradually","steadily","modestly","a modest rise"],"q":"动态图 · 「缓慢上升」（2023 英二健康素养）","eg":"The level increased gradually from 8.8% in 2012 to 25.4% in 2021.","egzh":"该水平从 2012 年的 8.8% 逐步升至 2021 年的 25.4%。"},{"id":"c_occupy","g":"v_occupy","p":1,"en":"account for / make up / constitute","zh":"占（3 个）","tip":"例：The expenditure on housing constitutes the largest proportion of the total household income, accounting for 30%.","sr":"主补","alts":["account for","make up","constitute"],"q":"静态图 · 说「占多少」时（2024 英二 / 2026 英一）","eg":"Acquiring relevant knowledge accounts for 91.3% of students' gains.","egzh":"获得相关知识占学生收获的 91.3%。"},{"id":"c_ratio","g":"v_ratio","p":1,"en":"proportion / percentage / share / ratio","zh":"比例（4 个）","tip":"占比用 proportion / percentage / share；两两对比才用 ratio（The ratio of A to B was roughly 1 to 2）。","sr":"主补","alts":["proportion","percentage","share","ratio"],"q":"静态图 · 比例 / 份额（两两对比才用 ratio）","eg":"The proportion of graduates pursuing further study rose to 34.0%, while the share starting a business stayed below 3%.","egzh":"深造比例升至 34.0%，而创业份额不足 3%。（示范）"},{"id":"c_peak","g":"v_peak","p":1,"en":"peak at / reach a peak of / hit a record high / reach an all-time high","zh":"峰值（4 个）","tip":"例：The volume peaked at 83 billion parcels in 2019. / Overall, the figure climbed to a peak of 62% before falling to 50%.","sr":"主补","alts":["peak at","reach a peak of","hit a record high","reach an all-time high"],"q":"动态图 · 「达到峰值」（快递量示范）","eg":"The volume peaked at 83 billion parcels in 2019.","egzh":"快递量在 2019 年达到 830 亿件的峰值。（示范）"},{"id":"c_trough","g":"v_trough","p":1,"en":"bottom out at / hit a trough / fall to a low","zh":"谷值（3 个）","tip":"bottom out 是「触底（后回升）」，别当普通下降用。","sr":"主补","alts":["bottom out at","hit a trough","fall to a low"],"q":"动态图 · 「触底后回升」（示范）","eg":"The figure bottomed out at 5% in 2015 before rising again.","egzh":"该数值 2015 年触底至 5%，随后再度上升。（示范）"},{"id":"c_time","g":"v_time","p":1,"en":"between A and B / from A to B / during the period from A to B / throughout the past XX years","zh":"时间（4 个）","tip":"例：During the period from 2013 to 2018, graduates' choices underwent dramatic changes. 静态图无年份，直接省略时间。","sr":"主补","alts":["between A and B","from A to B","during the period from A to B","throughout the past XX years"],"q":"动态图 · 时间跨度（2019 英二 / 2023 英二）","eg":"During the period from 2013 to 2018, graduates' choices underwent significant changes.","egzh":"2013—2018 年间，毕业生去向发生了显著变化。"},{"id":"c_mult","g":"v_mult","p":1,"en":"A doubled / tripled / A is X times as high as B / A is X times the figure for B / A outnumbered B by a large margin / A increased by XX / A increased to XX","zh":"倍数与比较（7 组）","tip":"2 倍 twice，3 倍 triple，4 倍以上 four times；increased by 是「增了」，increased to 是「增到」。例：The number of rural parcels more than doubled, from 1.2 billion to 3 billion.","sr":"主补","alts":["doubled","tripled","is X times as high as","is X times the figure for","outnumbered by a large margin","increased by","increased to"],"q":"倍数与比较 · 差距悬殊时（示范）","eg":"The number of online course takers is four times as high as that of offline ones.","egzh":"在线课程人数是线下课程的四倍。（示范，倍数按题目换）"},{"id":"c_rank","g":"v_rank","p":1,"en":"rank first / top the list / follow closely behind / the largest share / the lion's share","zh":"排序（5 个）","tip":"例：Watching TV tops the list among the leisure activities of the elderly. the lion's share 是「最大的一份」，偏书面。","sr":"主补","alts":["rank first","top the list","follow closely behind","the largest share","the lion's share"],"q":"静态图 · 排名（2024 英二 / 2026 英一）","eg":"Acquiring relevant knowledge tops the list, at 91.3%, followed by improving practical skills at 84.8%.","egzh":"获得相关知识以 91.3% 居首，其次是 84.8% 的提高实践技能。"},{"id":"c_approx","g":"v_approx","p":1,"en":"approximately / roughly / nearly / just over / just under","zh":"约数（5 个）","tip":"例：The figure stood at just over 60%. / nearly twice 是「接近两倍」，别写成 almost two times。","sr":"主补","alts":["approximately","roughly","nearly","just over","just under"],"q":"静态图 · 约数（数字不整时）","eg":"The figure stood at just over 60%.","egzh":"该数值略高于 60%。（示范）"},{"id":"c_present","g":"v_present","p":1,"en":"As is shown / illustrated / depicted / revealed in the chart","zh":"图表呈现（总起前半句）","tip":"同族：The chart shows / reflects / presents / exhibits / reveals。这组是总起句的两种开头骨架。","sr":"主补","alts":["As is shown in the chart","As is illustrated in the chart","As is depicted in the chart","As is revealed in the chart","The chart shows","The chart reflects","The chart presents","The chart exhibits","The chart reveals"],"q":"图表开头 · 「图表显示了」（全部图表题）","eg":"As is shown in the chart, graduates' choices changed significantly from 2013 to 2018.","egzh":"如图所示，毕业生去向在 2013—2018 年间发生了显著变化。"},{"id":"c_contrast","g":"v_contrast","p":1,"en":"whereas / while / in contrast / by contrast / meanwhile / on the contrary","zh":"对比衔接（6 个）","tip":"例：The proportion entering the workforce fell to 60.7%, whereas that pursuing further study rose to 34.0%. on the contrary 语气最强，用于反驳。","sr":"主补","alts":["whereas","while","in contrast","by contrast","meanwhile","on the contrary"],"q":"对比衔接 · 一句里两个方向（2019 英二）","eg":"The proportion entering the workforce fell to 60.7%, whereas that pursuing further study rose to 34.0%.","egzh":"就业比例降至 60.7%，而深造比例升至 34.0%。"},{"id":"c_trendnp","g":"v_trendnp","p":1,"en":"The period from A to B witnessed / experienced a sharp rise / a steady decline / a dramatic surge","zh":"趋势名词短语（3＋3）","tip":"主语是时间段，谓语 witnessed / experienced，后面接名词短语。例：The period from 2012 to 2021 witnessed a steady rise in the health literacy level of Chinese residents.","sr":"主补","alts":["witnessed a sharp rise","experienced a steady decline","witnessed a dramatic surge"],"q":"趋势名词短语 · 主语是时间段（2023 英二）","eg":"The period from 2012 to 2021 witnessed a steady rise in residents' health literacy.","egzh":"2012—2021 年间，居民健康素养稳步上升。"},{"id":"d_k1","g":"r_cause","p":1,"en":"innumerable / countless / abundant / adequate / sufficient / a host of / a variety of / plenty of","zh":"many 的同族（8 个）","tip":"原句 There are many reasons to explain my idea. 换 many 最省力。a host of / a variety of 后面接复数名词。","sr":"主补"},{"id":"d_k2","g":"r_cause","p":1,"en":"factor / cause","zh":"reason 的同族","tip":"factor 更客观，cause 更直接；Several factors contribute to this phenomenon 用的就是 factor。","sr":"主补"},{"id":"d_k3","g":"r_cause","p":1,"en":"contribute / give rise to / account for","zh":"explain 的同族","tip":"account for 还有「占（比例）」的意思，写原因时用 contribute to 最稳。","sr":"主补"},{"id":"d_k4","g":"r_cause","p":1,"en":"standpoint / perspective / viewpoint / opinion","zh":"idea 的同族","tip":"from my perspective 就是这组里的；观点题把 phenomenon 换成 viewpoint 时搭配更顺。","sr":"主补"},{"id":"d_k5","g":"r_link","p":1,"en":"To begin with, … What's more, … Last but not least, …","zh":"连接词组 1（主背）","tip":"对应新主套：To begin with＝原因 1 举例；What's more＝原因 2 说理；Last but not least＝原因 3 群众路线。","sr":"精选"},{"id":"d_k6","g":"r_link","p":2,"en":"Firstly, … Secondly, … Thirdly, …","zh":"连接词组 2","tip":"最朴素，英二两点原因时用 Firstly / Secondly 也够。","sr":"主补"},{"id":"d_k7","g":"r_link","p":2,"en":"To begin with, … More importantly, … Most importantly, …","zh":"连接词组 3","tip":"递进关系，语气一层比一层重。","sr":"主补"},{"id":"d_k8","g":"r_link","p":2,"en":"For one thing, … For another, …","zh":"连接词组 4","tip":"两点原因专用；第三段「政府 + 个人」两句也是这一组。","sr":"主补"},{"id":"d_k9","g":"r_link","p":2,"en":"First and foremost, … Furthermore, … Last but not least, …","zh":"连接词组 5","tip":"First and foremost 比 To begin with 更正式，篇幅够时可用。","sr":"主补"},{"id":"d_k10","g":"r_phrase","p":1,"en":"be interested in / be passionate about / be enthusiastic about / be addicted to","zh":"兴趣热爱类（4）","tip":"be passionate about 最常用；be addicted to 只用于负面题（网络成瘾、手机）。","sr":"主补"},{"id":"d_k11","g":"r_phrase","p":1,"en":"place a high priority on / attach importance to / place a high value on / value ... highly","zh":"高度重视类（4）","tip":"attach importance to 是第三段个人措施那句的动词；place a high priority on 配家乡、政府等主体更自然。","sr":"主补"},{"id":"d_k12","g":"r_phrase","p":1,"en":"be committed to / dedicate oneself to / be occupied with / be engaged in","zh":"致力投入类（4）","tip":"be committed to 后面接动名词（to 是介词）：is committed to improving elderly care。","sr":"主补"},{"id":"d_k13","g":"r_phrase","p":1,"en":"be tired of / be bored with / be indifferent to","zh":"负面倦怠类（3）","tip":"be indifferent to 漠不关心，配「公众忽视某问题」这类句子。","sr":"主补"},{"id":"d_k14","g":"r_which","p":1,"en":"For example / For instance / This point can be confirmed by the example of my roommate / To give a common example","zh":"引出例子的四种说法","tip":"主背用 For instance；This point can be confirmed by the example of… 适合正式一点的段落。","sr":"主补"},{"id":"d_k15","g":"r_which","p":1,"en":"enables sb. to do / provides sb. with sth. / ensures the safety and well-being of the elderly / helps the elderly maintain their independence / makes him fail the final exam","zh":"which 后的动词与搭配（5）","tip":"enable sb. to do（help 后可省 to）；ensure 后面直接接名词；负面结果用 makes him fail… 这类。","sr":"主补"},{"id":"d_k16","g":"r_clause","p":1,"en":"It is widely believed that … / It is generally agreed that … / It is well known that … / It has been widely accepted that …","zh":"主语从句（4）","tip":"形式主语 it 放句首，真正主语放句末，防头重脚轻。","sr":"主补"},{"id":"d_k17","g":"r_clause","p":1,"en":"There is no doubt that … / Nobody can deny that … / An increasing number of people are beginning to realize that … / We must acknowledge the fact that … / We cannot ignore the fact that …","zh":"宾语从句（5）","tip":"There is no doubt that 最短最硬；An increasing number of people are beginning to realize that 后面接完整句子。","sr":"主补"},{"id":"d_k18","g":"r_clause","p":1,"en":"Definitely no one can deny the fact that … / A rising number of individuals are coming to the realization that … / We are faced with the undeniable fact that … / There is a growing recognition that …","zh":"同位语从句（4）","tip":"原因 2 主背那句就是同位语从句；任选三个记住即可，不必学语法。","sr":"主补"},{"id":"d_k19","g":"r_colloc","p":1,"en":"play a crucial / vital / pivotal / fundamental / central role in 某方面","zh":"起关键作用（5 个形容词）","tip":"crucial 最稳，vital 次之；pivotal / fundamental / central 想升级时换，别一段里连用两个。","sr":"主补"},{"id":"d_k20","g":"r_colloc","p":1,"en":"lay the foundation of / is a driving force behind / is the cornerstone of / act as a catalyst for","zh":"另外四种「很重要」的说法","tip":"lay the foundation of 奠定基础；is a driving force behind 是……的推动力；act as a catalyst for 起催化作用。","sr":"主补"},{"id":"d_k21","g":"r_colloc","p":1,"en":"have a beneficial influence on / contribute significantly to / bring advantages in","zh":"积极影响（3）","tip":"contribute significantly to 后面接名词或动名词。","sr":"主补"},{"id":"d_k22","g":"r_colloc","p":1,"en":"have a harmful influence on / may undermine / pose a tremendous threat to / constitute a significant menace to / be seriously destructive to","zh":"消极影响（5）","tip":"may undermine 最通用；pose a tremendous threat to 语气重，配环境、健康类。","sr":"主补"},{"id":"d_k23","g":"r_colloc","p":1,"en":"is a double-edged sword for","zh":"双刃剑（1）","tip":"争议题第二段开头一句就能用：主题词 is a double-edged sword for 某方面。","sr":"主补"},{"id":"d_k24","g":"r_colloc","p":1,"en":"某方面 is strongly dependent on / is closely tied to / is inextricably linked to 主题词","zh":"与某方面相关（3）","tip":"主语换成某方面，谓语换成这组，句子结构立刻变样；inextricably 拼写别错。","sr":"主补"},{"id":"d_k25","g":"r_measure","p":1,"en":"make strict laws / formulate policies / allocate more funds / launch public initiatives","zh":"政府作为（4 个动词短语）","tip":"It is imperative for the authorities to … to 保障主题词。四选一，按题目痛点挑：安全配 strict laws，钱配 allocate more funds。","sr":"主补"},{"id":"d_k26","g":"r_measure","p":1,"en":"We should also raise public awareness of 主题词. / It is high time that we raised public consciousness of 主题词.","zh":"公民意识（2）","tip":"It is high time that 后面用过去式 raised，这是固定虚拟。","sr":"主补"},{"id":"d_k27","g":"r_measure","p":1,"en":"It is our duty to / We are obliged to / We ought to / make concerted efforts to / take concrete steps to","zh":"个人行为的动词替换","tip":"替换 We should 与 spare no pains to；ought to 后面直接接动词原形。","sr":"主补"},{"id":"d_k28","g":"r_measure","p":1,"en":"New media platforms, ranging from short video apps to social media, should appeal to users to adopt a sustainable lifestyle. / Social media platforms should play a pivotal role in raising public awareness of …","zh":"媒体呼吁（2）","tip":"ranging from … to … 是插入语，能给句子加分；appeal to sb. to do 呼吁某人做。","sr":"主补"},{"id":"d_k29","g":"r_measure","p":1,"en":"Parents and teachers should set a good example for children in resource conservation through their own behavior. / Parents can serve as role models for their children by saving resources in daily lives.","zh":"家庭教育（2）","tip":"set a good example for / serve as role models 二选一，别都写。","sr":"主补"},{"id":"d_k30","g":"r_sum","p":1,"en":"All in all / To sum up / In general / Generally speaking / On the whole","zh":"总结段开头（5）","tip":"第三段第一句的开头，任选一个；All in all 最短。","sr":"主补"},{"id":"d_k31","g":"r_picintro","p":1,"en":"illustrated / depicted / portrayed / conveyed / described / presented / indicated / demonstrated / reflected","zh":"shown 的同族（9）","tip":"As is symbolically depicted in the picture above 里的 depicted 就是这组；depicted 与 portrayed 最像母语者写法。","sr":"主补"},{"id":"d_k32","g":"r_picintro","p":1,"en":"vividly / symbolically / subtly / clearly / distinctively","zh":"副词（5）","tip":"主背用 symbolically；背不踏实换 vividly；distinctively 偏「清晰地、独特地」。","sr":"主补"},{"id":"d_k33","g":"r_picintro","p":1,"en":"drawing / painting / photograph / cartoon","zh":"picture 的同族（4）","tip":"英一历年是漫画，用 cartoon 或 drawing 都行；photograph 只用于照片类。","sr":"主补"},{"id":"d_k34","g":"r_theme","p":1,"en":"aims to / serves to / is designed to","zh":"is to 的同族（3）","tip":"替换后必须删掉 The purpose of，否则语义重复：The drawing aims to remind us that…","sr":"主补"},{"id":"d_k35","g":"r_theme","p":1,"en":"message / implication / primary intention / symbolic meaning","zh":"purpose 的同族（4）","tip":"The message of the drawing is that… / The symbolic meaning of the picture is that…","sr":"主补"},{"id":"d_k36","g":"r_theme","p":1,"en":"convince / highlight the fact","zh":"remind 的同族（2）","tip":"convince 要删掉 us：The drawing aims to convince the public that…；highlight the fact 后接 that 从句。","sr":"主补"},{"id":"d_k37","g":"r_theme","p":1,"en":"the public / the whole society / urban residents / rural residents / offspring / teenagers and youngsters / undergraduates / experts / customers","zh":"us（提醒对象）的同族（9）","tip":"越具体越好：24、25 年用 residents，23 年用 rural residents，22 年用 undergraduates。不要一律 the public。","sr":"主补"},{"id":"d_k38","g":"r_center","p":1,"en":"vital / critical / indispensable / significant / irreplaceable","zh":"important 的同族（5）","tip":"主背用 indispensable（不可或缺）；irreplaceable 不可替代，配「传统、亲情、老师」类。","sr":"主补"},{"id":"d_k39","g":"r_center","p":1,"en":"phenomenon / subject / situation / issue / scene / circumstance / it","zh":"problem 的同族（7）","tip":"the subject deserves the highest level of attention 里的 subject 就是这组；problem 太重，尽量别用。","sr":"主补"},{"id":"d_k40","g":"r_adj","p":2,"en":"lovely as well as cute / graceful as well as elegant / active as well as vigorous / amiable as well as friendly / aspiring as well as ambitious / passionate as well as aggressive / confident as well as optimistic","zh":"正面形容词（7 组）","tip":"结构：形容词 1 + as well as + 形容词 2，插在主体后，只用于人或拟人主体。","sr":"主补"},{"id":"d_k41","g":"r_adj","p":2,"en":"cruel as well as vicious / negative as well as passive / disgraceful as well as dishonorable / unconfident as well as pessimistic / ugly as well as disgusting / terrible as well as horrible","zh":"负面形容词（6 组）","tip":"负面题（沉迷手机、冷漠、拖延）才用；正面题硬塞会跑题。","sr":"主补"},{"id":"d_k42","g":"r_meta","p":3,"en":"engine → 意志品质类 / lighthouse → 心态态度类 / foundation → 品德修养类 / compass → 思维认知类 / engine·bridge → 行动实践类 / bridge → 人际与社会类","zh":"意象—话题适配（6 类）","tip":"意志（坚持、毅力、自律、勇气）配 engine；心态（自信、乐观、好奇心）配 lighthouse；品德（诚信、道德）配 foundation；思维（批判性思维、反思、知识）配 compass；行动（实践、计划）配 engine 或 bridge；合作与创新配 bridge。","sr":"精选"},{"id":"d_k43","g":"r_dispute","p":3,"en":"In fact, this issue remains controversial. / When it comes to 主题词, opinions vary widely.","zh":"争议题过渡（2）","tip":"比 Every situation has its pros and cons 更短，适合篇幅紧的作文。","sr":"主补"},{"id":"d_k44","g":"r_detail","p":2,"en":"with a sweet smile on his face / with a confident smile on his face / with determination in his eyes / with an excited expression on her face / with curiosity in his eyes / with confusion on her face / with a worried look on his face / with tears in her eyes","zh":"图画细节（8 条）","tip":"对应真题：自信 07、坚持 19、龙舟 23、选课 18、听讲座 22、习惯 20、养老足球赛 05；想不起来可以整条省略。","sr":"精选"},{"id":"d_k45","g":"r_elem","p":1,"en":"stand / sit / lie / run / stay","zh":"基本动作（5）","tip":"描述主体的存在方式，放句首构成倒装：in front of us stands a young man。","sr":"主补"},{"id":"d_k46","g":"r_elem","p":1,"en":"listen / talk / read / write / wear / stare / think","zh":"主要动作（7）","tip":"作者想突出的动作，用 doing 形式跟在主体后：talking about campus lectures。","sr":"主补"},{"id":"d_k47","g":"r_elem","p":1,"en":"in front of us / in the middle of the picture","zh":"万能环境（2）","tip":"环境看不清就用这两个；清晰就写具体（on the playground / in front of the board）。","sr":"主补"},{"id":"d_k48","g":"r_elem","p":2,"en":"One argues that … / the other maintains that … / point out","zh":"对话转述动词（3）","tip":"contend / assert / claim / declare / state / is convinced that 同义，不必背；对比关联词 By contrast / However / Meanwhile / On the contrary / Conversely，相似用 Similarly / Likewise。","sr":"精选"},{"id":"d_f24","g":"p2","p":3,"en":"Compared with B, A can 小方面, thereby doing 大方面.","zh":"与 B 相比，A 能……，从而……。","tip":"thereby + doing 结果状语，比 so as to 更书面。没有对比可以自己造对比：Compared with traditional human care / Compared with indoor activities。","sr":"主补","alts":["thereby relieving the burden","thereby promoting their all-round development"],"q":"2018 英一选课 / 2024 英一公园（自己造一组对比）","eg":"Compared with simple lessons, difficult courses can develop students' critical thinking skills, so as to expand their horizons.","egzh":"与简单课程相比，困难课程能培养学生的批判性思维，从而开拓视野。"},{"id":"d_m11","g":"p4_pic","p":2,"en":"The importance of 主题词 should never be underestimated by 某人.","zh":"主题词的重要性绝不应被某人低估。","tip":"双重否定变体 1，与 At no time should we underestimate 同源，换成被动更稳。","sr":"主补","alts":["should never be underestimated"],"q":"养老机器人 · 双重否定变体（语气更硬）","eg":"The importance of elderly-care robots should never be underestimated by anyone.","egzh":"任何人都绝不应低估养老机器人的重要性。（示范）"},{"id":"d_vn1","g":"v_noun","p":2,"en":"attitudes / concerns / choices / preferences","zh":"态度 / 担忧 / 选择 / 偏好","tip":"抽象类。题目问「态度、担忧、选择、偏好」时直接对号入座，比写 opinions 准。","sr":"主补","alts":["attitudes","concerns","choices","preferences"],"q":"2026 英一 · 态度 / 担忧 / 选择 / 偏好类题","eg":"The chart on the left illustrates consumers' attitudes towards elderly-care robots, while the right one lists their major concerns.","egzh":"左图展示消费者对养老机器人的态度，右图列出其主要顾虑。"},{"id":"d_vn2","g":"v_noun","p":2,"en":"changes / trends / fluctuations","zh":"变化 / 趋势 / 波动","tip":"动态类。一张图一直在动就说 changes，方向不明就 trends，来回起落才用 fluctuations。","sr":"主补","alts":["changes","trends","fluctuations"],"q":"2019 英二 · 变化 / 趋势 / 波动类题","eg":"The chart above illustrates the changes in graduates' choices from 2013 to 2018.","egzh":"上方图表展示了 2013—2018 年毕业生去向的变化。"},{"id":"d_k49","g":"r_link","p":2,"en":"Similarly / Likewise / Conversely / However / Moreover / Furthermore / At the same time","zh":"相似 · 对比 · 递进 关联词","tip":"两幅图之间串联用：相似 Similarly / Likewise，相反 Conversely / However，递进 Moreover / Furthermore，同时 Meanwhile / At the same time。","sr":"主补","alts":["Similarly","Likewise","Conversely","However","Moreover","Furthermore","At the same time"]},{"id":"d_k50","g":"r_which","p":2,"en":"improve / enhance / promote / boost / cultivate / facilitate / indicate / demonstrate","zh":"提升类动词 · not only 句里 increase 的替换","tip":"Not only does 主题词 increase 某方面 里的 increase 从这八个挑。indicate / demonstrate 偏「表明」，用在「说明问题」而不是「提升」。","sr":"主补","alts":["improve","enhance","promote","boost","cultivate","facilitate","indicate","demonstrate"]},{"id":"d_k51","g":"r_which","p":2,"en":"help / allow / encourage / deepen / promote / relieve","zh":"使役类动词 · enable 的替换","tip":"but it also enables them to 里的 enable 替换。relieve 接压力 / 负担，deepen 接理解 / 友谊，别乱配。","sr":"主补","alts":["help","allow","encourage","deepen","promote","relieve"]},{"id":"d_k52","g":"r_measure","p":2,"en":"the government department concerned / cultivating citizens' consciousness","zh":"措施实施方 · 有关部门 / 培养公民意识","tip":"When it comes to concrete solutions 句式里，A 位放 the government department concerned（有关部门），C 位放 cultivating citizens' consciousness（培养公民意识），一句话就有对比。","sr":"主补","alts":["the government department concerned","cultivating citizens' consciousness"]},{"id":"d_k53","g":"r_measure","p":2,"en":"raising public awareness / promoting civic awareness / setting rules based on scenic location","zh":"措施落地说法 · 提意识 / 立规矩","tip":"On the surface 句式里的两个措施：一个管规则（setting rules based on scenic location），一个管意识（raising public awareness / promoting civic awareness）。措施写不具体时就靠这几句撑住。","sr":"主补","alts":["raising public awareness","promoting civic awareness","setting rules based on scenic location"]},{"id":"d_k54","g":"r_elem","p":2,"en":"believe / contend / assert / claim / declare / state / point out","zh":"认为类转述动词（7）","tip":"图画对话转述用。contend / assert / claim 比 say 高级，declare / state 偏正式，point out 是「指出」。原库只给了 One argues / the other maintains，这一组是整排同族。","sr":"主补","alts":["believe","contend","assert","claim","declare","state","point out"]},{"id":"d_t1","g":"r_topic","p":2,"en":"persistence / perseverance / tenacity / self-discipline / courage / patience / effort / ambition","zh":"意志品质类主题词（8）","tip":"意志品质类：比喻配 engine。真题里「坚持、毅力、自律、勇气」都归这一类，第二段讲内驱力。","sr":"主补","alts":["persistence","perseverance","tenacity","self-discipline","courage","patience","effort","ambition"]},{"id":"d_t2","g":"r_topic","p":2,"en":"confidence / optimism / a positive mindset / curiosity","zh":"心态态度类主题词（4）","tip":"心态类：比喻配 lighthouse。写「积极心态、自信、好奇心」时用，第二段讲心理状态。","sr":"主补","alts":["confidence","optimism","a positive mindset","curiosity"]},{"id":"d_t3","g":"r_topic","p":2,"en":"integrity / moral principles / ethics / trust","zh":"品德修养类主题词（4）","tip":"品德类：比喻配 foundation。第三段措施最好写「教育 + 示范」，因为品德靠养成。","sr":"主补","alts":["integrity","moral principles","ethics","trust"]},{"id":"d_t4","g":"r_topic","p":2,"en":"critical thinking / introspection / reflection / knowledge / learning / education","zh":"思维认知类主题词（6）","tip":"思维类：比喻配 compass。批判性思维、反思、知识学习都归这里。","sr":"主补","alts":["critical thinking","introspection","reflection","knowledge","learning","education"]},{"id":"d_t5","g":"r_topic","p":2,"en":"action / practice / planning / strategy / execution","zh":"行动实践类主题词（5）","tip":"行动类：比喻配 engine / bridge。劳动实践、执行力这类题专用。","sr":"主补","alts":["action","practice","planning","strategy","execution"]},{"id":"d_t6","g":"r_topic","p":2,"en":"cooperation / collaboration / teamwork / communication / guidance / innovation / reform / technology / entrepreneurship","zh":"人际与社会类主题词（9）","tip":"人际社会类：比喻配 bridge。合作、沟通、创新、改革都归这一类。","sr":"主补","alts":["cooperation","collaboration","teamwork","communication","guidance","innovation","reform","technology","entrepreneurship"]},{"id":"d_k55","g":"r_think","p":2,"en":"人与自我 · 人与他人 · 人与社会 · 人与自然","zh":"四维思路（第二段找原因）","tip":"第二段没话说时按四层各写一句：自我（quality of life / skills / health）、他人（family bonding / relieve the burden）、社会（aging society / public services / innovation）、自然（connection with nature）。历年主题跑不出这四层。","sr":"主补","alts":[]},{"id":"e_m_call_01","g":"x2_call","p":1,"en":"Dear Mr. Lee／Dear Ms. Lee","zh":"只知道姓：男用 Mr. Lee，女用 Ms. Lee","tip":"印刷页 3 称呼表第 1 种。","sr":"小作文"},{"id":"e_m_call_02","g":"x2_call","p":2,"en":"Dear Paul／John","zh":"只知道名：直接写名","tip":"第 2 种。写给同学、朋友一律用名。","sr":"小作文"},{"id":"e_m_call_03","g":"x2_call","p":1,"en":"Dear Manager／President／Editor／Professor","zh":"只知道职位：经理 / 主席校长 / 编辑 / 教授","tip":"第 3 种。不知道该写谁的名字时，用职位。","sr":"小作文"},{"id":"e_m_call_04","g":"x2_call","p":1,"en":"Dear Sir or Madam","zh":"啥也不知道：不知姓名、不知性别","tip":"第 4 种，最保险的一句。","sr":"小作文"},{"id":"e_m_call_05","g":"x2_call","p":2,"en":"Dear Friends","zh":"写给一群人：同学们、朋友们","tip":"第 4 种里的群体称呼，通知、告示常用。","sr":"小作文"},{"id":"e_m_bg_01","g":"x3_bg","p":1,"en":"Thanks for your email. I'm so pleased/ glad/excited/sorry/disappointed to hear that...","zh":"谢谢你来信，我很高兴 / 开心 / 激动 / 抱歉 / 失望听到……","tip":"① 积极方向的主背句。后面的心情按题干选一个。","sr":"小作文"},{"id":"e_m_bg_02","g":"x3_bg","p":2,"en":"Thank you for sharing 某事 with me. I truly enjoyed it.","zh":"感谢你跟我分享……，我真的很喜欢。","tip":"① 积极方向备用。对方分享照片 / 视频 / 经历时用（2026 英语二）。","sr":"小作文"},{"id":"e_m_bg_03","g":"x3_bg","p":1,"en":"I'm sorry to hear that... ／ I must apologize for... ／ I understand your concern about...","zh":"我很抱歉得知……／ 我必须为……道歉 ／ 我理解您对……的担忧","tip":"② 消极方向主背：对方投诉、坏消息、或自己有错。","sr":"小作文"},{"id":"e_m_bg_04","g":"x3_bg","p":2,"en":"I want to express my 心情 through this letter regarding 主题词 that...","zh":"我想通过这封信表达我对「主题词」的「心情」。","tip":"② 消极方向备用。心情可选 disappointment / displeasure / apology / regret。","sr":"小作文"},{"id":"e_m_bg_05","g":"x3_bg","p":1,"en":"I hope this letter/email finds you well and...","zh":"展信佳（祝看到这封信的你一切安好），并且……","tip":"③ 通用寒暄主背，什么题型都能接。","sr":"小作文"},{"id":"e_m_bg_06","g":"x3_bg","p":2,"en":"It gives me great pleasure to write to you.","zh":"能给您写这封信，我倍感荣幸。","tip":"③ 通用寒暄备用，正式一点的场合用。","sr":"小作文"},{"id":"e_m_bg_07","g":"x3_bg","p":3,"en":"It was a great pleasure to receive your email.","zh":"收到您的来信，我深感愉快。","tip":"寒暄的同义变体。","sr":"小作文"},{"id":"e_m_bg_08","g":"x3_bg","p":1,"en":"... — it was really wonderful and made me happy.","zh":"……它真的很棒，让我感到开心。","tip":"④ 拉长版：接在上句后面把话说圆，不拉长也行。","sr":"小作文"},{"id":"e_m_bg_09","g":"x3_bg","p":3,"en":"... — the beautiful scenery and the happy faces impressed me deeply.","zh":"……美丽的风景和开心的笑脸让我印象深刻。","tip":"④ 拉长的同义变体。","sr":"小作文"},{"id":"e_m_intent_01","g":"x4_intent","p":1,"en":"I am writing this letter in order to 某事. ／ I am writing to 某事.","zh":"我写这封信是为了……（后面直接接下面的功能短语）","tip":"被动写信（答复信）无需自我介绍，直入主题。","sr":"小作文"},{"id":"e_m_intent_02","g":"x4_intent","p":2,"en":"The purpose of this letter is to 某事.","zh":"本信旨在……","tip":"正式度更高的开头，严肃场合用它。","sr":"小作文"},{"id":"e_m_intent_03","g":"x4_intent","p":2,"en":"I am writing with the intention of 某事.","zh":"我写此信意在……","tip":"同上，正式开头第二选。","sr":"小作文"},{"id":"e_m_intent_04","g":"x4_intent","p":2,"en":"It is my honor to invite you to join in 某活动／visit 某地.","zh":"我很荣幸地邀请您参加某活动 / 参观某地。","tip":"邀请、通知专用的正式开头；It is my honor to 可换 It gives me immense pleasure to。","sr":"小作文"},{"id":"e_m_intent_05","g":"x4_intent","p":3,"en":"I am writing to express my gratitude ／ appreciate your generosity.","zh":"感谢。接在 I am writing to 后面取一条即可。","tip":"讲义印刷页 7–8 的功能短语表（约 30 条），认识即可、按用途取一条。","sr":"小作文"},{"id":"e_m_intent_06","g":"x4_intent","p":3,"en":"I am writing to clarify some misunderstandings ／ apologize for my mistake.","zh":"道歉。接在 I am writing to 后面取一条即可。","tip":"讲义印刷页 7–8 的功能短语表（约 30 条），认识即可、按用途取一条。","sr":"小作文"},{"id":"e_m_intent_07","g":"x4_intent","p":3,"en":"I am writing to congratulate you on your success.","zh":"祝贺。接在 I am writing to 后面取一条即可。","tip":"讲义印刷页 7–8 的功能短语表（约 30 条），认识即可、按用途取一条。","sr":"小作文"},{"id":"e_m_intent_08","g":"x4_intent","p":3,"en":"I am writing to express my sympathy ／ extend my condolences for your loss.","zh":"慰问。接在 I am writing to 后面取一条即可。","tip":"讲义印刷页 7–8 的功能短语表（约 30 条），认识即可、按用途取一条。","sr":"小作文"},{"id":"e_m_intent_09","g":"x4_intent","p":3,"en":"I am writing to suggest some improvements ／ make several suggestions about the plan.","zh":"建议。接在 I am writing to 后面取一条即可。","tip":"讲义印刷页 7–8 的功能短语表（约 30 条），认识即可、按用途取一条。","sr":"小作文"},{"id":"e_m_intent_10","g":"x4_intent","p":3,"en":"I am writing to seek your advice on the matter ／ ask for your suggestions about it.","zh":"征求（意见）。接在 I am writing to 后面取一条即可。","tip":"讲义印刷页 7–8 的功能短语表（约 30 条），认识即可、按用途取一条。","sr":"小作文"},{"id":"e_m_intent_11","g":"x4_intent","p":3,"en":"I am writing to complain about the service ／ express my dissatisfaction with the product.","zh":"投诉。接在 I am writing to 后面取一条即可。","tip":"讲义印刷页 7–8 的功能短语表（约 30 条），认识即可、按用途取一条。","sr":"小作文"},{"id":"e_m_intent_12","g":"x4_intent","p":3,"en":"I am writing to praise ／ commend your excellent customer service.","zh":"表扬。接在 I am writing to 后面取一条即可。","tip":"讲义印刷页 7–8 的功能短语表（约 30 条），认识即可、按用途取一条。","sr":"小作文"},{"id":"e_m_intent_13","g":"x4_intent","p":3,"en":"I am writing to invite you to participate in the activity ／ attend the meeting.","zh":"邀请。接在 I am writing to 后面取一条即可。","tip":"讲义印刷页 7–8 的功能短语表（约 30 条），认识即可、按用途取一条。","sr":"小作文"},{"id":"e_m_intent_14","g":"x4_intent","p":3,"en":"I am writing to inform you that the meeting will be put off ／ notify you of the change.","zh":"通知。接在 I am writing to 后面取一条即可。","tip":"讲义印刷页 7–8 的功能短语表（约 30 条），认识即可、按用途取一条。","sr":"小作文"},{"id":"e_m_intent_15","g":"x4_intent","p":3,"en":"I am writing to thank you for your invitation ／ accept ／ decline your invitation.","zh":"谢谢 / 接受 / 拒绝邀请。接在 I am writing to 后面取一条即可。","tip":"讲义印刷页 7–8 的功能短语表（约 30 条），认识即可、按用途取一条。","sr":"小作文"},{"id":"e_m_intent_16","g":"x4_intent","p":3,"en":"I am writing to inquire about the schedule of the contest.","zh":"咨询。接在 I am writing to 后面取一条即可。","tip":"讲义印刷页 7–8 的功能短语表（约 30 条），认识即可、按用途取一条。","sr":"小作文"},{"id":"e_m_intent_17","g":"x4_intent","p":3,"en":"I am writing to reply to your email ／ answer your questions.","zh":"答复。接在 I am writing to 后面取一条即可。","tip":"讲义印刷页 7–8 的功能短语表（约 30 条），认识即可、按用途取一条。","sr":"小作文"},{"id":"e_m_intent_18","g":"x4_intent","p":3,"en":"I am writing to tell you more about the plan.","zh":"告诉（详情）。接在 I am writing to 后面取一条即可。","tip":"讲义印刷页 7–8 的功能短语表（约 30 条），认识即可、按用途取一条。","sr":"小作文"},{"id":"e_m_intent_19","g":"x4_intent","p":3,"en":"I am writing to share my thoughts ／ feelings about the video.","zh":"分享（想法 / 感受）。接在 I am writing to 后面取一条即可。","tip":"讲义印刷页 7–8 的功能短语表（约 30 条），认识即可、按用途取一条。","sr":"小作文"},{"id":"e_m_intent_20","g":"x4_intent","p":3,"en":"I am writing to introduce the exhibition to you.","zh":"介绍。接在 I am writing to 后面取一条即可。","tip":"讲义印刷页 7–8 的功能短语表（约 30 条），认识即可、按用途取一条。","sr":"小作文"},{"id":"e_m_intent_21","g":"x4_intent","p":3,"en":"I am writing to recommend the book to you.","zh":"推荐。接在 I am writing to 后面取一条即可。","tip":"讲义印刷页 7–8 的功能短语表（约 30 条），认识即可、按用途取一条。","sr":"小作文"},{"id":"e_m_intent_22","g":"x4_intent","p":3,"en":"I am writing to introduce myself.","zh":"自荐。接在 I am writing to 后面取一条即可。","tip":"讲义印刷页 7–8 的功能短语表（约 30 条），认识即可、按用途取一条。","sr":"小作文"},{"id":"e_m_intent_23","g":"x4_intent","p":3,"en":"I am writing to remind you that the deadline is approaching ／ draw your attention to the date.","zh":"提醒。接在 I am writing to 后面取一条即可。","tip":"讲义印刷页 7–8 的功能短语表（约 30 条），认识即可、按用途取一条。","sr":"小作文"},{"id":"e_m_intent_24","g":"x4_intent","p":3,"en":"I am writing to request your assistance.","zh":"求助。接在 I am writing to 后面取一条即可。","tip":"讲义印刷页 7–8 的功能短语表（约 30 条），认识即可、按用途取一条。","sr":"小作文"},{"id":"e_m_intent_25","g":"x4_intent","p":3,"en":"I am writing to offer my support.","zh":"提供帮助。接在 I am writing to 后面取一条即可。","tip":"讲义印刷页 7–8 的功能短语表（约 30 条），认识即可、按用途取一条。","sr":"小作文"},{"id":"e_m_intent_26","g":"x4_intent","p":3,"en":"I am writing to apply for admission ／ a scholarship ／ a position.","zh":"求学 / 申奖 / 求职。接在 I am writing to 后面取一条即可。","tip":"讲义印刷页 7–8 的功能短语表（约 30 条），认识即可、按用途取一条。","sr":"小作文"},{"id":"e_m_intent_27","g":"x4_intent","p":3,"en":"I am writing to submit my resignation ／ formally resign from my present position.","zh":"辞职。接在 I am writing to 后面取一条即可。","tip":"讲义印刷页 7–8 的功能短语表（约 30 条），认识即可、按用途取一条。","sr":"小作文"},{"id":"e_m_intent_28","g":"x4_intent","p":3,"en":"I am writing to describe my recent plan ／ provide further details about the plan.","zh":"讲计划 / 补细节。接在 I am writing to 后面取一条即可。","tip":"讲义印刷页 7–8 的功能短语表（约 30 条），认识即可、按用途取一条。","sr":"小作文"},{"id":"e_m_intent_29","g":"x4_intent","p":3,"en":"I am writing to specify the event arrangement ／ outline my daily schedule.","zh":"说安排 / 列日程。接在 I am writing to 后面取一条即可。","tip":"讲义印刷页 7–8 的功能短语表（约 30 条），认识即可、按用途取一条。","sr":"小作文"},{"id":"e_m_intent_30","g":"x4_intent","p":3,"en":"I am writing to confirm our appointment.","zh":"确认约定。接在 I am writing to 后面取一条即可。","tip":"讲义印刷页 7–8 的功能短语表（约 30 条），认识即可、按用途取一条。","sr":"小作文"},{"id":"e_m_intent_31","g":"x4_intent","p":3,"en":"I am writing to summarize the main points of the meeting.","zh":"总结。接在 I am writing to 后面取一条即可。","tip":"讲义印刷页 7–8 的功能短语表（约 30 条），认识即可、按用途取一条。","sr":"小作文"},{"id":"e_m_intent_32","g":"x4_intent","p":3,"en":"I am writing to highlight the importance of this matter.","zh":"强调。接在 I am writing to 后面取一条即可。","tip":"讲义印刷页 7–8 的功能短语表（约 30 条），认识即可、按用途取一条。","sr":"小作文"},{"id":"e_m_intent_33","g":"x4_intent","p":3,"en":"I am writing to call on everyone to protect the environment ／ appeal to the public to save energy.","zh":"呼吁。接在 I am writing to 后面取一条即可。","tip":"讲义印刷页 7–8 的功能短语表（约 30 条），认识即可、按用途取一条。","sr":"小作文"},{"id":"e_m_self_01","g":"x5_self","p":1,"en":"I am a student from the department of Art at a university.","zh":"我是某大学艺术系的一名学生。","tip":"公务信函对方不认识你，先报身份；题干没给身份就默认学生。","sr":"小作文"},{"id":"e_m_self_02","g":"x5_self","p":2,"en":"As a student in the Art Department, I am writing to 某事.","zh":"作为艺术系的一名学生，我写此信是为了……","tip":"并入开头，与第二句合成一句，省字数。","sr":"小作文"},{"id":"e_m_self_03","g":"x5_self","p":3,"en":"I am an undergraduate at a university, majoring in Art.","zh":"我是某大学的本科生，主修艺术。","tip":"同义变体。","sr":"小作文"},{"id":"e_m_trans_01","g":"x6_trans","p":1,"en":"The primary reasons for my 建议 are as follows.","zh":"我……的主要原因如下。","tip":"第二段第一句。省略号处填名词：suggestion / complaint / invitation / gratitude / apology / application / resignation / recommendation / request / inquiry。","sr":"小作文"},{"id":"e_m_trans_02","g":"x6_trans","p":2,"en":"The details can be listed as follows.","zh":"具体细节如下所列。","tip":"
