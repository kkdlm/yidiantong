介绍安排、细节类信件用。","sr":"小作文"},{"id":"e_m_trans_03","g":"x6_trans","p":2,"en":"As for the questions you raised, here are my answers.","zh":"关于你提出的问题，我的回答如下。","tip":"答复对方提问的信专用。","sr":"小作文"},{"id":"e_m_trans_04","g":"x6_trans","p":3,"en":"There are at least two/ three factors accounting for my 建议.","zh":"至少有两 / 三个因素可以解释我的……","tip":"同义变体。","sr":"小作文"},{"id":"e_m_close_01","g":"x7_close","p":1,"en":"I would like to express my gratitude for your kind consideration of my suggestion/ application.","zh":"我想对您考虑我的建议 / 申请表示感谢。","tip":"第三段第一句：表态。通用结尾。","sr":"小作文"},{"id":"e_m_close_02","g":"x7_close","p":2,"en":"We would appreciate it very much if you could accept our invitation.","zh":"如果您能接受我们的邀请，我们将不胜感激。","tip":"邀请信结尾。","sr":"小作文"},{"id":"e_m_close_03","g":"x7_close","p":2,"en":"Please accept my sincere apology for any inconvenience that I have caused.","zh":"给您带来的不便，请接受我诚挚的歉意。","tip":"道歉信结尾。","sr":"小作文"},{"id":"e_m_close_04","g":"x7_close","p":1,"en":"Please give my best regards to your family.","zh":"请代我向你的家人致以最美好的问候。","tip":"问候家人，三句同义留这一句。","sr":"小作文"},{"id":"e_m_close_05","g":"x7_close","p":1,"en":"I am looking forward to hearing from you soon.","zh":"我期待很快收到您的来信。","tip":"第三段第二句：盼复。","sr":"小作文"},{"id":"e_m_close_06","g":"x7_close","p":2,"en":"I would be grateful if you could reply at your earliest convenience.","zh":"如果您能在方便时尽快回复，我将不胜感激。","tip":"盼复备用。","sr":"小作文"},{"id":"e_m_close_07","g":"x7_close","p":3,"en":"Your prompt reply will be highly appreciated.","zh":"非常感谢您的及时回复。","tip":"盼复同义变体。","sr":"小作文"},{"id":"e_m_close_08","g":"x7_close","p":1,"en":"Yours sincerely, Li Ming","zh":"您真诚的，李明（写在右下角）","tip":"落款固定：一般都是李明。","sr":"小作文"},{"id":"e_m_notice_01","g":"x8_notice","p":1,"en":"Notice","zh":"通知（标题居中）","tip":"格式：Notice 居中 → 正文 → 右下落款署名 + 日期。","sr":"小作文"},{"id":"e_m_notice_02","g":"x8_notice","p":1,"en":"We are pleased to announce that a 活动 will be held in our university.","zh":"我们很高兴地宣布，我校将举办一场……活动。","tip":"第一段：通知概况。","sr":"小作文"},{"id":"e_m_notice_03","g":"x8_notice","p":2,"en":"To enrich students' extracurricular life and improve communication among club members, our club will host a wonderful activity.","zh":"为了丰富学生的课外生活，增进社团成员之间的交流与合作，我们社团将举办一场精彩的活动。","tip":"带目的状语开头。","sr":"小作文"},{"id":"e_m_notice_04","g":"x8_notice","p":1,"en":"The relevant matters are hereby notified as follows.","zh":"现将相关事宜通知如下。","tip":"第一段收尾，接第二段。","sr":"小作文"},{"id":"e_m_notice_05","g":"x8_notice","p":2,"en":"This notice is intended to introduce some details of this contest.","zh":"本通知旨在介绍本次比赛的一些细节。","tip":"同上，备用。","sr":"小作文"},{"id":"e_m_notice_06","g":"x8_notice","p":1,"en":"If you are passionate about 某事, this is an ideal opportunity for you! To apply, please email us at 123456@qq.com. Join us today, and make a difference in enhancing 某事.","zh":"如果你对……充满热情，这对你来说是个理想的机会！报名请发邮件至 123456@qq.com。今天就加入我们，在……方面有所改变。","tip":"第三段：发出邀请 + 报名方式（可整段背）。","sr":"小作文"},{"id":"e_m_notice_07","g":"x8_notice","p":2,"en":"We look forward to your active participation and believe this activity will bring you an unforgettable experience! Please scan the QR code below to sign up!","zh":"期待大家的积极参与，相信本次活动将带给大家难忘的体验！请扫描下方二维码报名！","tip":"第三段备用。","sr":"小作文"},{"id":"e_m_notice_08","g":"x8_notice","p":3,"en":"Please arrange your time in advance and attend the activity on time.","zh":"请各位成员提前安排好时间，准时参加活动。","tip":"通知专属万能句，字数不够时补在第二段末尾。","sr":"小作文"},{"id":"e_m_notice_09","g":"x8_notice","p":3,"en":"During the activity, please abide by the on-site order and follow the arrangements of the staff.","zh":"活动期间，请遵守现场秩序，听从工作人员的安排。","tip":"通知专属万能句。","sr":"小作文"},{"id":"e_m_minutes_01","g":"x9_minutes","p":1,"en":"Minutes of Meeting","zh":"会议纪要（标题居中）","tip":"格式：标题居中；下面六行抬头 Date / Time / Location / Objective / Attendees / Meeting content；正文后右下 Recorded by: 署名 + 日期。","sr":"小作文"},{"id":"e_m_minutes_02","g":"x9_minutes","p":2,"en":"Date: December 23, 2023 ／ Time: From 10:00 a.m. to 11:30 a.m. ／ Location: A111, conference room ／ Objective: 会议主题 ／ Attendees: All freshmen","zh":"日期 / 时间 / 地点 / 会议主题 / 参会人 五行抬头（按题干改写）","tip":"抬头照抄格式，内容来自题干。","sr":"小作文"},{"id":"e_m_minutes_03","g":"x9_minutes","p":1,"en":"The meeting commenced with a warm welcome from the 主持人, followed by an introduction to the purpose of gathering.","zh":"主持人首先对大家的到来表示热烈欢迎，随后介绍了此次会议的目的。","tip":"正文第一句：导入介绍。","sr":"小作文"},{"id":"e_m_minutes_04","g":"x9_minutes","p":2,"en":"The 主持人 delivered welcoming remarks, and provided a brief overview of the significance of 会议主题.","zh":"主持人致欢迎辞，并简要介绍了会议主题的意义。","tip":"第一句备用。","sr":"小作文"},{"id":"e_m_minutes_05","g":"x9_minutes","p":1,"en":"The meeting aimed to discuss the problem/phenomenon of 主题词 and find some suitable solutions.","zh":"这次会议的目的是讨论主题词的问题 / 现象，并找到一些合适的解决方案。","tip":"正文第二句：会议目的。","sr":"小作文"},{"id":"e_m_minutes_06","g":"x9_minutes","p":2,"en":"The meeting aimed to briefly review the activity held last week.","zh":"本次会议的目的是对上周的活动做一个简要回顾。","tip":"第二句备用。","sr":"小作文"},{"id":"e_m_minutes_07","g":"x9_minutes","p":2,"en":"The meeting aimed to make a plan for the activity to be held next week.","zh":"这次会议的目的是为下周举行的活动制定一个计划。","tip":"第二句备用。","sr":"小作文"},{"id":"e_m_minutes_08","g":"x9_minutes","p":3,"en":"Many students/ colleagues/ professors participated in the discussion.","zh":"很多同学 / 同事 / 老师参与了讨论。","tip":"第二句后可再补一句。","sr":"小作文"},{"id":"e_m_minutes_09","g":"x9_minutes","p":1,"en":"The chairman expressed the opinion that 某事.","zh":"董事长认为……","tip":"正文第三句：大佬发言；不确定是谁就用 the speaker。","sr":"小作文"},{"id":"e_m_minutes_10","g":"x9_minutes","p":1,"en":"The majority of those attendees were in favour of the statement/ plan/ decision.","zh":"大多数参会人都赞成这个表述 / 计划 / 决定。","tip":"正文第四句：手下赞同。","sr":"小作文"},{"id":"e_m_minutes_11","g":"x9_minutes","p":2,"en":"Participants engaged in an interactive discussion to address the challenges they faced during the activity.","zh":"参会人进行了互动讨论，以解决他们在活动中面临的挑战。","tip":"第四句备用。","sr":"小作文"},{"id":"e_m_minutes_12","g":"x9_minutes","p":1,"en":"As a concrete measure, the meeting decided that 某事.","zh":"作为一项具体措施，会议决定……","tip":"正文第五句：最终决定。","sr":"小作文"},{"id":"e_m_minutes_13","g":"x9_minutes","p":2,"en":"The meeting agreed to hold the activity of 某事.","zh":"会议同意举办……活动。","tip":"第五句备用。","sr":"小作文"},{"id":"e_m_minutes_14","g":"x9_minutes","p":3,"en":"The date and location of the next meeting will be announced via email to all participants.","zh":"下次会议的日期和地点将通过电子邮件通知所有参会者。","tip":"第六句（可选）：一次性会议不要写，例会才能写。","sr":"小作文"},{"id":"e_m_minutes_15","g":"x9_minutes","p":1,"en":"Recorded by: Li Ming ／ December 23, 2023","zh":"记录人：李明 / 日期（写在右下角）","tip":"纪要落款固定这一行。","sr":"小作文"},{"id":"e_q_pool1_01","g":"x6_1","p":1,"en":"The meeting will be held in 地点 at 8:00 a.m. on Sunday, December 19th.","zh":"会议将会在 12 月 19 日周日于 某地 举行。","tip":"★主背。第1句。","sr":"小作文"},{"id":"e_q_pool1_02","g":"x6_1","p":2,"en":"Our university will host the 活动 in 地点 on Sunday, December 19th.","zh":"我校将于 12 月 19 日星期日在 地点 举办 活动 。（We host 主动句式，与上句同义备用）","tip":"○备用。第2句，同组挑一句就够。","sr":"小作文"},{"id":"e_q_pool1_03","g":"x6_1","p":3,"en":"The English corner is scheduled to take place in the library on Friday from 7:00 to 8:00 p.m.","zh":"英语角定于星期 五晚上 7 点到 8 点在图书馆举行。","tip":"同义变体。第3句，认识即可，不必背。","sr":"小作文"},{"id":"e_q_pool1_04","g":"x6_1","p":3,"en":"On Sunday, December 19th, a departmental meeting will be held in the main hall, commencing at 8:00 a.m.","zh":"12 月 19 日周日，一场部门会议将在主会场举行，于上午 8 点开始。","tip":"同义变体。第4句，认识即可，不必背。","sr":"小作文"},{"id":"e_q_pool2_01","g":"x6_2","p":1,"en":"The purpose of the conference is to discuss 某事.","zh":"会议的目的是讨论 某事 。","tip":"★主背。第6句。","sr":"小作文"},{"id":"e_q_pool2_02","g":"x6_2","p":2,"en":"The subject/theme of the conference is 某事.","zh":"会议的主题是 某事 。（与目的句二选一）","tip":"○备用。第5句，同组挑一句就够。","sr":"小作文"},{"id":"e_q_pool2_03","g":"x6_2","p":2,"en":"Centered on the theme of..., the event aims to do Sth.","zh":"以……为主题，活动旨在……。（过去分词做状语升级版）","tip":"○备用。第5.5句，同组挑一句就够。","sr":"小作文"},{"id":"e_q_pool2_04","g":"x6_2","p":3,"en":"This conference aims to facilitate an in-depth discussion on 某事.","zh":"本次会议旨在促进关于某事的深入讨论。","tip":"同义变体。第7句，认识即可，不必背。","sr":"小作文"},{"id":"e_q_pool2_05","g":"x6_2","p":3,"en":"This event is held under the theme of \"Innovation and Future\".","zh":"本次活动在“创新与未来”的主题下举行。","tip":"同义变体。第8句，认识即可，不必背。","sr":"小作文"},{"id":"e_q_pool3_01","g":"x6_3","p":1,"en":"Students of all grades are eligible to enter the competition, including both domestic and international students.","zh":"所有年级的学生都有资格参加比赛，包括国内和国际学生。","tip":"★主背。第10句。","sr":"小作文"},{"id":"e_q_pool3_02","g":"x6_3","p":2,"en":"We have invited leading figures from various sectors, including eminent scholars, renowned entrepreneurs, and senior media representatives.","zh":"我们邀请了来自各 行业 的领军人物，包括杰出学者、知名企业家和资深媒体代表。（介绍活动规格/嘉宾用）","tip":"○备用。第11句，同组挑一句就够。","sr":"小作文"},{"id":"e_q_pool3_03","g":"x6_3","p":3,"en":"The event is anticipated to attract wide participation from both students and faculty members.","zh":"预计该活动将 吸引学生和教职工的广泛参与。","tip":"同义变体。第9句，认识即可，不必背。","sr":"小作文"},{"id":"e_q_pool3_04","g":"x6_3","p":3,"en":"This event is expected to bring together a host of distinguished guests, including leading experts and scholars in the field, who have both profound knowledge and remarkable achievements in their respective areas.","zh":"本次活动预计将汇聚众多贵宾……","tip":"同义变体。第12句，认识即可，不必背。","sr":"小作文"},{"id":"e_q_pool4_01","g":"x6_4","p":1,"en":"Interesting activities such as singing contests and debate competitions will be held to arouse students' enthusiasm for....","zh":"我们将举办有趣的活动，如歌唱比赛和辩论比赛，以激发学生对 某方面 的热情。","tip":"★主背。第13句。","sr":"小作文"},{"id":"e_q_pool4_02","g":"x6_4","p":2,"en":"The event will commence with an opening ceremony, followed by a series of workshops and a keynote speech, and will conclude with a discussion session where participants can exchange ideas.","zh":"活动将以开幕式开始，随后是一系列的研讨会和一场主题演讲。最后将以一个讨论环节收尾，参与者们可以在此交流想 法。","tip":"○备用。第15句，同组挑一句就够。","sr":"小作文"},{"id":"e_q_pool4_03","g":"x6_4","p":3,"en":"Participants will be divided into teams for a collaborative challenge, designed to foster teamwork and creative problem-solving.","zh":"团队协作类活动专用","tip":"同义变体。第14句，认识即可，不必背。","sr":"小作文"},{"id":"e_q_pool4_04","g":"x6_4","p":3,"en":"Following the opening ceremony, the event will feature a keynote speech, workshops, and a concluding discussion session for participant interaction.","zh":"与上一句同义","tip":"同义变体。第16句，认识即可，不必背。","sr":"小作文"},{"id":"e_q_pool5_01","g":"x6_5","p":1,"en":"This will be a memorable and rewarding experience and the prizes and souvenirs will be very valuable.","zh":"经历将是难忘的，奖品和纪念品将是宝贵的。","tip":"★主背。第17句。","sr":"小作文"},{"id":"e_q_pool5_02","g":"x6_5","p":2,"en":"To encourage more students to join, the top three winners will receive trophies and certificates, and all shortlisted participants will be awarded bonus points.","zh":"为了鼓励更多学生参加，前三名将获得奖杯和证书，所有入围者也都会获得加分。","tip":"○备用。第18句，同组挑一句就够。","sr":"小作文"},{"id":"e_q_pool5_03","g":"x6_5","p":3,"en":"During the event, you will have the opportunity to meet like-minded individuals, engage in interesting activities, and enjoy a great time together.","zh":"结识志同道合的人","tip":"同义变体。第19句，认识即可，不必背。","sr":"小作文"},{"id":"e_q_pool5_04","g":"x6_5","p":3,"en":"This event/activity will allow you to contribute to the development of our university while gaining valuable experience in ____.","zh":"获得经验+贡献学校） This activity offers a precious opportunity to broaden your horizons and enrich your campus life.（开阔视野、丰富 校园生活","tip":"同义变体。第20句，认识即可，不必背。","sr":"小作文"},{"id":"e_q_pool6_01","g":"x6_6","p":1,"en":"Located in ____, ____ is one of the most popular/ famous scenic spots in the world.","zh":"某地 位于……，是世界上最受欢迎/著名的景点之一。","tip":"★主背。第21句。","sr":"小作文"},{"id":"e_q_pool6_02","g":"x6_6","p":2,"en":"Written by/Directed by ____, ____ is one of the most popular/ famous books/ movies in the world.","zh":"由 XX 撰写/执导的 XX ，是世界上最受欢迎/著名的书/电影之一。","tip":"○备用。第22句，同组挑一句就够。","sr":"小作文"},{"id":"e_q_pool6_03","g":"x6_6","p":2,"en":"Shen Kuo was an outstanding scientist during the Northern Song Dynasty, who made remarkable achievements in many fields.","zh":"沈括是北宋时期杰出的科学家，在……方面取得了显著成就。","tip":"○备用。第23句，同组挑一句就够。","sr":"小作文"},{"id":"e_q_pool6_04","g":"x6_6","p":2,"en":"Planned by the Student Union, the activity is one of the most popular events in our university.","zh":"由学生会策划的这项活动，是我校最受欢迎的活动之一。","tip":"○备用。第24句，同组挑一句就够。","sr":"小作文"},{"id":"e_q_pool6_05","g":"x6_6","p":1,"en":"I would highly recommend 推荐对象 for its/her/his exceptional 特点1 and remarkable 特点2.","zh":"我强烈推荐 XX ，因为它/她/他拥有卓越的 XX 和非凡的 XX 。","tip":"★主背。第26句。","sr":"小作文"},{"id":"e_q_pool6_06","g":"x6_6","p":2,"en":"While I understand that A has advantages in ____, I believe B will provide you with a more profound and thought-provoking experience.","zh":"虽然我知道 A 在 XX 方面有优势，但我相信 B 将会带给你更深刻、更发人深省的体验。","tip":"○备用。第25句，同组挑一句就够。","sr":"小作文"},{"id":"e_q_pool6_07","g":"x6_6","p":3,"en":"What makes 推荐对象 highly recommendable is the unique experience it offers, which includes 具体环节.","zh":"XX 之所以值得高度推荐，在于它提供的独特体验，其中包括 XX。与上一句同义","tip":"同义变体。第27句，认识即可，不必背。","sr":"小作文"},{"id":"e_q_pool7_01","g":"x6_7","p":1,"en":"Over the past few years, I have consistently excelled in my role, which is evidenced by the awards and recognition I have received.","zh":"我在工作中一直表现出色，所获得的奖项和认可就是证明。【自荐/求职】","tip":"★主背。第28句。","sr":"小作文"},{"id":"e_q_pool7_02","g":"x6_7","p":2,"en":"I am a highly self-motivated and resilient individual, capable of maintaining focus and productivity in fast-paced environments. Not only am I eager to take on challenges, but I am also always ready to learn new things.","zh":"我是一个高度自律且富有韧性的人，能够在快节奏的环境中保持专注和高效。我不仅乐于迎接挑战，也始终愿意学习新事 物。","tip":"○备用。第29句，同组挑一句就够。","sr":"小作文"},{"id":"e_q_pool7_03","g":"x6_7","p":1,"en":"The selected candidates will assist in conducting surveys, collecting and analyzing data on ____. Moreover, the candidates should be enthusiastic about ____ and have sound organization and communication skills.","zh":"被选中的候选人将协助进行 XX 的调查、收集和分析数据。此外，候选人应对 XX 充满热情，","tip":"★主背。第31句。","sr":"小作文"},{"id":"e_q_pool7_04","g":"x6_7","p":2,"en":"The role requires the ability to analyze complex problems, develop practical solutions, and execute them effectively.","zh":"该职位要求具备分析复杂问题、制定切实可行方案并有效执行的能力。（正式职位描述）","tip":"○备用。第32句，同组挑一句就够。","sr":"小作文"},{"id":"e_q_pool7_05","g":"x6_7","p":2,"en":"No previous experience is required, for we will provide full training and guidance.","zh":"无需经验，我们将提供完整培训。（招募万能句）","tip":"○备用。第33.5句，同组挑一句就够。","sr":"小作文"},{"id":"e_q_pool7_06","g":"x6_7","p":3,"en":"I thrive in collaborative settings and have often been the one to facilitate communication and integrate diverse viewpoints in the team.","zh":"团队协作角度自荐，与前两句同义","tip":"同义变体。第30句，认识即可，不必背。","sr":"小作文"},{"id":"e_q_pool7_07","g":"x6_7","p":3,"en":"The candidates should be enthusiastic about 某事 and have sound organization/ communication/ teaching/ planning skills.","zh":"候选人要求单句版，已被带星句覆盖","tip":"同义变体。第33句，认识即可，不必背。","sr":"小作文"},{"id":"e_q_pool8_01","g":"x6_8","p":1,"en":"I am extremely grateful to you for your unselfish assistance/ advice during the period of....","zh":"我非常感谢您在 … 期间（学习/工作）给我的无私帮助/建议。","tip":"★主背。第34句。","sr":"小作文"},{"id":"e_q_pool8_02","g":"x6_8","p":2,"en":"Without your generous help, I would not have had such a wonderful experience.","zh":"如果没有你慷慨帮助，我就不会有如此美妙的经历。（虚拟语气感谢，2010 真题用过）","tip":"○备用。第37句，同组挑一句就够。","sr":"小作文"},{"id":"e_q_pool8_03","g":"x6_8","p":2,"en":"I assure you that I have learned a valuable lesson from this and will take concrete steps to ensure it does not happen again.","zh":"我向您保证，我已从中吸取宝贵教训，并将采取具体措施确保此类事情不再发生。（自成一句，不依赖上文）","tip":"○备用。第40句，同组挑一句就够。","sr":"小作文"},{"id":"e_q_pool8_04","g":"x6_8","p":3,"en":"It is your hospitality/ enthusiasm/ assistance that enabled me to...","zh":"强调句式感谢","tip":"同义变体。第35句，认识即可，不必背。","sr":"小作文"},{"id":"e_q_pool8_05","g":"x6_8","p":3,"en":"Without your generous help, I would not have made such great progress in...","zh":"没有你的帮助我不会取得进步） Without your timely help, I'm afraid the consequences would have been truly serious.（没有及时帮助后果严重","tip":"同义变体。第36句，认识即可，不必背。","sr":"小作文"},{"id":"e_q_pool8_06","g":"x6_8","p":3,"en":"All of us desire to improve our ability of ____ under your professional guidance.","zh":"在您指导下提升能力——邀 请信也能拍","tip":"同义变体。第38句，认识即可，不必背。","sr":"小作文"},{"id":"e_q_pool8_07","g":"x6_8","p":3,"en":"To make up for it, I am ready to immediately correct the mistake／offer my full assistance to resolve the matter.","zh":"为弥补过错立即纠正/协助解决，需承接上文道歉","tip":"同义变体。第39句，认识即可，不必背。","sr":"小作文"},{"id":"e_q_pool9_01","g":"x6_9","p":1,"en":"We are badly in need of ____, which can help us ____.","zh":"我们急需 某物 ，可用于帮助我们 做某事 。（同义：We are in urgent need of…）","tip":"★主背。第41句。","sr":"小作文"},{"id":"e_q_pool9_02","g":"x6_9","p":1,"en":"Due to ____, it is convenient/inconvenient/possible/impossible for us to ____.","zh":"由于 某物 ，我们做什么是方便的/不方便的/可能的/不可能的。","tip":"★主背。第42句。","sr":"小作文"},{"id":"e_q_pool9_03","g":"x6_9","p":1,"en":"I wonder if you can ____ so that I can ____.","zh":"我想知道你是否能 做什么 ，我就能 做什么 。","tip":"★主背。第43句。","sr":"小作文"},{"id":"e_q_pool9_04","g":"x6_9","p":1,"en":"We could have more opportunities to ____ if you improve ____.","zh":"如果你能对 某事 进行改进，我们就有更多的机会去 做某事 。","tip":"★主背。第44句。","sr":"小作文"},{"id":"e_q_pool9_05","g":"x6_9","p":1,"en":"It is advisable to ____, which can really help you ____.","zh":"做某事 是明智的，这能够帮你怎样。","tip":"★主背。第45句。","sr":"小作文"},{"id":"e_q_pool9_06","g":"x6_9","p":1,"en":"Given the fact that ____, it would be wise for us to ____.","zh":"鉴于这一事实，我们 做某事 才是明智的。","tip":"★主背。第46句。","sr":"小作文"},{"id":"e_q_pool9_07","g":"x6_9","p":1,"en":"____ provides a unique opportunity to let you explore your creativity.","zh":"XX 提供了一个独特的机会，让你可以探索自己的创造力。","tip":"★主背。第47句。","sr":"小作文"},{"id":"e_q_pool9_08","g":"x6_9","p":1,"en":"Everyone agrees that your ____ is the key to the satisfactory outcome.","zh":"大家都认为你的 ____ 是取得满意结果的关键。","tip":"★主背。第48句。","sr":"小作文"},{"id":"e_q_pool9_09","g":"x6_9","p":1,"en":"____ allows you to experience different cultures and social customs.","zh":"XX 能够让你体验不同的文化和社会习俗。","tip":"★主背。第49句。","sr":"小作文"},{"id":"e_q_pool9_10","g":"x6_9","p":1,"en":"I am confident that the students will not only have the opportunity to learn from you, but also to draw inspiration from your example.","zh":"我相信，学生们不仅有机会向您学习，而且还能从您的榜样中汲取灵感。","tip":"★主背。第50句。","sr":"小作文"}]};</script>

  function makePool(o) {
    o = o || {};

      if (o.g && c.g !== o.g) return false;
      if (o.sec && g.sec !== o.sec) return false;
      if (o.tier && c.p > o.tier) return false;
      if (o.ids && o.ids.indexOf(c.id) < 0) return false;
      return true;
    });

  function startDaily() {

    var rest = pool.filter(function (c) { return !S.c[c.id] || S.c[c.id].seen === 0; });
    rest.sort(function (a, b) { return (a.p - b.p) || 0; });
    var nl = newLeftToday();
    var q = due.concat(rest.slice(0, nl));
    if (!q.length) {
      var more = pool.filter(function (c) { var s = S.c[c.id]; return !s || s.lv <= 0; }).slice(0, 10);
      if (!more.length) { toast('全部背完了，去「测试」默写一遍'); return; }

      var sa = S.c[a.id] ? S.c[a.id].lv : 0, sb = S.c[b.id] ? S.c[b.id].lv : 0;

  function applyGrade(g) {
    var c = SES.q[SES.i];
    if (!c) return;
    var s = cs(c.id);
    var first = s.seen === 0;
    s.seen++; s.t = Date.now();
    if (g === 2) {
      s.r++; s.lv = Math.min(s.lv + 1, 7);
      s.due = Date.now() + IV[Math.max(0, s.lv - 1)] * DAY;
    } else if (g === 1) {
      s.m = (s.m || 0) + 1; s.lv = Math.max(1, s.lv);
      s.due = Date.now() + (s.lv <= 2 ? 6 * 3600000 : DAY);
    } else {
      s.w++; s.lv = Math.max(1, s.lv - 1);
      s.due = Date.now() + 3600000;
      requeue(c);
    }
    var st = todayStat();
    st.all++; if (g === 2) st.ok++; if (g === 0) st.bad++;

    if (g === 2) SES.right++; else if (g === 1) SES.mid++; else SES.wrong++;

    render();

    var total = allCards().length;
    var mainFill = allCards().filter(function (c) { return c.sr === '主补'; }).length;
    var h = hd('核对说明', '精选 与 主模板', '');
    h += '<div class="wrap">';
    h += '<div class="panel pad"><div class="note">' +
      '<b>题库共 ' + total + ' 张。</b>其中 ' + (total - mainFill) + ' 张来自精选，' + mainFill + ' 张是精选没有、从主模板逐条补进来的（卡面右下角标「主模板补充」）。' +
      '</div></div>';

    h += '<div class="sec-t"><h2>一、六大方面</h2><span>逐条核过</span></div>';
    h += '<div class="panel pad"><div class="note">' +
      '社会 26 条、个人 39 条、自然 17 条、文化 20 条、交流 18 条、科技 12 条，合计 <b>132</b> 条，与主模板 p45–49 的六大方面表逐条比对，<b>没有缺漏</b>。' +
      '差别只有两处：<br>' +
      '① 主模板把每组拆成「核心 / 方式 / 目标」四个维度，精选改成按 ★★★、✓、★、— 分档。程序里两个都留了：卡面角标是维度（如「目标·和谐」），排序和筛选按星档。<br>' +
      '② 精选多给了一条背诵顺序（先 ✓ 和 ★★★，再 ★，— 临场挑），程序把它做成了「只看第一档 / 含第二档」的筛选。' +
      '</div></div>';

    h += '<div class="sec-t"><h2>二、精选漏掉、已补进来的</h2><span>全部来自主模板</span></div>';
    h += '<div class="panel pad"><div class="note">' +
      '这些不是精选写错，而是它压得太狠，把「主背之外还有哪些说法」整段省了。默写卡住时，翻这些比翻 PDF 快。<br><br>' +
      '<b>1. 图表词汇（主模板 p8–11）</b>：精选只留了一行，缺 increase 组里的 expand、减少组里的 diminish、持平组里的 stand at、波动组里的 vary；迅速缺 markedly / notably，缓慢缺 modestly / a modest rise；峰值缺 hit a record high，谷值缺 fall to a low，约数缺 just over / just under；整段缺「倍数与比较」、「排序」里的 the largest share、「图表呈现」两种开头、「趋势名词短语」。<br><br>' +
      '<b>2. 图表第一段总起句（p12–18）</b>：缺趋势作宾语（主题词 saw a steady rise…）、状语式（According to the data given in the chart…）、divergent + with、3D 里的 disparity、双图表的 As for 写法、万能场景六句里的四句。<br><br>' +
      '<b>3. 社会现象过渡句（p26–29）</b>：缺 Despite its apparent simplicity…、The chart clearly communicates its intended meaning…，以及方案 5 那句万能话。<br><br>' +
      '<b>4. 第二段（p33–42）</b>：缺原因过渡的逐词替换（many / reason / explain / idea 四组共 19 个词）与两句待选；连接词只留一组，主模板另有四组；例证短语只留 6 个，主模板是 15 个（be interested in、place a high priority on、place a high value on、value…highly、dedicate oneself to、be occupied with、be tired of、be bored with 等都缺）；从句开头只留 2 句，主模板是 13 句（主语从句 4、宾语从句 5、同位语从句 4）；常用短语缺 pivotal / fundamental / central role、lay the foundation of、is a driving force behind、is the cornerstone of、act as a catalyst for、bring advantages、constitute a significant menace to、is inextricably linked to。<br><br>' +
      '<b>5. 第三段（p61–70）</b>：缺总结段开头五个替换（To sum up / In general / Generally speaking / On the whole）；措施缺媒体呼吁、家庭教育两句与 «It is our duty to / We are obliged to» 一组；缺措施方案 2 的第二种写法（On the surface…）；畅想缺两句（If these proposed measures are implemented… / There is no better time than now…）；趋势预测缺三句。<br><br>' +
      '<b>6. 图画第一段（p71–83）</b>：缺图画引入里的 portrayed / depicted 等 9 个 shown 同族、5 个副词、picture 的 4 个同族，以及两句待选引入；缺 as well as 形容词 13 组里的 active、aspiring、passionate、ugly、terrible 五组；主题阐述缺 is to / purpose / remind / us 四组替换表；中心思想缺 important 的 5 个同族与 problem 的 7 个同族。<br><br>' +
      '<b>7. 争议话题（p58–59）</b>：缺 In fact, this issue remains controversial 与 When it comes to…, opinions vary widely 两句过渡。' +
      '</div></div>';

    h += '<div class="sec-t"><h2>三、没有放进来的</h2><span>怕占你时间</span></div>';
    h += '<div class="panel pad"><div class="note">' +
      '① 精选第八部分的 9 篇真题范文：那是用来对照的成品，不是背诵单位，塞进复习队列会稀释主背句。<br>' +
      '② 主模板的历年真题「社会现象汇总」「图画中心思想汇总」：写在卡片提示里了，没单独做卡。<br>' +
      '③ 小作文：不在这次范围。<br>' +
      '④ 精选第七部分的练习顺序与交卷自查：放在下面的「用法」里，当作流程说明。' +
      '</div></div>';

    h += '<div class="sec-t"><h2>四、怎么用这套程序</h2></div>';
    h += '<div class="panel pad"><div class="note">' +
      '<b>顺序</b>：六大方面第一档（社会 + 个人）→ 通用第二段 → 通用第三段 → 图表第一段 → 一页纸速查 → 图画 / 文字第一段 → 六大方面第二档 → 图表词汇与替换词。<br>' +
      '<b>每天</b>：先把「今日任务」清空（到期复习 + 25 张新卡），再补 10 分钟默写测试。<br>' +
      '<b>判分</b>：想不起来就点「不认识」，别手软；犹豫 3 秒以上算「模糊」。系统按 1 / 2 / 4 / 7 / 15 / 30 天往后排，忘了的卡当天插回队尾。<br>' +
      '<b>自检</b>：考前两周每天用「一页纸速查」整段默写一遍，覆盖率低于 80% 的那段，回去重背对应段落。<br>' +
      '<b>自己加</b>：练习时碰到的生词、换过的主题词，都加到「我的词条」，它会进同一个复习队列。' +
      '</div></div>';
    h += '</div>';
    return h;
  }

  function srcLabel(sr) {
    if (sr === '主补') return '主模板补充';
    if (sr === '自定') return '我的词条';
    if (sr === '小作文') return '小作文讲义';
    return '精选模板';
  }

  function secName(s) {
    return { 1: '六大方面', 2: '模板句', 3: '图表词汇', 4: '替换升级', 7: '小作文', 5: '一页纸' }[s] || '全部';
  }

  /* ---------------- 路由 ---------------- */
  function render() {
    var hash = location.hash || '#/';
    var parts = hash.split('/');
    if (parts[1] !== 's' && SES) SES = null;
    var body = '';
    var nav = '';
    if (hash === '#/' || hash === '') body = vHome();
    else if (hash === '#/lib') body = vLib();
    else if (parts[1] === 'g' && parts[2]) body = vGroup(parts[2]);
    else if (parts[1] === 'c' && parts[2]) body = vCard(parts[2]);
    else if (parts[1] === 's') body = vSession();
    else if (hash === '#/test') body = vTest();
    else if (hash === '#/mine') body = vMine();
    else if (hash === '#/check') body = vCheck();
    else body = vHome();

    var inSession = (parts[1] === 's' && SES && SES.i < SES.q.length);
    if (!inSession) {
      nav = '<div class="nav">' +
        '<a href="#/" class="' + (hash === '#/' ? 'on' : '') + '"><b>今日</b></a>' +
        '<a href="#/lib" class="' + (hash === '#/lib' || parts[1] === 'g' || parts[1] === 'c' ? 'on' : '') + '"><b>词库</b></a>' +
        '<a href="#/test" class="' + (hash === '#/test' ? 'on' : '') + '"><b>测试</b></a>' +
        '<a href="#/mine" class="' + (hash === '#/mine' || hash === '#/check' ? 'on' : '') + '"><b>我的</b></a>' +
        '</div>';
    }
    app.innerHTML = body + nav;
    window.scrollTo(0, 0);
    if (inSession) {
      var ta = document.getElementById('inp');
      if (ta && SES.inp) ta.value = SES.inp;
    }
  }

  /* ---------------- 动作 ---------------- */
  var ACTS = {
    go: function (a) { location.hash = a; },
    daily: function () { startDaily(); },
    open: function (a) {
      var v = parseInt(a, 10);
      UI.open = (UI.open === v) ? 0 : v;
      render();
    },
    tier: function (a) {
      var p = a.split(':'); UI['t_' + p[0]] = parseInt(p[1], 10); render();
    },
    study: function (a) {
      var p = a.split(':');
      startGroup(p[0], parseInt(p[1], 10) || 0);
    },
    testg: function (a) {
      var p = a.split(':');
      startTest({ g: p[0], mode: 'write', n: 20, tier: parseInt(p[1], 10) || 0 });
    },
    studycard: function (a) {
      var c = byId(a); if (!c) return;
      beginSession([c], { label: '单张', force: null });
    },
    reveal: function () { SES.rev = true; render(); },
    dir: function (a) {
      if (!SES || (a !== 'zh2en' && a !== 'en2zh')) return;
      if (SES.dir === a) return;
      SES.dir = a;
      resetCardUI();
      render();
    },
    gwdir: function (a) {
      if (!SES || (a !== 'zh2en' && a !== 'en2zh')) return;
      if (SES.gwDir === a) return;
      SES.gwDir = a;
      SES.rev = false;
      render();
    },
    hint: function () {
      var c = SES.q[SES.i];
      var P = gwPack(c);
      if (P) {
        var w = P.w[SES.wi || 0] || '';
        toast('首字母 ' + w.charAt(0) + '…　共 ' + w.split(/\s+/).length + ' 个词');
        return;
      }
      var first = c.en.split(' ').slice(0, 2).join(' ');
      toast('开头是 “' + first + '…”　共 ' + wordCount(c.en) + ' 词');
    },
    gwgrade: function (a) { applyWordGrade(parseInt(a, 10)); },
    checkver: function () {
      if (window.checkNow) window.checkNow(); else toast('单文件版不联网检查，网页版才有');
    },
    verlog: function () {
      if (window.showVerLog) window.showVerLog(); else toast('没有更新记录可看');
    },
    gwsp: function () {
      if (SES && SES.q) SES.gwsp = !SES.gwsp; else UI.gwsp = !UI.gwsp;
      render();
    },
    submit: function () {
      var c = SES.q[SES.i];
      var ta = document.getElementById('inp');
      SES.inp = ta ? ta.value : '';
      if (!SES.inp.trim()) { toast('先写点东西'); return; }
      var best = 0, bm = null, bv = '';
      var variants = [c.en].concat(c.alts && c.alts.length ? c.alts : []);
      variants.forEach(function (v) {
        var r = diff(SES.inp, v);
        if (r.ratio > best) { best = r.ratio; bm = r.mark; bv = v; }
      });
      SES.res = { best: best, mark: bm, ref: bv };
      render();
    },
    pick: function (a) {
      SES.sel = parseInt(a, 10);
      render();
    },
    grade: function (a) { applyGrade(parseInt(a, 10)); },
    quit: function () {
      if (SES && SES.i > 0 && SES.i < SES.q.length) {
        if (!confirm('退出本轮？已作答的会保留。')) return;
      }
      SES = null; location.hash = '#/';
    },
    again: function () {
      var ids = {};
      SES.q.forEach(function (c) { if (lvOf(c.id) <= 2) ids[c.id] = 1; });
      var wrong = allCards().filter(function (c) { return ids[c.id]; });
      if (!wrong.length) { toast('本轮没有需要重来的'); SES = null; location.hash = '#/'; return; }
      beginSession(wrong.slice(0, 40), { label: '重来', dir: SES.dir });
    },
    tsec: function (a) { T.sec = parseInt(a, 10); render(); },
    tmode: function (a) { T.mode = a; render(); },
    tn: function (a) { T.n = parseInt(a, 10); render(); },
    testrun: function () {
      startTest({ sec: T.sec === 6 ? 0 : T.sec, g: T.sec === 6 ? 'p6_page' : null, mode: T.mode, n: T.n });
    },
    setn: function (a) { S.set.newPerDay = parseInt(a, 10); save(); render(); },
    setmode: function (a) { S.set.mode = a; save(); render(); },
    saveexam: function () {
      var v = document.getElementById('exam').value;
      if (!v) return;
      S.set.exam = v; save(); toast('已保存：' + v); render();
    },
    addcustom: function () {
      var en = document.getElementById('c-en').value.trim();
      var zh = document.getElementById('c-zh').value.trim();
      var tip = document.getElementById('c-tip').value.trim();
      if (!en || !zh) { toast('英文和中文都要填'); return; }
      S.custom.push({ id: 'u' + Date.now(), en: en, zh: zh, tip: tip });
      save(); toast('已加入，下次进队列'); render();
    },
    delcustom: function (a) {
      S.custom = S.custom.filter(function (x) { return x.id !== a; });
      if (S.c[a]) delete S.c[a];
      save(); render();
    },
    export: function () {
      var blob = new Blob([JSON.stringify(S)], { type: 'application/json' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = '大作文背诵进度-' + todayStr() + '.json';
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 3000);
    },
    import: function () {
      var inp = document.createElement('input');
      inp.type = 'file'; inp.accept = '.json,application/json';
      inp.onchange = function () {
        var f = inp.files[0]; if (!f) return;
        var fr = new FileReader();
        fr.onload = function () {
          try {
            var o = JSON.parse(fr.result);
            if (!o || o.v !== 1) throw 0;
            S = o; save(); toast('导入成功'); location.hash = '#/'; render();
          } catch (e) { toast('文件读不懂'); }
        };
        fr.readAsText(f);
      };
      inp.click();
    },
    reset: function () {
      if (!confirm('清空全部进度？备份过再点。')) return;
      S = defaults(); save(); toast('已清空'); location.hash = '#/'; render();
    }
  };

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el) return;
    var fn = ACTS[el.getAttribute('data-act')];
    if (fn) { e.preventDefault(); fn(el.getAttribute('data-arg') || '', el, e); }
  });

  document.addEventListener('input', function (e) {
    if (e.target.id === 'inp' && SES) SES.inp = e.target.value;
  });

  document.addEventListener('keydown', function (e) {
    if (!SES || location.hash !== '#/s') return;
    if (e.key === 'Escape') { ACTS.quit(); return; }
    if (SES.i >= SES.q.length) return;
    var m = modeOf(SES.q[SES.i]);
    if (e.code === 'Space') {
      e.preventDefault();
      if ((m === 'en2zh' || m === 'zh2en' || m === 'gw') && !SES.rev) ACTS.reveal();
      return;
    }
    if (SES.rev || SES.res || (m === 'mc' && SES.sel >= 0)) {
      if (m === 'gw') {
        if (e.key === '1') applyWordGrade(0);
        else if (e.key === '2') applyWordGrade(1);
        else if (e.key === '3') applyWordGrade(2);
        return;
      }
      if (e.key === '1') applyGrade(0);
      else if (e.key === '2') applyGrade(1);
      else if (e.key === '3') applyGrade(2);
    }
  });

  /* mc 模式需要为当前卡生成干扰项 */
  var _render = render;
  render = function () {
    if (SES && SES.i < SES.q.length) {
      var c = SES.q[SES.i];
      if (modeOf(c) === 'mc' && !SES.opts) {
        var g = groupById(c.g);
        var pool = cardsOf(c.g).filter(function (x) { return x.id !== c.id; });
        if (pool.length < 3) pool = allCards().filter(function (x) { return x.id !== c.id && groupById(x.g).sec === g.sec; });
        var opts = [c.zh];
        var guard = 0;
        while (opts.length < 4 && guard++ < 60) {
          var cand = pool[Math.floor(Math.random() * pool.length)];
          if (cand && opts.indexOf(cand.zh) < 0) opts.push(cand.zh);
        }
        while (opts.length < 4) opts.push('（其他选项不足，跳过即可）');
        // 打乱
        for (var i = opts.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var t = opts[i]; opts[i] = opts[j]; opts[j] = t;
        }
        SES.opts = opts;
        SES.correct = opts.indexOf(c.zh);
      }
    }
    _render();
  };

  window.addEventListener('hashchange', render);

  /* 首次进入：给个指引 */
  if (!location.hash) location.hash = '#/';
  render();
})();

</script>
<script>window.__CASE__={"b_c1":{"q":"2023 英二 · 动态图（一条线一直升 / 一直降）","eg":"The chart above illustrates the changes in Chinese residents' health literacy level from 2012 to 2021, during which it rose steadily.","egzh":"上方折线图展示了 2012—2021 年我国居民健康素养水平的变化，其间该水平稳步上升。"},"b_c4":{"q":"2019 英二 · 动态图（有升有降，多变量）","eg":"The chart above illustrates the changes in graduates' choices from 2013 to 2018, among which the rise in the proportion pursuing further study was the most striking.","egzh":"上方柱状图展示了 2013—2018 年毕业生去向选择的变化，其中选择深造比例的上升最为显著。"},"b_c5":{"q":"2019 英二 · 一升一降（两个变量走向相反）","eg":"As reflected in the chart, graduates' choices moved in opposite directions from 2013 to 2018, the proportion entering the workforce falling while that pursuing further study rising.","egzh":"如图所示，毕业生去向在 2013—2018 年间走向相反：就业比例下降，而深造比例上升。"},"b_c7":{"q":"2024 英二 · 静态图（只有占比，没有年份趋势）","eg":"The bar chart above presents the distribution of students' gains from the labor practice course, with acquiring relevant knowledge accounting for the largest share.","egzh":"上方柱状图呈现了劳动实践课学生收获的分布，其中「获得相关知识」所占份额最大。"},"b_c9":{"q":"2024 英二 · 静态图 · 各项差距悬殊时","eg":"The chart above reveals a striking disparity in students' gains, with the proportions ranging from 32.6% to 91.3%.","egzh":"上方图表揭示了学生收获中的显著差距，各项占比从 32.6% 到 91.3% 不等。"},"b_c10":{"q":"2026 英一 · 双图表（一左一右两张）","eg":"The chart on the left illustrates consumers' attitudes towards elderly-care robots, while the chart on the right lists their major concerns about such robots.","egzh":"左图展示消费者对养老机器人的态度，右图列出他们对此类机器人的主要顾虑。"},"b_c12":{"q":"2026 英一 · 双图表拉长版（总分结构）","eg":"The two charts present consumers' responses to elderly-care robots: the pie chart shows their acceptance rates, while the bar chart on the right lists their major concerns.","egzh":"两张图表共同呈现消费者对养老机器人的反应：饼图是接受度，右侧柱状图是主要顾虑。"},"b_c13":{"q":"兜底 · 图看不懂、时间紧（有年份变化）","eg":"The chart above provides information about Chinese residents' spending habits from 2015 to 2020.","egzh":"上方图表提供了 2015—2020 年间我国居民消费习惯的相关信息。（示范）"},"b_d1":{"q":"2019 英二 · 动态细节（三个数据配三种动词 + 副词）","eg":"To be specific, the percentage of graduates entering the workforce decreased remarkably from 68.1% to 60.7%. However, the proportion pursuing further study climbed significantly from 26.3% to 34.0%. Meanwhile, the proportion starting a business rose slightly, from 1.3% to 2.6%.","egzh":"具体而言，直接就业的毕业生比例从 68.1% 大幅降至 60.7%；然而，深造比例从 26.3% 显著升至 34.0%；同时，创业比例从 1.3% 小幅升至 2.6%。"},"b_d2":{"q":"单变量 · 只强调增量 / 减量（示范）","eg":"The proportion of consumers choosing electric vehicles was 5% in 2018, compared with 20% in 2023, showing an increase of 15 percentage points.","egzh":"选择电动车的消费者比例 2018 年为 5%，2023 年为 20%，增长了 15 个百分点。（示范）"},"b_d3":{"q":"倍数关系 · 同一变量两个年份（示范）","eg":"The number of residents in the city in 2023 was nearly twice that in 2013.","egzh":"该市 2023 年的居民数量接近 2013 年的两倍。（示范）"},"b_d4":{"q":"2024 英二 · 静态细节 + 排名（只写前两项）","eg":"To be specific, the percentages of students who acquired relevant knowledge, improved practical skills and felt comfortable account for 91.3%, 84.8% and 54.4% respectively. Notably, acquiring relevant knowledge tops the list, at 91.3%, followed by improving practical skills at 84.8%.","egzh":"具体而言，获得相关知识、提高实践技能、心情舒畅的学生比例分别为 91.3%、84.8%、54.4%；其中获得相关知识以 91.3% 居首，其次是 84.8% 的提高实践技能。"},"b_d5":{"q":"静态倍数 · 同一年份两个变量对比（示范）","eg":"The percentage of students choosing online courses was about 1.8 times that of those choosing offline ones in 2024.","egzh":"2024 年选择线上课程的学生比例约为选择线下课程的 1.8 倍。（示范，数字按题目换）"},"b_e1":{"q":"2023 英二 · 数据 → 现象 的过渡句","eg":"It is apparent from the statistics that health literacy has become a growing concern among Chinese residents.","egzh":"从这些数据可以明显看出，健康素养已成为我国居民日益关注的问题。"},"b_e4":{"q":"备用过渡 · 冒号后接完整现象句（示范）","eg":"The chart clearly communicates its intended meaning: elderly-care robots are winning public acceptance.","egzh":"图表清楚传达了它的意图：养老机器人正获得公众认可。（示范）"},"b_e5":{"q":"2026 英一 · 态度型图表（新技术 / 新观念 / 新生活方式）","eg":"Elderly-care robots have drawn growing attention from the public, with safety as their top concern.","egzh":"养老机器人已受到公众越来越广泛的关注，安全是首要关切。"},"b_e6":{"q":"2026 英二 · 某现象正变得普遍（户外活动 / 在线学习）","eg":"Online learning is becoming prevalent among college students nowadays.","egzh":"如今在线学习在大学生中正变得盛行。"},"b_e8":{"q":"实体行业（快递 / 旅游）· 近年快速发展","eg":"Recent years have witnessed the rapid development of the express delivery industry.","egzh":"近年来快递业得到了快速发展。"},"b_f1":{"q":"所有图表题 · 第二段开头（英一写三点，英二 2~3 点）","eg":"Three key reasons, from my perspective, account for this phenomenon.","egzh":"在我看来，有三点主要原因促成了这一现象。"},"b_f5":{"q":"身边举例 · 劳动实践 / 合作类（讲义填法示范）","eg":"To begin with, for instance, my roommate Kevin is passionate about practical courses, which helps him cultivate practical skills and a spirit of cooperation. Consequently, he earns the respect of our entire class.","egzh":"首先，例如我的室友 Kevin 热衷于实践类课程，这帮助他培养了实践技能与合作精神；因此他赢得了全班同学的尊重。"},"b_f6":{"q":"家乡举例 · 2024 英一城市公园（按范文改写）","eg":"For instance, my hometown, a livable city, places a high priority on building parks, which enables residents to exercise outdoors every day.","egzh":"例如我的家乡，一座宜居城市，高度重视公园建设，这让居民每天都能在户外锻炼。（按范文改写）"},"b_f7":{"q":"2026 英二 · 户外活动（从句说理，最万能）","eg":"What's more, definitely no one can deny the fact that outdoor activities play a crucial role in students' physical and mental health.","egzh":"其次，毋庸置疑，户外活动对学生身心健康起着关键作用。"},"b_f8":{"q":"群众路线 · 养老机器人（多数人怎么看）","eg":"To begin with, the majority of people believe that elderly-care robots will provide them with a broader platform to care for their aging parents, which relieves the burden on their families.","egzh":"首先，大多数人认为养老机器人能为他们提供更广阔的平台去照顾年迈父母，这减轻了家庭负担。"},"b_f9":{"q":"2026 英一 · Not only 倒装（第三条原因）","eg":"Not only does the application of elderly-care robots improve the quality of life for the elderly, but it also relieves the burden on their families.","egzh":"养老机器人的应用不仅改善了老年人的生活质量，也减轻了家庭的负担。"},"b_h1":{"q":"养老机器人 / 三类作文通用 · 第三段总结","eg":"All in all, it is not difficult to draw the conclusion that enough attention must be paid to elderly-care robots by ourselves and our community.","egzh":"总之，我们不难得出结论：我们自身与社会都必须对养老机器人给予足够重视。"},"b_h5":{"q":"文化交流 · 倒装总结（想上分句式时）","eg":"By no means should we underestimate the profound impact of cultural exchange.","egzh":"我们绝不应低估文化交流所产生的深远影响。"},"b_h6":{"q":"养老机器人 · 政府措施（第三段第一句）","eg":"For one thing, it is imperative for the authorities to formulate relevant regulations to ensure the safe use of elderly-care robots.","egzh":"一方面，政府有必要制定相关法规，以确保养老机器人的安全使用。"},"b_h7":{"q":"个人措施 · 任何题目都能用（第三段第二句）","eg":"For another, ordinary individuals ought to spare no pains to attach great importance to health knowledge in daily life.","egzh":"另一方面，普通人也应在日常生活中不遗余力地重视健康知识。"},"b_h8":{"q":"学生心理健康 · 措施方案 2（先主流做法再转折）","eg":"When it comes to concrete solutions, some people hold that schools must take responsibility for students' mental health. In fact, it is families that play a crucial role in children's psychological well-being.","egzh":"谈到具体方案，有人认为学校必须为学生心理健康负责；事实上，正是家庭在孩子心理健全上起关键作用。"},"b_i1":{"q":"结尾套句 · 时间紧 / 字数不够直接用","eg":"In this way, hopefully, we may embrace a brighter and more promising future.","egzh":"如此，我们有望拥抱一个更加光明、更有希望的未来。"},"b_j1":{"q":"图表专用 · 第三段不写措施、改预测趋势","eg":"For the reasons given above, we can predict that an increasing number of people will focus on health literacy, and this trend will continue in the years to come.","egzh":"基于上述原因，可以预见将有越来越多人关注健康素养，这一趋势在未来几年仍将持续。（示范）"},"b_k1":{"q":"2004 英一 · 跑步冲线（单图，非对话）","eg":"As is symbolically depicted in the picture above, on the playground runs a young man, rushing to the finishing line.","egzh":"如图象征性所示，操场上跑着一位年轻人，正冲向终点线。"},"b_k3":{"q":"2004 英一 · 备用引入（图片明确传达的是…）","eg":"What is clearly conveyed in the picture is that perseverance leads to success.","egzh":"图片明确传达出的是：坚持带来成功。"},"b_k6":{"q":"2004 英一 · 单图五要素公式（环境 + 动作 + 主体 + doing + with）","eg":"As is symbolically depicted in the picture above, on the playground runs a young man, active as well as vigorous, rushing to the finishing line, with a sweet smile on his face.","egzh":"如图象征性所示，操场上跑着一位年轻人，既活跃又有活力，正冲向终点线，脸上带着灿烂笑容。"},"b_k9":{"q":"2022 英一 · 两人谈讲座（对话型）","eg":"As is symbolically depicted in the picture above, in front of us stand two girls, talking about campus lectures. One argues that campus lectures are irrelevant to her major and a waste of time. By contrast, the other maintains that attending such lectures is highly beneficial nonetheless.","egzh":"如图象征性所示，我们面前站着两位女生，正在谈论校园讲座。一人认为讲座与专业无关、浪费时间；另一人坚持认为参加仍大有裨益。"},"b_k10":{"q":"2020 英一 · 好习惯与拖延（两幅图）","eg":"The cartoons provide us with a thought-provoking scene: the girl in the left picture is fully focused on her homework. However, in the right picture, the boy is lying on the sofa, telling himself that he will not start until the deadline.","egzh":"两幅漫画呈现了一个发人深省的场景：左图女孩全神贯注做作业；而右图男孩躺在沙发上，告诉自己拖到最后一刻才开始。"},"b_k12":{"q":"2024 英一 · 一图一表（图画 + 图表叠加）","eg":"As is vividly depicted in the cartoon and clearly shown in the chart above, a girl is sitting in front of a computer learning online, and the chart illustrates the popularity of online courses over the past decade.","egzh":"正如上方漫画生动描绘、图表清楚展示的那样，一位女孩坐在电脑前在线学习；图表则展示了近十年在线课程的普及程度。"},"b_k13":{"q":"2024 英一 · 一图一表备用写法","eg":"The cartoon above depicts a girl learning online at home, while the chart below illustrates the growing popularity of online courses.","egzh":"上方漫画描绘一位女孩在家在线学习，下方图表展示在线课程日益普及。（示范）"},"b_k14":{"q":"2004 英一 · 图画第一段收尾（主题阐述）","eg":"The primary intention of the drawing is to remind the whole society that perseverance is of vital importance.","egzh":"这幅画的主要意图是提醒全社会：坚持至关重要。"},"b_k16":{"q":"意志品质类（信心 / 坚持 / 勇气）· 中心思想句","eg":"Self-confidence is so indispensable that the subject deserves the highest level of attention and consideration.","egzh":"自信如此不可或缺，值得给予最高程度的重视与考量。（示范，主题词按题换）"},"b_m1":{"q":"文字作文兜底 · 引出主题（任何文字题）","eg":"It cannot be denied that reading plays a key role in people's work and life.","egzh":"不可否认，阅读在人们的工作和生活中起着关键作用。（示范，主题词按题换）"},"b_m4":{"q":"2026 英二 · 孩子与屏幕（社会普遍现象类）","eg":"With the rapid advancement of society and technology, children's addiction to screens has become a common phenomenon in our daily lives.","egzh":"随着社会与科技的快速进步，孩子沉迷屏幕已成为日常生活中常见的现象。"},"b_m6":{"q":"文字题 · 题干要求「说明作者观点」时必写","eg":"According to the author, parents should set limits on children's screen time instead of blaming schools alone.","egzh":"根据作者观点，家长应为孩子的屏幕时间设限，而不是只责怪学校。（示范，按原文改写）"},"b_m7":{"q":"文字题 · 观点同义说法（Therefore / In the author's view）","eg":"Therefore, the author holds that reading widely is essential to a college student's growth.","egzh":"因此，作者认为广泛阅读对大学生的成长至关重要。（示范）"},"b_m8":{"q":"完全同意 · 观点积极正确的题必须表态","eg":"I fully agree with the author's viewpoint.","egzh":"我完全同意作者的观点。"},"b_m9":{"q":"开放型题（如孩子沉迷屏幕该怪谁）· 三种立场都可","eg":"I strongly disagree with the author's opinion that schools should bear all the responsibility.","egzh":"我强烈反对作者认为学校应承担全部责任的观点。（示范）"},"b_n1":{"q":"2026 英一 · 图表第一段整段（双图表 + 静态为主）","eg":"The chart on the left illustrates consumers' attitudes towards elderly-care robots, while the chart on the right presents their major concerns. To be specific, the proportions of respondents who fully accept, partially accept and reject these robots account for 39.3%, 32.8% and 27.9% respectively.","egzh":"左图展示消费者对养老机器人的态度，右图呈现其主要顾虑。具体而言，完全接受、部分接受、拒绝的受访者分别占 39.3%、32.8%、27.9%。"},"b_n2":{"q":"2024 英二 · 第二段整段（举例 → 说理 → 群众）","eg":"Three key reasons, from my perspective, account for this phenomenon. To begin with, for instance, my roommate Kevin is passionate about practical courses, which helps him cultivate practical skills. What's more, no one can deny that practical courses play a crucial role in students' all-round development.","egzh":"在我看来有三点原因。首先，例如我的室友 Kevin 热衷实践课程，这帮他培养实践技能；其次，无人能否认实践课对学生全面发展起关键作用。"},"b_n3":{"q":"2023 英二 · 第三段整段（总结 + 两条措施 + 畅想）","eg":"All in all, enough attention must be paid to public health literacy by ourselves and our community. For one thing, it is imperative for the authorities to launch more health education campaigns. For another, ordinary individuals ought to spare no pains to attach great importance to health knowledge in daily life.","egzh":"总之，我们自身与社会都必须高度重视公众健康素养。一方面政府应多办健康教育；另一方面普通人也应在日常重视健康知识。"},"b_n4":{"q":"2004 英一 · 图画第一段整段（只换第一段，二三段用 n2 / n3）","eg":"As is symbolically depicted in the picture above, in front of us stands a young man, rushing to the finishing line, with a sweet smile on his face. The primary intention of the drawing is to remind the whole society that perseverance is of vital importance.","egzh":"如图象征性所示，我们面前站着一个年轻人，正冲向终点线，脸上带着笑容；这幅画意在提醒全社会，坚持至关重要。"},"b_n5":{"q":"文字题 · 第一段整段（引出 → 观点 → 表态）","eg":"It cannot be denied that screens play a key role in children's life. According to the author, parents should set limits on screen time. I fully agree with the author's viewpoint.","egzh":"不可否认屏幕在孩子生活中起关键作用。作者认为家长应限制屏幕时间，我完全同意这一观点。"},"c_inc":{"q":"动态图 · 说「上升」时（2019 英二 / 2023 英二）","eg":"The proportion pursuing further study climbed significantly from 26.3% to 34.0%.","egzh":"选择深造的比例从 26.3% 显著升至 34.0%。"},"c_dec":{"q":"动态图 · 说「下降」时（2019 英二）","eg":"The percentage of graduates entering the workforce decreased remarkably from 68.1% to 60.7%.","egzh":"直接就业的毕业生比例从 68.1% 大幅降至 60.7%。"},"c_flat":{"q":"动态图 · 某段时间「持平」（示范）","eg":"The figure stood at roughly 30% throughout the period.","egzh":"该数值在整个时期基本维持在 30% 左右。（示范）"},"c_fluct":{"q":"动态图 · 「来回波动」（示范）","eg":"The share fluctuated between 10% and 15% over the decade.","egzh":"该比例十年间在 10%—15% 之间波动。（示范）"},"c_fast":{"q":"动态图 · 「迅猛变化」（快递量示范）","eg":"The number of rural parcels rose dramatically after 2015.","egzh":"农村快递量在 2015 年后急剧上升。（示范）"},"c_slow":{"q":"动态图 · 「缓慢上升」（2023 英二健康素养）","eg":"The level increased gradually from 8.8% in 2012 to 25.4% in 2021.","egzh":"该水平从 2012 年的 8.8% 逐步升至 2021 年的 25.4%。"},"c_occupy":{"q":"静态图 · 说「占多少」时（2024 英二 / 2026 英一）","eg":"Acquiring relevant knowledge accounts for 91.3% of students' gains.","egzh":"获得相关知识占学生收获的 91.3%。"},"c_ratio":{"q":"静态图 · 比例 / 份额（两两对比才用 ratio）","eg":"The proportion of graduates pursuing further study rose to 34.0%, while the share starting a business stayed below 3%.","egzh":"深造比例升至 34.0%，而创业份额不足 3%。（示范）"},"c_peak":{"q":"动态图 · 「达到峰值」（快递量示范）","eg":"The volume peaked at 83 billion parcels in 2019.","egzh":"快递量在 2019 年达到 830 亿件的峰值。（示范）"},"c_trough":{"q":"动态图 · 「触底后回升」（示范）","eg":"The figure bottomed out at 5% in 2015 before rising again.","egzh":"该数值 2015 年触底至 5%，随后再度上升。（示范）"},"c_time":{"q":"动态图 · 时间跨度（2019 英二 / 2023 英二）","eg":"During the period from 2013 to 2018, graduates' choices underwent significant changes.","egzh":"2013—2018 年间，毕业生去向发生了显著变化。"},"c_mult":{"q":"倍数与比较 · 差距悬殊时（示范）","eg":"The number of online course takers is four times as high as that of offline ones.","egzh":"在线课程人数是线下课程的四倍。（示范，倍数按题目换）"},"c_rank":{"q":"静态图 · 排名（2024 英二 / 2026 英一）","eg":"Acquiring relevant knowledge tops the list, at 91.3%, followed by improving practical skills at 84.8%.","egzh":"获得相关知识以 91.3% 居首，其次是 84.8% 的提高实践技能。"},"c_approx":{"q":"静态图 · 约数（数字不整时）","eg":"The figure stood at just over 60%.","egzh":"该数值略高于 60%。（示范）"},"c_present":{"q":"图表开头 · 「图表显示了」（全部图表题）","eg":"As is shown in the chart, graduates' choices changed significantly from 2013 to 2018.","egzh":"如图所示，毕业生去向在 2013—2018 年间发生了显著变化。"},"c_contrast":{"q":"对比衔接 · 一句里两个方向（2019 英二）","eg":"The proportion entering the workforce fell to 60.7%, whereas that pursuing further study rose to 34.0%.","egzh":"就业比例降至 60.7%，而深造比例升至 34.0%。"},"c_trendnp":{"q":"趋势名词短语 · 主语是时间段（2023 英二）","eg":"The period from 2012 to 2021 witnessed a steady rise in residents' health literacy.","egzh":"2012—2021 年间，居民健康素养稳步上升。"},"d_f24":{"q":"2018 英一选课 / 2024 英一公园（自己造一组对比）","eg":"Compared with simple lessons, difficult courses can develop students' critical thinking skills, so as to expand their horizons.","egzh":"与简单课程相比，困难课程能培养学生的批判性思维，从而开拓视野。"},"d_m11":{"q":"养老机器人 · 双重否定变体（语气更硬）","eg":"The importance of elderly-care robots should never be underestimated by anyone.","egzh":"任何人都绝不应低估养老机器人的重要性。（示范）"},"d_vn1":{"q":"2026 英一 · 态度 / 担忧 / 选择 / 偏好类题","eg":"The chart on the left illustrates consumers' attitudes towards elderly-care robots, while the right one lists their major concerns.","egzh":"左图展示消费者对养老机器人的态度，右图列出其主要顾虑。"},"d_vn2":{"q":"2019 英二 · 变化 / 趋势 / 波动类题","eg":"The chart above illustrates the changes in graduates' choices from 2013 to 2018.","egzh":"上方图表展示了 2013—2018 年毕业生去向的变化。"},"e_m_intent_13":{"q":"2022 英一 · 邀请教授组队参赛（邀请信）｜来信意图","eg":"I am writing to invite you to participate in the contest with your team.","egzh":"我写信是想邀请您带团队参加这次比赛。"},"e_m_intent_28":{"q":"2025 英一 · 答复信（补充计划细节）｜来信意图","eg":"I am writing this letter in order to provide further details about the plan.","egzh":"我写这封信是为了提供关于该计划的更多细节。"},"e_q_pool3_01":{"q":"2020 英一 · 歌唱比赛通知（受邀人员）｜参与范围","eg":"Students of all grades are eligible to enter the singing competition, including national and international students.","egzh":"所有年级的学生都有资格参加歌唱比赛，包括国内和国际学生。"},"e_q_pool4_01":{"q":"2022 英二 · 美食节邀请信｜活动环节","eg":"Moreover, a series of interesting activities such as cooking contests and food shows will be held to arouse students' enthusiasm.","egzh":"此外，还将举办烹饪比赛、美食表演等系列活动，以激发学生的热情。"},"e_q_pool5_02":{"q":"2020 英一 · 歌唱比赛通知（活动奖励）｜奖品句","eg":"In terms of encouragement and rewards, the top three students will all receive trophies and certificates, and all shortlisted participants will receive bonus points.","egzh":"在鼓励与奖励方面，前三名学生都将获得奖杯和证书，所有入围者都将获得加分。"},"e_q_pool5_04":{"q":"2023 英一 · 招募项目学生通知｜参与收益","eg":"Last but not least, this project will allow you to contribute to the development of campus sports while gaining valuable experience in research.","egzh":"最后但同样重要的是，这个项目能让你为校园体育的发展做出贡献，同时获得宝贵的研究经验。"},"e_q_pool6_01":{"q":"2024 英二 · 建议信（调研古建筑保护）｜地点介绍","eg":"Located in Anhui, Hong village is one of the most popular scenic spots in China.","egzh":"位于安徽的宏村是中国最受欢迎的景点之一。"},"e_q_pool6_07":{"q":"2023 英二 · 看展建议信｜推荐对象 + 一句理由","eg":"What makes the art exhibition highly recommendable is the unique experience it offers, which includes an art performance.","egzh":"艺术展之所以值得高度推荐，在于它提供的独特体验，其中包含艺术表演环节。"},"e_q_pool7_07":{"q":"2023 英一 · 招募项目学生通知｜招募要求","eg":"Secondly, about the requirements, the candidates should be enthusiastic about sports and have sound organization, communication and planning skills.","egzh":"其次，关于要求，候选人应热衷体育运动，并具备良好的组织、沟通与策划能力。"},"e_q_pool8_01":{"q":"2010 英二 · 感谢美国同事并邀他来华｜开场感谢","eg":"I am extremely grateful to you for your unselfish assistance during the period of the cultural exchange program.","egzh":"我非常感谢您在文化交流项目期间给予的无私帮助。"},"e_q_pool8_02":{"q":"2010 英二 · 感谢美国同事并邀他来华｜感恩句（虚拟语气）","eg":"Without your generous help, I would not have had such a wonderful experience.","egzh":"如果没有你慷慨的帮助，我就不会有如此美妙的经历。"},"e_q_pool9_07":{"q":"2023 英二 · 看展建议信｜好处句","eg":"What's more, the art exhibition provides a unique opportunity to let you explore your creativity.","egzh":"更重要的是，艺术展提供了一个独特的机会，让你探索自己的创造力。"},"e_q_pool9_09":{"q":"2023 英二 · 看展建议信｜好处句（文化角度）","eg":"Finally, it allows you to experience different cultures and social customs.","egzh":"最后，它能让你体验不同的文化和社会习俗。"}};</script>
<script>

    x7_close: '一句表态 + 一句盼复；通知和纪要不写盼复，通知末尾换成报名句',

  };
  var CSS = '' +
    '.cas{margin-top:14px;padding:10px 12px 11px;border-left:3px solid #a2352a;background:#fdfaf5;border-radius:0 10px 10px 0}' +

    '@media (max-width:360px){.cas .ce{font-size:13.5px}}';

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function caseBox(u) {
    var d = document.createElement('div');
    d.className = 'cas';
    var h = '<div class="ch">真题 · 什么时候用</div>';
    if (u.q) h += '<div class="cq">' + esc(u.q) + '</div>';
    if (u.eg) h += '<div class="ce">' + esc(u.eg) + '</div>';
    if (u.egzh) h += '<div class="cz">译：' + esc(u.egzh) + '</div>';
    d.innerHTML = h;
    return d;
  }
  function hashId(re) {
    var m = re.exec(location.hash || '');
    return m ? decodeURIComponent(m[1]) : '';
  }
  /* 卡面：把 tip 里的真题摘出来单独成块；词汇卡（骨架句）本来不显示 tip，这里补一块 */
  function patchCard() {
    var cid = hashId(/^#\/c\/([^\/?#]+)/), u = CM[cid];
    if (!u) return;
    var wrap = document.querySelector('#app .wrap');
    if (!wrap || !wrap.querySelector('[data-act="studycard"]')) return;   /* 只在卡面，不动背卡流 */
    if (wrap.querySelector('.cas')) return;
    var tip = wrap.querySelector('.tip'), keep = null, cut = -1, node = caseBox(u);
    if (tip) {
      cut = tip.textContent.indexOf('▍真题');
      keep = cut >= 0 ? tip.textContent.slice(0, cut).replace(/\s+$/, '') : tip.textContent;
      if (keep) {
        tip.textContent = keep;
        tip.parentNode.insertBefore(node, tip.nextSibling);
        return;
      }
      tip.parentNode.removeChild(tip);
      tip = null;
    }
    var panel = wrap.querySelector('.panel.pad');
    if (!panel) return;
    var notes = panel.querySelectorAll('.note'), last = notes[notes.length - 1];
    if (last) panel.insertBefore(node, last); else panel.appendChild(node);
  }
  /* 组头：一行「考场怎么用」，先判题型再取句 */
  function patchGroup() {
    var gid = hashId(/^#\/g\/([^\/?#]+)/), t = GU[gid];

    var wrap = document.querySelector('#app .wrap');

    var el = document.createElement('div');
    el.className = 'gu';
    el.innerHTML = '<b>考场怎么用</b>　' + esc(t);
    var chips = wrap.querySelector('.chips'), btns = wrap.querySelectorAll('.btns'), b0 = btns[0];
    if (chips && chips.parentNode) chips.parentNode.insertBefore(el, chips);
    else if (b0) b0.parentNode.insertBefore(el, b0);
    else wrap.appendChild(el);
  }
  /* 真题索引：把散在卡上的出处按年份排开，从真题反查句子 */
  var IDX = null;
  function cardOf(cid) {
    var cs = (window.__DATA__ && window.__DATA__.cards) || [], i;
    for (i = 0; i < cs.length; i++) if (cs[i].id === cid) return cs[i];
    return null;
  }
  function groupTitle(gid) {
    var gs = (window.__DATA__ && window.__DATA__.groups) || [], i;
    for (i = 0; i < gs.length; i++) if (gs[i].id === gid) return gs[i].title;
    return '';
  }
  function idxItems() {
    if (IDX) return IDX;
    var a = [], k;
    for (k in CM) if (CM.hasOwnProperty(k)) {
      var u = CM[k], q = u.q || '', ym = /^(\d{4})/.exec(q);
      a.push({
        id: k, q: q, eg: u.eg || '', zh: u.egzh || '',
        sec: k.indexOf('e_') === 0 ? '小作文' : '大作文',
        gr: groupTitle((function (c) { return c && c.g; })(cardOf(k))),
        y: ym ? ym[1] : '通用句式（不绑年份）',
        tp: q.indexOf('英二') >= 0 ? '二' : (q.indexOf('英一') >= 0 ? '一' : '其他')
      });
    }
    function rk(v) { return /^\d/.test(v) ? Number(v) : -1; }   /* 通用句式放最后 */
    a.sort(function (x, y) {
      var rx = rk(x.y), ry = rk(y.y);
      if (rx !== ry) return ry - rx;
      return x.q < y.q ? -1 : 1;
    });
    IDX = a; return a;
  }
  function openIndex() {

    }

<script>
/* 真题自测：从 85 处真题里抽 10 句，问「这句出自哪一年哪一卷」；不动数据包，只在测试页挂一个入口 */
(function () {
  'use strict';
  var CM = {}, BEST = 'eem:qz';
  var CSS = '' +
    '.cquiz{position:fixed;inset:0;z-index:85;background:rgba(43,35,32,.32);display:flex;align-items:flex-end}' +
    '.cquiz .box{width:100%;max-height:88vh;background:#fbf8f2;border-radius:16px 16px 0 0;display:flex;flex-direction:column;overflow:hidden}' +
    '.cquiz .hd{display:flex;align-items:center;gap:10px;padding:14px 16px 6px}' +

    '.cquiz .hd .x{border:0;background:transparent;font-size:17px;color:#8d8272;padding:0 2px}' +

    '.cquiz .opt.on{border-color:#a2352a;background:#fbf1ef}' +
    '.cquiz .opt.ok{border-color:#3f7a58;background:#f1f7f2;color:#2f5c43}' +
    '.cquiz .opt.bad{border-color:#a2352a;background:#fbf1ef;color:#8e2b22}' +
    '.cquiz .fb{margin-top:14px;padding:10px 12px 12px;border-left:3px solid #a2352a;background:#fdfaf5;border-radius:0 10px 10px 0}' +
    '.cquiz .fb .fq{font-size:12.5px;color:#7a6f61;line-height:1.62}' +
    '.cquiz .fb .fg{font-size:11.5px;color:#a89c8b;margin-top:3px}' +
    '.cquiz .fb .go{font-size:12px;color:#a2352a;margin-top:6px}' +
    '.cquiz .nx{display:block;width:100%;box-sizing:border-box;margin-top:14px;padding:11px 0;border:0;border-radius:10px;background:#a2352a;color:#fdf8f0;font-size:14px}' +
    '.cquiz .score{font-size:13px;color:#5f574c;line-height:1.8;margin:8px 0 4px}' +
    '.cquiz .score b{font-size:22px;color:#a2352a}' +
    '.cquiz .wi{margin-top:12px;padding:9px 0 10px;border-bottom:1px dashed #eee6da}' +
    '.cquiz .wi .wq{font-size:12.5px;color:#7a6f61;line-height:1.6}' +
    '.cquiz .wi .we{font-family:Georgia,"Times New Roman",serif;font-size:13px;line-height:1.5;color:#2b2320;margin-top:4px}' +
    '.cquiz .sub2{display:block;width:100%;box-sizing:border-box;margin-top:12px;padding:10px 0;border:1px solid #d8cfc0;background:#fffdf8;border-radius:10px;font-size:13.5px;color:#6c6357}' +
    '@media (max-width:360px){.cquiz .qe{font-size:15px}}';

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function cardOf(cid) {
    var cs = (window.__DATA__ && window.__DATA__.cards) || [], i;
    for (i = 0; i < cs.length; i++) if (cs[i].id === cid) return cs[i];
    return null;
  }
  function groupTitle(gid) {
    var gs = (window.__DATA__ && window.__DATA__.groups) || [], i;
    for (i = 0; i < gs.length; i++) if (gs[i].id === gid) return gs[i].title;
    return '';
  }
  /* 只取能落成「年份 + 卷别」的条目；通用句式（不绑年份）不进自测，避免判无解 */
  function pool() {
    var a = [], k, u, m;
    for (k in CM) if (CM.hasOwnProperty(k)) {
      u = CM[k]; m = /^(\d{4})\s*(英[一二])/.exec(u.q || '');
      if (!m) continue;
      a.push({
        id: k, q: u.q || '', eg: u.eg || '', zh: u.egzh || '',
        y: m[1], vol: m[2], lab: m[1] + ' ' + m[2],
        sec: k.indexOf('e_') === 0 ? '小作文' : '大作文',
        gr: groupTitle((function (c) { return c && c.g; })(cardOf(k)))
      });
    }
    return a;
  }
  function shuffle(a) {
    var i, j, t;
    for (i = a.length - 1; i > 0; i--) { j = Math.floor(Math.random() * (i + 1)); t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function openQuiz() {
    var old = document.getElementById('cquiz');
    if (old) { old.parentNode.removeChild(old); return; }
    var all = pool();
    if (all.length < 10) return;
    var labs = [], i;
    for (i = 0; i < all.length; i++) if (labs.indexOf(all[i].lab) < 0) labs.push(all[i].lab);
    var qs = shuffle(all.slice()).slice(0, 10);
    var st = { i: 0, ok: 0, wrong: [], done: false };
    var box = document.createElement('div');
    box.id = 'cquiz'; box.className = 'cquiz';
    box.innerHTML = '<div class="box"><div class="hd"><h3>真题自测</h3><span class="n"></span><button class="x">×</button></div>' +
      '<div class="bd"></div></div>';
    document.body.appendChild(box);
    var bd = box.querySelector('.bd'), hd = box.querySelector('.hd .n');
    function close() { if (box.parentNode) box.parentNode.removeChild(box); }
    box.querySelector('.x').onclick = close;
    box.onclick = function (e) { if (e.target === box) close(); };

    /* 三个干扰项刻意错开：同年另一卷、邻年同卷、换年换卷——年份和卷别都得分开记，
       不能出现四个选项卷别全一样、等于只考年份的情况 */
    function opts4(t) {
      var want = [], seen = {};
      function take(list, n) {
        for (var i = 0; i < list.length && n > 0; i++) {
          var e = list[i];
          if (seen[e.lab] || e.lab === t.lab) continue;
          want.push(e.lab); seen[e.lab] = 1; n--;
        }
      }
      var dy = function (x) { return Math.abs(Number(x.y) - Number(t.y)); };
      var oth = shuffle(all.filter(function (x) { return x.lab !== t.lab; }));
      take(oth.filter(function (x) { return x.y === t.y && x.vol !== t.vol; }), 1);
      /* 老年份可能只出过一卷：那也硬塞一个另一卷的选项，别让卷别那半题白送 */
      if (!want.length) take(oth.filter(function (x) { return x.vol !== t.vol; }), 1);
      take(oth.filter(function (x) { return dy(x) <= 3 && x.vol === t.vol; }), 1);
      take(oth.filter(function (x) { return dy(x) <= 3 && x.vol !== t.vol; }), 1);
      if (want.length < 3) take(oth.filter(function (x) { return x.vol === t.vol; }), 3 - want.length);
      if (want.length < 3) take(oth, 3 - want.length);
      return shuffle(want.concat([t.lab]));
    }

    function question() {
      var t = qs[st.i], op = opts4(t), h = '';
      hd.textContent = (st.i + 1) + ' / 10';
      h = '<div class="qk">这句出自哪一年哪一卷？</div>' +
        '<div class="qe">' + esc(t.eg || t.q) + '</div>' +
        (t.zh ? '<div class="qz">' + esc(t.zh) + '</div>' : '');
      op.forEach(function (l) {

      });
      bd.innerHTML = h;
      Array.prototype.forEach.call(bd.querySelectorAll('.opt'), function (b) {
        b.onclick = function () { if (!st.answered) answer(t, this); };
      });
    }

    function answer(t, btn) {
      st.answered = true;
      var right = btn.getAttribute('data-lab') === t.lab;
      if (right) st.ok++; else st.wrong.push(t);
      Array.prototype.forEach.call(bd.querySelectorAll('.opt'), function (b) {
        if (b.getAttribute('data-lab') === t.lab) b.className = 'opt ok';
        else if (b === btn) b.className = 'opt bad';
      });
      var fb = document.createElement('div');
      fb.className = 'fb';
      fb.innerHTML = '<div class="fq">' + (right ? '对了 · ' : '记错 · ') + esc(t.q) + '</div>' +
        '<div class="fg">' + esc(t.sec + (t.gr ? ' · ' + t.gr : '')) + '</div>' +
        '<div class="go" data-jump="' + esc(t.id) + '">看这张卡 ›</div>';
      bd.appendChild(fb);
      var nx = document.createElement('button');
      nx.className = 'nx';
      nx.textContent = st.i === 9 ? '看结果' : '下一题';
      nx.onclick = function () {
        st.i++; st.answered = false;
        if (st.i >= 10) summary(); else question();
      };
      bd.appendChild(nx);
      fb.querySelector('.go').onclick = function () {
        close(); location.hash = '#/c/' + encodeURIComponent(t.id);
      };
    }

    function summary() {
      var best = 0;
      try { best = Number(localStorage.getItem(BEST) || 0); } catch (e) { }
      if (st.ok > best) { best = st.ok; try { localStorage.setItem(BEST, String(best)); } catch (e) { } }
      hd.textContent = '10 题';
      var h = '<div class="score">这轮答对 <b>' + st.ok + '</b> / 10' +
        (best > st.ok ? '　（本机最好 ' + best + ' / 10）' : (st.ok > 0 ? '　（刷新了本机最好成绩）' : '')) + '</div>';
      if (st.wrong.length) {
        h += '<div class="qk">错的这几句 · 出处都要记到今天为止</div>';
        st.wrong.forEach(function (t) {
          h += '<div class="wi"><div class="wq">' + esc(t.q) + '</div>' +
            '<div class="we">' + esc(t.eg) + '</div></div>';
        });
      }
      h += '<button class="nx" id="cq-again">再来一轮</button>' +
        '<button class="sub2" id="cq-close">先这样</button>';
      bd.innerHTML = h;
      bd.querySelector('#cq-again').onclick = function () { close(); openQuiz(); };
      bd.querySelector('#cq-close').onclick = close;
    }

    question();
  }
  /* 测试页顶部挂入口 */
  function mountTest() {

      '抽 10 句，问这句出自哪一年哪一卷 · 答错当场给完整出处</small></div><div class="gp">测</div></button></div></div>';
    box.addEventListener('click', function (e) {
