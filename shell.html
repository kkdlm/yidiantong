<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#F7F4EA">
<title>法硕一点通 · 书库</title>
<style>
:root{
  --ink:#2A2620; --ink2:#4A4438; --ink3:#7C766A;
  --green:#1F4A38; --green2:#2C5A44; --red:#A8432F; --gold:#C8A96A;
  --paper:#F7F4EA; --card:#FFFDF6; --line:rgba(0,0,0,.075);
  --hdr:56px; --foot:56px; --maxw:640px;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  overscroll-behavior:none}
img{max-width:100%;height:auto}
.bar{position:fixed;left:0;right:0;top:0;z-index:30;height:calc(var(--hdr) + var(--safe-t));
  padding-top:var(--safe-t);display:flex;align-items:center;gap:9px;padding-left:12px;padding-right:10px;
  background:linear-gradient(180deg,rgba(247,244,234,.99),rgba(247,244,234,.94));
  border-bottom:1px solid var(--line);backdrop-filter:saturate(1.4) blur(10px)}
.seal{width:32px;height:32px;border-radius:8px;background:var(--green);color:#F4EFE2;
  display:grid;place-items:center;font:700 15px/1 'Songti SC','STSong',serif;flex:0 0 auto}
.seal.red{background:var(--red)}
.seal.gray{background:#8C8578}
.tt{font:700 16.5px/1.15 'Songti SC','STSong',serif;letter-spacing:.2px;flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt small{display:block;font:400 10.5px/1.4 -apple-system,'PingFang SC';color:var(--ink3);
  letter-spacing:.4px;margin-top:2px;overflow:hidden;text-overflow:ellipsis}
.ico{width:36px;height:36px;border-radius:10px;border:0;background:transparent;color:var(--ink2);
  display:grid;place-items:center;font-size:17px}
.ico:active{background:rgba(0,0,0,.05)}
.ico[hidden]{display:none!important}
.chip[hidden]{display:none!important}
.chip{border:1px solid var(--line);background:rgba(255,255,255,.6);color:var(--ink2);
  font-size:11.5px;padding:5px 9px;border-radius:20px;display:inline-flex;align-items:center;gap:4px}
.chip.on{background:rgba(31,74,56,.09);border-color:rgba(31,74,56,.25);color:var(--green);font-weight:600}
main{position:fixed;left:0;right:0;top:calc(var(--hdr) + var(--safe-t));bottom:calc(var(--foot) + var(--safe-b));
  overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.page{padding:12px 12px 26px;max-width:var(--maxw);margin:0 auto}
.reader{position:absolute;inset:0;background:var(--paper);display:none}
.reader.on{display:block}
.fr{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent;display:block}
.fr.off{display:none}
.h1{font:700 20px/1.25 'Songti SC','STSong',serif;margin:4px 0 2px;letter-spacing:.3px}
.sub{color:var(--ink3);font-size:12px;line-height:1.6}
.rule{display:flex;align-items:center;gap:8px;margin:16px 0 9px;color:var(--ink3);font-size:11.5px;letter-spacing:.6px}
.rule:after{content:'';flex:1;height:1px;background:var(--line)}
.bk{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:11px 12px;margin-bottom:10px;position:relative;overflow:hidden}
.bk .last{font-style:normal;font-size:10px;color:#8A7B4E;background:rgba(200,169,106,.20);
  border:1px solid rgba(200,169,106,.35);border-radius:5px;padding:0 5px;margin-left:7px;vertical-align:1px;letter-spacing:.2px}
.bk .spine{width:44px;height:56px;border-radius:5px;display:grid;place-items:center;flex:0 0 auto;
  color:#F6F1E3;font:700 17px/1 'Songti SC','STSong',serif;position:relative;
  box-shadow:inset -7px 0 10px -6px rgba(0,0,0,.42),inset 3px 0 5px -3px rgba(255,255,255,.35)}
.bk .spine:before{content:'';position:absolute;left:5px;top:0;bottom:0;width:1px;background:rgba(255,255,255,.22)}
.bk .meta{flex:1;min-width:0}
.bk .meta b{font-size:15px;display:block;line-height:1.35}
.bk .meta span{font-size:11px;color:var(--ink3);display:block;margin-top:2px}
.bk .go{border:0;border-radius:12px;padding:9px 15px;background:var(--green);color:#F4EFE2;font-size:12.5px;font-weight:600}
.bk .go:active{background:var(--green2)}
.bk .go.soon{background:#EFEADE;color:#8C8578}
.bk .badge{position:absolute;right:10px;top:7px;font-size:10px;color:var(--red);border:1px solid rgba(168,67,47,.3);
  border-radius:6px;padding:1px 5px;background:rgba(168,67,47,.06)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0}
.row b{font-weight:600}
.hr{height:1px;background:var(--line);margin:2px 0}
.bar-in{height:6px;border-radius:6px;background:rgba(31,74,56,.12);overflow:hidden;margin:8px 0 2px}
.bar-in i{display:block;height:100%;background:linear-gradient(90deg,var(--green2),var(--green));border-radius:6px;transition:width .5s}
.pill{font-size:11px;color:var(--green);background:rgba(31,74,56,.08);border-radius:20px;padding:3px 9px}
.pill.red{color:var(--red);background:rgba(168,67,47,.08)}
.pill.gold{color:#7A5C24;background:rgba(200,169,106,.22)}
.btn{width:100%;border:0;border-radius:12px;padding:12px;background:var(--green);color:#F4EFE2;
  font-size:14px;font-weight:600;margin-top:8px}
.btn:active{background:var(--green2)}
.btn.ghost{background:transparent;color:var(--green);border:1px solid rgba(31,74,56,.28)}
.btn.ghost:active{background:rgba(31,74,56,.06)}
.btn.gold{background:linear-gradient(135deg,#C8A96A,#B8933F);color:#3B2E12}
.btn[disabled]{opacity:.5}
.btn.sm{padding:9px;font-size:12.5px}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:30;height:calc(var(--foot) + var(--safe-b));
  padding-bottom:var(--safe-b);display:flex;align-items:stretch;
  background:rgba(247,244,234,.985);border-top:1px solid var(--line);backdrop-filter:blur(10px)}
.foot a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  color:var(--ink3);text-decoration:none;font-size:11px;letter-spacing:.3px;position:relative}
.foot a.on{color:var(--green);font-weight:600}
.foot a.on:after{content:'';position:absolute;top:0;width:26px;height:2px;border-radius:2px;background:var(--green)}
.foot a i{font-style:normal;font-size:17px;line-height:1;opacity:.9}
.mask{position:fixed;inset:0;background:rgba(30,28,22,.42);z-index:60;opacity:0;pointer-events:none;transition:opacity .22s}
.mask.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:70;max-height:92vh;display:flex;flex-direction:column;
  background:var(--paper);border-radius:22px 22px 0 0;transform:translateY(101%);transition:transform .28s cubic-bezier(.22,.9,.3,1);
  box-shadow:0 -12px 34px rgba(30,28,22,.16)}
.sheet.on{transform:translateY(0)}
.sheet .grab{width:38px;height:4px;border-radius:4px;background:rgba(0,0,0,.16);margin:8px auto 2px;flex:0 0 auto}
.sheet .hd{display:flex;align-items:center;gap:8px;padding:6px 16px 10px;flex:0 0 auto}
.sheet .hd b{font:700 17px/1.2 'Songti SC','STSong',serif}
.sheet .hd .x{margin-left:auto;width:34px;height:34px;border-radius:50%;border:0;background:rgba(0,0,0,.05);color:var(--ink2);font-size:16px}
.sheet .bd{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:2px 12px calc(20px + var(--safe-b))}
.wrap{display:flex;flex-direction:column;align-items:center;padding:2px 0 4px}
.pool{font-size:11.5px;color:var(--ink3);margin:2px 0 10px;text-align:center;line-height:1.6}
.stage2{position:relative;width:272px;height:272px;margin:2px auto}
.ring{position:absolute;inset:0;border-radius:50%;
  background:linear-gradient(145deg,#E8CE96,#C8A96A 45%,#B8933F);
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.35),0 6px 18px rgba(184,147,63,.22)}
.disc{position:absolute;inset:6.5%;border-radius:50%;overflow:hidden;background:#F8F3E4;
  transition:transform 2.4s cubic-bezier(.15,.9,.2,1)}
.labs{position:absolute;inset:0}
.li{position:absolute;inset:0}
.li i{position:absolute;left:50%;top:50%;font-style:normal;font-size:10px;letter-spacing:.2px;color:#4A4028;
  white-space:nowrap;transform:translate(-50%,-50%) rotate(var(--a)) translateY(-84px) rotate(calc(-1 * var(--a)))}
.pin{position:absolute;top:-4%;left:50%;margin-left:-8px;width:0;height:0;z-index:3;
  border-left:8px solid transparent;border-right:8px solid transparent;border-top:15px solid var(--red);
  filter:drop-shadow(0 2px 2px rgba(0,0,0,.18))}
.go-c{position:absolute;left:35%;top:35%;width:30%;aspect-ratio:1;border-radius:50%;border:0;
  background:radial-gradient(circle at 50% 35%,#2C5A44,#1F4A38);color:#F4EFE2;display:flex;flex-direction:column;
  align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.2),inset 0 0 0 2px rgba(255,255,255,.12)}
.go-c.off{background:radial-gradient(circle at 50% 35%,#7C7768,#5F5B50);box-shadow:0 3px 10px rgba(0,0,0,.15),inset 0 0 0 2px rgba(255,255,255,.10)}
.go-c.off b{opacity:.72}
.go-c b{font:700 18px/1.1 'Songti SC','STSong',serif}
.go-c i{font-style:normal;font-size:9px;opacity:.85;margin-top:2px}
.resslot{font-size:12.5px;color:var(--ink2);text-align:center;margin-top:11px;line-height:1.7;min-height:20px}
.resslot b{color:var(--red)}
.dots{display:flex;gap:5px;margin:9px 0 2px}
.dots .d{flex:1;height:32px;border-radius:9px;display:grid;place-items:center;font-size:10.5px;
  border:1px solid var(--line);color:var(--ink3);background:rgba(255,255,255,.5)}
.dots .d.on{background:linear-gradient(180deg,rgba(168,67,47,.14),rgba(168,67,47,.2));
  border-color:rgba(168,67,47,.3);color:var(--red);font-weight:600}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:11px;
  padding:11px 12px;margin-top:7px;background:rgba(255,255,255,.62);font-size:12.5px;color:var(--ink)}
.opt:active{background:rgba(0,0,0,.04)}
input,textarea{width:100%;border:1px solid rgba(0,0,0,.14);border-radius:10px;padding:11px;font-size:13px;
  outline:none;background:#fff;color:var(--ink);font-family:inherit}
input:focus{border-color:rgba(31,74,56,.4)}
.hint{font-size:11.5px;color:var(--ink3);line-height:1.7;margin-top:8px}
.toast{position:fixed;left:50%;bottom:calc(var(--foot) + 26px);transform:translateX(-50%) translateY(8px);
  background:rgba(38,34,26,.94);color:#F4EFE2;font-size:12.5px;padding:9px 15px;border-radius:11px;
  max-width:78vw;text-align:center;opacity:0;transition:.22s;z-index:90;pointer-events:none;line-height:1.5}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.veil{position:absolute;inset:0;z-index:5;display:none;place-items:center;
  background:linear-gradient(180deg,#EFEADB,#F7F4EA 65%)}
.veil.on{display:grid}
.veil .box{text-align:center;width:78%;max-width:300px}
.veil .cover{width:96px;height:126px;border-radius:8px;margin:0 auto 16px;display:grid;place-items:center;
  color:#F6F1E3;font:700 26px/1 'Songti SC','STSong',serif;
  box-shadow:inset -12px 0 18px -12px rgba(0,0,0,.5),0 10px 24px rgba(0,0,0,.16)}
.veil .tt2{font:700 17px/1.3 'Songti SC','STSong',serif;margin-bottom:4px}
.veil .ss{font-size:11.5px;color:var(--ink3);margin-bottom:14px}
.veil .pb{height:5px;border-radius:5px;background:rgba(31,74,56,.14);overflow:hidden}
.veil .pb i{display:block;height:100%;width:6%;background:linear-gradient(90deg,var(--green2),var(--green));transition:width .35s}
.veil .pp{font-size:10.5px;color:var(--ink3);margin-top:8px;font-variant-numeric:tabular-nums}
@media (min-width:700px){ :root{--maxw:700px} .stage2{width:300px;height:300px} }
</style>
</head>
<body>

<header class="bar" id="bar">
  <div class="seal" id="barSeal">书</div>
  <div class="tt" id="barTitle">法硕一点通<small id="barSub">2027 法硕非法学 · 一站上岸</small></div>
  <button class="chip" id="verChip" onclick="S.showVer()">v1.3.0.0</button>
  <button class="ico" id="barBack" onclick="S.backToLib()" hidden>‹</button>
</header>

<main id="stage">
  <div class="page" id="lib"></div>
  <div class="reader" id="reader">
    <div class="veil" id="veil">
      <div class="box">
        <div class="cover" id="veilCover">史</div>
        <div class="tt2" id="veilTitle">正在打开</div>
        <div class="ss" id="veilSub">首次打开需要下载科目包</div>
        <div class="pb"><i id="veilBar"></i></div>
        <div class="pp" id="veilPct">准备中…</div>
      </div>
    </div>
  </div>
</main>

<nav class="foot" id="foot"></nav>

<div class="mask" id="mask" onclick="S.closeSheet()"></div>
<div class="sheet" id="sheet">
  <div class="grab" onclick="S.closeSheet()"></div>
  <div class="hd"><b id="sheetTitle">我的</b><button class="x" onclick="S.closeSheet()">✕</button></div>
  <div class="bd" id="sheetBody"></div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';
var LS='yidiantong.shell.v1';
var BOOKS=[
  {id:'fz',name:'法制史',seal:'史',color:'#1F4A38',url:'packs/fz.html',ver:'1.3.0.0',
   desc:'169 考点 · 3561 条 · 6.70 MB',tabs:[{id:'home',n:'总览'},{id:'browse',n:'速览'},{id:'recite',n:'背诵'},{id:'topic',n:'专题'},{id:'quiz',n:'刷题'},{id:'me',n:'我的'}]},
  {id:'zz',name:'政治',seal:'政',color:'#A8432F',url:'packs/zz.html',ver:'1.3.0.0',
   desc:'100 考点 · 596 题 · 1.12 MB',tabs:[{id:'home',n:'总览'},{id:'browse',n:'速览'},{id:'recite',n:'背诵'},{id:'topic',n:'专题'},{id:'quiz',n:'刷题'},{id:'me',n:'我的'}]},
  {id:'en',name:'英语大作文',seal:'英',color:'#8C8578',url:'packs/en.html',ver:'1.3.10',
   desc:'132 短语 · 六大方面 · 图表词汇 + SRS',tabs:[{id:'today',n:'今日'},{id:'words',n:'词库'},{id:'drill',n:'测试'}]}
];
function today(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function load(){try{var r=localStorage.getItem(LS);return r?JSON.parse(r):null}catch(e){return null}}
var DEF={vip:8,vipUntil:'2026-12-01',signDays:2,signedDate:'',daily:0,dDate:'',pInvite:0,invite:0,
  invCode:'FZ-8K2M',fzPct:0,zzPct:0,enPct:0,lastBook:'fz',lastTab:'',ver:'1.3.0.0',
  theme:{fz:100,night:false},stats:{},chat:[],
  act:{on:true,off:'活动暂时关闭，已经抽到的不会收回'}};
var ST=load()||{};
for(var k in DEF){ if(ST[k]===undefined||ST[k]===null) ST[k]=DEF[k]; }
if(!ST.theme) ST.theme={fz:100,night:false};
if(!ST.act) ST.act={on:true,off:'活动暂时关闭，已经抽到的不会收回'};
function actOn(){ return !(ST.act && ST.act.on===false); }

function save(){try{localStorage.setItem(LS,JSON.stringify(ST))}catch(e){}}
function rollDay(){var t=today(); if(ST.dDate!==t){ST.dDate=t; ST.daily=0; save();} }
rollDay();

var $=function(id){return document.getElementById(id)};
function book(id){for(var i=0;i<BOOKS.length;i++) if(BOOKS[i].id===id) return BOOKS[i]; return null}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var TABS_ICON={home:'▤',browse:'≡',recite:'✎',topic:'◷',quiz:'✓',me:'☺',today:'☉',words:'▤',drill:'✓',cards:'▦'};

/* ---------- iframe 管理 ---------- */
var FR={}, seq=0;
function ensure(id){
  if(FR[id]) return FR[id];
  var b=book(id); if(!b) return null;
  var el=document.createElement('iframe');
  el.className='fr off'; el.title=b.name; el.setAttribute('loading','eager'); el.src=b.url;
  $('reader').appendChild(el);
  var rec={el:el,ready:false,tabs:b.tabs,loadAt:0,use:++seq,tab:''};
  FR[id]=rec;
  el.addEventListener('load',function(){
    rec.loadAt=Date.now();
    setTimeout(function(){ if(!rec.ready) markReady(id,'load'); },760);
  });
  return rec;
}
function markReady(id,how){
  var rec=FR[id]; if(!rec) return;
  if(!rec.ready){ rec.ready=true; rec.use=++seq;
    if(how==='msg') hideVeil();
  }
}
function showFrame(id){
  Object.keys(FR).forEach(function(k){ FR[k].el.classList.add('off'); });
  var rec=ensure(id); if(!rec) return;
  rec.el.classList.remove('off'); rec.use=++seq;
  var b=book(id);
  $('barSeal').textContent=b.seal; $('barSeal').className='seal'+(b.id==='zz'?' red':'');
  $('barTitle').innerHTML=esc(b.name)+'<small>'+esc(b.desc)+'</small>';
  $('barBack').hidden=false;
  $('reader').classList.add('on');
  $('lib').style.display='none';
  evict(id);
}
function evict(cur){
  var ids=Object.keys(FR); if(ids.length<=2) return;
  ids.sort(function(a,b){return FR[a].use-FR[b].use});
  for(var i=0;i<ids.length-2;i++){
    if(ids[i]===cur) continue;
    try{ FR[ids[i]].el.parentNode.removeChild(FR[ids[i]].el); }catch(e){}
    delete FR[ids[i]];
  }
}
function send(id,m){
  var rec=FR[id]; if(!rec) return;
  try{ rec.el.contentWindow.postMessage(Object.assign({src:'shell'},m),'*'); }catch(e){}
}
function showVeil(id){
  var b=book(id);
  var v=$('veil'); v.classList.add('on');
  $('veilCover').textContent=b.seal; $('veilCover').style.background=b.color;
  $('veilTitle').textContent='正在打开 '+b.name;
  $('veilSub').textContent='首次打开需要下载科目包（'+b.desc.split(' · ').pop()+'），之后就秒开';
  $('veilBar').style.width='6%'; $('veilPct').textContent='准备中…';
  var p=6,t=0,iv=setInterval(function(){
    if(!v.classList.contains('on')){ clearInterval(iv); return; }
    t++; if(t%3===0) p=Math.min(92,p+Math.max(1,(92-p)/7));
    $('veilBar').style.width=p+'%';
    $('veilPct').textContent=p<40?'下载科目包…':(p<80?'解包与初始化…':'正在渲染首屏…');
  },240);
  setTimeout(function(){ if($('veil').classList.contains('on')) hideVeil(); }, 14000);
}
function hideVeil(){
  $('veil').classList.remove('on');
}

/* ---------- 底栏 ---------- */
function footHtml(){
  var items;
  if(ST.view==='book'&&ST.book){
    var t=(FR[ST.book]&&FR[ST.book].tabs)||(book(ST.book)||{}).tabs||[];
    items=t.filter(function(x){return x.id!=='me'}).map(function(x){return {id:x.id,n:x.n,i:TABS_ICON[x.id]||'·'}});
    items.push({id:'me',n:'我的',i:'☺'});
  } else {
    items=[{id:'lib',n:'书库',i:'▤'},{id:'study',n:'学习',i:'▦'},{id:'me',n:'我的',i:'☺'}];
  }
  var cur=ST.view==='book'?(ST.tab||''):(ST.view==='lib'?'lib':ST.view);
  return items.map(function(x){
    return '<a class="'+(x.id===cur?'on':'')+'" onclick="S.nav(\''+x.id+'\')"><i>'+x.i+'</i>'+esc(x.n)+'</a>';
  }).join('');
}
function paintFoot(){ $('foot').innerHTML=footHtml(); }

/* ---------- 渲染 ---------- */
function libHtml(){
  var rows=BOOKS.map(function(b){
    var btn=b.soon? '<button class="go soon" onclick="S.open(\''+b.id+'\')">筹备</button>'
      :'<button class="go" onclick="S.open(\''+b.id+'\')">打开</button>';
    var badge=(ST.lastBook===b.id&&!b.soon)?'<i class="last">上次</i>':'';
    return '<div class="bk"><i class="spine" style="background:'+b.color+'">'+esc(b.seal)+'</i>'+

/* ---------- 与科目通信 ---------- */
window.addEventListener('message',function(e){
  var d=e.data||{}; if(d.src!=='pack') return;
  var id=null;
  Object.keys(FR).forEach(function(k){ if(FR[k].el.contentWindow===e.source) id=k; });
  if(!id) return;
  var rec=FR[id];
  if(d.t==='ready'){ rec.tabs=d.tabs||rec.tabs; rec.ready=true; rec.use=++seq; hideVeil();
    send(id,{t:'theme',fz:ST.theme.fz,night:ST.theme.night,vip:ST.vip,days:vipDays()});
    if(ST.book===id) paintFoot(); }
  else if(d.t==='stat'){
    rec.ready=true;
    if(id==='fz'&&typeof d.pct==='number') ST.fzPct=d.pct;
    if(id==='zz'&&typeof d.pct==='number') ST.zzPct=d.pct;
    if(id==='en'&&typeof d.pct==='number') ST.enPct=d.pct;
    if(d.items){ ST.stats=d.items; }
    save();
    if(ST.view==='study') render();
  }
  else if(d.t==='askMe'){ openSheet('me'); }
  else if(d.t==='tab'){ ST.tab=d.id; ST.lastTab=d.id; save(); paintFoot(); }
  else if(d.t==='toast'){ toast(d.msg||''); }
});
S.sendTheme=function(){
  Object.keys(FR).forEach(function(k){ send(k,{t:'theme',fz:ST.theme.fz,night:ST.theme.night,vip:ST.vip,days:vipDays()}); });
};

var PRIZES=[
  {n:'会员 30 天',s:'会员30天',d:30,w:1},
  {n:'再来一次',s:'再来一次',d:0,w:12,again:true},
  {n:'会员 3 天',s:'会员3天',d:3,w:6},

  {n:'会员 7 天',s:'会员7天',d:7,w:3},

  {n:'再来一次',s:'再来一次',d:0,w:12,again:true},
  {n:'会员 1 天',s:'会员1天',d:1,w:14}
];
var SEG=360/PRIZES.length, ROT=0, SPIN=false;
function lotteryHtml(){
  var labs='',stops='';
  PRIZES.forEach(function(p,i){
    labs+='<div class="li"><i style="--a:'+(i*SEG)+'deg">'+p.s+'</i></div>';
    stops+=(i%2?'#EBE1C9':'#F8F3E4')+' '+(i*SEG-SEG/2)+'deg '+(i*SEG+SEG/2)+'deg,';
  });
  var p=pools(), on=actOn();
  return '<div class="wrap"><div class="pool">'+(on?poolLine():'已关闭 · 已抽到的不会收回')+'</div>'+
    '<div class="stage2"><div class="ring"></div>'+
    '<div class="disc" id="disc" style="background:conic-gradient('+stops.slice(0,-1)+')"><div class="labs">'+labs+'</div></div>'+
    '<div class="pin"></div>'+
    '<button class="go-c'+(on?'':' off')+'" id="goBtn" onclick="'+(on?'S.spin()':'S.tipOff()')+'"><b>抽</b><i id="goU">'+(on?(p.total>0?('剩 '+p.total):'没次数了'):'已关闭')+'</i></button></div>'+
    '<div class="resslot" id="ltRes">'+(on?(ST.last?('上次：'+esc(ST.last)):'今天签个到，就能转一次'):esc(ST.act.off||'活动暂时关闭'))+'</div>'+
    (on?'<div class="hint" style="text-align:center;max-width:300px">规则：签到得的次数当天有效（零点清零）；邀请得的可累积。抽奖先扣当天，再扣累积。</div>':'')+'</div>';
}
S.spin=function(){
  if(!actOn()){ S.tipOff(); return; }
  if(SPIN) return;
  var p=pools();
  if(p.total<=0){ toast('次数用完了：去签到，或邀请朋友'); return; }
  SPIN=true;
  var rnd=Math.random()*PRIZES.reduce(function(a,b){return a+b.w},0), acc=0, idx=0;
  for(var i=0;i<PRIZES.length;i++){ acc+=PRIZES[i].w; if(rnd<=acc){ idx=i; break; } }
  var base=Math.floor(ROT/360)*360, target=base+360*5+(360-idx*SEG);
  ROT=target;
  var d=$('disc'), g=$('goBtn');
  if(d) d.style.transform='rotate('+target+'deg)';
  if(g){ g.style.opacity=.5; $('goU').textContent='…'; }
  setTimeout(function(){
    SPIN=false;
    if(ST.daily>0) ST.daily--; else if(ST.pInvite>0) ST.pInvite--;
    var prize=PRIZES[idx], msg='';
    if(prize.d>0){ ST.vip+=prize.d; ST.last=prize.n; msg='抽中 <b>'+prize.n+'</b> · 会员已到账'; }
    else if(prize.again){ if(ST.daily>=0) ST.daily+=1; ST.last='再来一次'; msg='<b>再来一次</b> · 次数已回补'; }
    else { ST.last='谢谢参与'; msg='<b>谢谢参与</b> · 明天再来'; }
    save();
    var res=$('ltRes'); var pp=pools();
    if(res) res.innerHTML=msg+'<div class="sub" style="padding-top:3px">还剩 '+pp.total+' 次（当天 '+pp.d+' · 攒着 '+pp.p+'）</div>';
    if($('goU')) $('goU').textContent=(pp.total>0?('剩 '+pp.total):'没次数了');
    if(g) g.style.opacity=(pp.total>0?1:.55);
    S.sendTheme();
  },2470);
};

/* ---------- 邀请 ---------- */
function inviteHtml(){
  return '<div class="card"><div style="font-size:13.5px;font-weight:700">我的邀请码 '+esc(ST.invCode)+'</div>'+
    '<div class="hint">朋友用这个码注册，你得 1 次抽奖机会（可累积，不清零）</div>'+
    '<button class="btn ghost sm" onclick="S.copyInvite()">复制邀请链接</button></div>'+
    '<div class="card"><div class="row"><span>已邀请</span><b>'+ST.invite+' 人</b></div><div class="hr"></div>'+
    '<div class="row"><span>攒着的抽奖次数</span><b>'+ST.pInvite+' 次</b></div></div>'+
    '<button class="btn" onclick="S.simInvite()">模拟：一个朋友注册成功</button>'+
    '<div class="hint">真机接后台后，注册回调里给邀请人 +1（写入 supabase 的 invites 表），再同步到这里的累积池。</div>';
}
S.copyInvite=function(){
  var link=location.origin+location.pathname+'?ref='+ST.invCode;
  try{ navigator.clipboard.writeText(link); toast('邀请链接已复制'); }
  catch(e){ toast('链接：'+link); }
};
S.simInvite=function(){
  ST.invite++; ST.pInvite++; save(); openSheet('invite');
  toast('邀请成功 · 累积抽奖 +1 次');
  S.sendTheme();
};

/* ---------- 卡密 ---------- */
S.redeem=function(){
  var v=(($('cdk')||{}).value||'').trim().toUpperCase();
  var m=v.match(/FZ-(\d{1,2})-?/);
  if(!m||v.replace(/\s/g,'').length<8){ toast('卡密格式不对'); return; }
  var days=parseInt(m[1],10)||7;
  ST.vip+=days;
  var d=new Date(); d.setDate(d.getDate()+ST.vip);
  ST.vipUntil=d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
  save(); closeSheet(); toast('兑换成功 · 会员 +'+days+' 天'); openSheet('me'); S.sendTheme();
};

/* ---------- 客服 ---------- */
S.sendMsg=function(){
  var i=$('cin'), v=(i&&i.value||'').trim(); if(!v) return;
  ST.chat.push({me:true,t:v}); save(); openSheet('chat');
  setTimeout(function(){ ST.chat.push({t:'收到～这条我记下了，管理员会在后台「反馈」里回复你。'}); save(); if(sheetKind==='chat') openSheet('chat'); },780);
};

/* ---------- 主题 ---------- */
S.setTheme=function(k,v){
  ST.theme[k]=v; save(); S.sendTheme(); openSheet('theme');
  toast(k==='fz'?('字号已设为 '+v+'%，已下发到科目'):(v?'已切到夜间':'已切回日间'));
};

/* ---------- 版本 ---------- */
S.showVer=function(){ openSheet('ver'); };
S.checkVer=function(){
  fetch('version.json',{cache:'no-store'}).then(function(r){return r.ok?r.json():null}).then(function(j){
    if(j&&j.version&&j.version!==ST.ver){ toast('发现新版本 v'+j.version+' · 下次打开生效'); }
    else if(j&&j.version){ toast('已是最新 v'+j.version); }
    else { toast('已是最新 v'+ST.ver); }
  }).catch(function(){ toast('已是最新 v'+ST.ver); });
};

})();

</script>
</body>
</html>
