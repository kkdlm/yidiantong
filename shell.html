<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#F4F1E7">
<title>法硕一点通 · 书库</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="apple-touch-startup-image" href="icons/apple-splash.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="法硕一点通">
<style id="splash-critical">
/* 最早解析：弱网下文档没下完时先给窗口米色背景并画出启动屏，避免白屏 */
html{background-color:#F4F1E7 !important}
#splash{position:fixed;inset:0;z-index:9999;background:#F4F1E7;display:flex;flex-direction:column;
  align-items:center;justify-content:center;margin:0;padding:0}
#splash .sp-in{display:flex;flex-direction:column;align-items:center}
#splash .sp-logo{width:88px;height:88px;border-radius:22px;background:#1C4735;color:#F4EFE2;
  display:flex;align-items:center;justify-content:center;
  font:700 42px/1 'Songti SC','STSong',serif}
#splash .sp-name{margin:26px 0 8px;font:700 25px/1 'Songti SC','STSong',serif;
  letter-spacing:.14em;color:#1E1A14}
#splash .sp-slogan{margin:0;font-size:12px;letter-spacing:.08em;color:#7A7365}
#splash .sp-bar{width:188px;max-width:60vw;height:3px;border-radius:99px;
  background:rgba(28,71,53,.14);margin-top:26px;overflow:hidden}
#splash .sp-fill{height:100%;width:0%;border-radius:99px;background:#1C4735;transition:width .3s ease}
#splash .sp-msg{margin:12px 0 0;font-size:10.5px;letter-spacing:.06em;color:#7A7365;min-height:15px}
</style>
<style>
:root{
  --ink:#1E1A14; --ink2:#423C31; --ink3:#7A7365; --ink4:#A39C8E;
  --green:#1C4735; --green2:#27563F; --green3:#356850; --red:#A2402C; --red2:#BC543D;
  --gold:#B89451; --gold2:#D2B578;
  --paper:#F4F0E5; --paper2:#ECE6D6; --card:#FFFFFF; --card2:#FAF6EC;
  --line:rgba(30,26,18,.07); --line2:rgba(30,26,18,.11);
  --r-sm:12px; --r-md:16px; --r-lg:18px; --r-xl:24px;
  --sh-sm:0 1px 2px rgba(28,24,16,.05),0 2px 6px rgba(28,24,16,.04);
  --sh-md:0 2px 4px rgba(28,24,16,.04),0 8px 20px rgba(28,24,16,.08);
  --sh-lg:0 8px 16px rgba(28,24,16,.08),0 20px 48px rgba(28,24,16,.14);
  --hdr:54px; --foot:52px; --maxw:640px;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
/* iOS 26 透明根背景会回退成白色：html/body 显式声明不透明纯色，供 Safari 工具栏/安全区采样；
   渐变作为 background-image 叠加，纯色始终兜底 */
html{background-color:#F4F1E7}
body{margin:0;background-color:#F4F1E7;
  background-image:linear-gradient(180deg,#F7F3EA 0%,var(--paper) 38%,var(--paper2) 100%);
  background-attachment:fixed;color:var(--ink);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  overscroll-behavior:none}
img{max-width:100%;height:auto}
svg{display:block}
[hidden]{display:none!important}
.bar{position:fixed;left:0;right:0;top:0;z-index:30;height:calc(var(--hdr) + var(--safe-t));
  padding-top:var(--safe-t);display:flex;align-items:center;gap:9px;padding-left:14px;padding-right:12px;
  background:rgba(245,241,230,.82);
  border-bottom:1px solid transparent;backdrop-filter:saturate(1.6) blur(18px);-webkit-backdrop-filter:saturate(1.6) blur(18px)}
.bar.bookmode{ border-bottom-color:var(--line); }
.seal{width:34px;height:34px;border-radius:10px;background:var(--green);color:#F4EFE2;
  display:grid;place-items:center;font:700 15px/1 'Songti SC','STSong',serif;flex:0 0 auto;
  box-shadow:0 3px 10px rgba(30,74,55,.25)}
.seal.red{background:var(--red);box-shadow:0 3px 10px rgba(168,67,47,.25)}
.seal.gray{background:#8C8578;box-shadow:0 3px 10px rgba(140,133,120,.25)}
.tt{font:700 16.5px/1.15 'Songti SC','STSong',serif;letter-spacing:.2px;flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt small{display:block;font:400 10.5px/1.4 -apple-system,'PingFang SC';color:var(--ink3);
  letter-spacing:.4px;margin-top:2px;overflow:hidden;text-overflow:ellipsis}
.ico{width:38px;height:38px;border-radius:11px;border:0;background:transparent;color:var(--ink2);
  display:grid;place-items:center;cursor:pointer;transition:background .15s,transform .1s}
.ico svg{width:21px;height:21px}
.ico:active{background:rgba(33,29,23,.06);transform:scale(.94)}
.ico[hidden]{display:none!important}
/* 科目内圆形返回按钮 */
.navbtn{width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,253,247,.72);
  color:var(--ink);display:grid;place-items:center;cursor:pointer;
  box-shadow:var(--sh-sm);backdrop-filter:blur(8px);transition:transform .1s,background .15s}
.navbtn svg{width:20px;height:20px}
.navbtn:active{transform:scale(.92);background:var(--card)}
.chip[hidden]{display:none!important}
.chip{border:1px solid var(--line);background:rgba(255,253,247,.7);color:var(--ink3);
  font-size:11px;padding:5px 10px;border-radius:20px;display:inline-flex;align-items:center;gap:4px;
  font-variant-numeric:tabular-nums;letter-spacing:.2px}
.chip.on{background:rgba(30,74,55,.09);border-color:rgba(30,74,55,.25);color:var(--green);font-weight:600}
main{position:fixed;left:0;right:0;top:calc(var(--hdr) + var(--safe-t));bottom:calc(var(--foot) + var(--safe-b));
  overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
/* 书内：壳横条与底栏全部隐去，包界面顶到安全区，返回键由包内原生承载 */
body.inbook #bar{display:none}
body.inbook .foot{display:none}
body.inbook main{top:0;bottom:0;overflow:hidden}
body.inbook .reader{top:0}
.page{padding:12px 12px 26px;max-width:var(--maxw);margin:0 auto}
.reader{position:absolute;inset:0;background:var(--paper);display:none}
.reader.on{display:block}
.fr{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent;display:block}
.fr.off{display:none}
.h1{font:700 20px/1.25 'Songti SC','STSong',serif;margin:4px 0 2px;letter-spacing:.3px}
.sub{color:var(--ink3);font-size:12px;line-height:1.6}
.rule{display:flex;align-items:center;gap:8px;margin:16px 0 9px;color:var(--ink3);font-size:11.5px;letter-spacing:.6px}
.rule:after{content:'';flex:1;height:1px;background:var(--line)}
.bk{display:flex;align-items:center;gap:13px;background:var(--card);border:1px solid transparent;
  border-radius:var(--r-lg);padding:14px 15px;margin-bottom:12px;position:relative;overflow:hidden;
  box-shadow:var(--sh-md);transition:transform .14s,box-shadow .22s}
.bk:active{transform:scale(.982);box-shadow:var(--sh-lg)}
.bk .last{font-style:normal;font-size:10px;color:#8A6E3C;background:rgba(190,155,87,.16);
  border:1px solid rgba(190,155,87,.32);border-radius:6px;padding:1px 6px;margin-left:7px;letter-spacing:.3px}
.bk .spine{width:46px;height:60px;border-radius:7px;display:grid;place-items:center;flex:0 0 auto;
  color:#F6F1E3;font:700 18px/1 'Songti SC','STSong',serif;position:relative;
  box-shadow:inset -8px 0 12px -7px rgba(0,0,0,.48),inset 4px 0 6px -4px rgba(255,255,255,.4),0 4px 12px rgba(20,16,10,.18)}
.bk .spine:before{content:'';position:absolute;left:6px;top:0;bottom:0;width:1px;background:rgba(255,255,255,.24)}
.bk .meta{flex:1;min-width:0}
.bk .meta b{font-size:15.5px;display:block;line-height:1.35;letter-spacing:.2px}
.bk .meta span{font-size:11px;color:var(--ink3);display:block;margin-top:3px;line-height:1.5}
.bk .go{border:0;border-radius:11px;padding:10px 15px;background:var(--green);color:#F4EFE2;
  font-size:12.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:4px;
  box-shadow:0 4px 12px rgba(30,74,55,.24);transition:background .15s,transform .1s}
.bk .go svg{width:14px;height:14px}
.bk .go:active{background:var(--green2);transform:scale(.95)}
.bk .go.soon{background:#ECE5D4;color:#8C8578;box-shadow:none}
.bk .badge{position:absolute;right:10px;top:7px;font-size:10px;color:var(--red);border:1px solid rgba(168,67,47,.3);
  border-radius:6px;padding:1px 5px;background:rgba(168,67,47,.06)}
.card{background:var(--card);border:1px solid transparent;border-radius:var(--r-lg);padding:15px;
  margin-bottom:12px;box-shadow:var(--sh-md)}
.card.tappable{cursor:pointer;transition:transform .14s,box-shadow .22s}
.card.tappable:active{transform:scale(.982);box-shadow:var(--sh-lg)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0}
.row b{font-weight:600}
.row .chev{color:var(--ink4);display:flex}
.row .chev svg{width:16px;height:16px}
.lt{display:flex;align-items:center;gap:11px;min-width:0}
.lead{width:30px;height:30px;border-radius:9px;flex:0 0 auto;display:grid;place-items:center;
  background:rgba(30,74,55,.09);color:var(--green)}
.lead svg{width:17px;height:17px}
.lead.red{background:rgba(168,67,47,.09);color:var(--red)}
.lead.gold{background:rgba(190,155,87,.16);color:#8A6A2E}
.lead.gray{background:rgba(33,29,23,.07);color:var(--ink2)}
.card-title{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700}
.card-title svg{width:18px;height:18px}
.hr{height:1px;background:var(--line);margin:2px 0}
.bar-in{height:6px;border-radius:6px;background:rgba(30,74,55,.11);overflow:hidden;margin:8px 0 2px}
.bar-in i{display:block;height:100%;background:linear-gradient(90deg,var(--green3),var(--green));border-radius:6px;transition:width .5s}
.pill{font-size:11px;color:var(--green);background:rgba(30,74,55,.08);border-radius:20px;padding:3px 10px;font-weight:500}
.pill.red{color:var(--red);background:rgba(168,67,47,.08)}
.pill.gold{color:#7A5C24;background:rgba(190,155,87,.2)}
.btn{width:100%;border:0;border-radius:var(--r-md);padding:13px;background:var(--green);color:#F4EFE2;
  font-size:14px;font-weight:600;margin-top:9px;cursor:pointer;
  box-shadow:0 6px 16px rgba(30,74,55,.22);transition:background .15s,transform .1s;
  display:flex;align-items:center;justify-content:center;gap:6px}
.btn svg{width:16px;height:16px}
.btn:active{background:var(--green2);transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--green);border:1px solid rgba(30,74,55,.26);box-shadow:none}
.btn.ghost:active{background:rgba(30,74,55,.06)}
.btn.gold{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#3B2E12;box-shadow:0 6px 16px rgba(190,155,87,.25)}
.btn[disabled]{opacity:.5}
.btn.sm{padding:10px;font-size:12.5px}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:30;height:calc(var(--foot) + var(--safe-b));
  padding-bottom:var(--safe-b);display:flex;align-items:stretch;
  background:#F4F1E7;border-top:1px solid rgba(30,26,18,.05)}
.foot a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--ink3);text-decoration:none;font-size:10.5px;letter-spacing:.5px;position:relative;cursor:pointer;
  transition:color .15s,transform .1s;-webkit-user-select:none;user-select:none}
.foot a .g{display:flex;align-items:center;justify-content:center;transition:transform .12s}
.foot a .g svg{width:24px;height:24px}
.foot a:active .g{transform:scale(.88)}
.foot a.on{color:var(--green);font-weight:600}
.foot a.on .g{color:var(--green)}
.mask{position:fixed;inset:0;background:rgba(28,25,19,.44);backdrop-filter:blur(3px);
  z-index:60;display:none;opacity:0;pointer-events:none;transition:opacity .25s}
.mask.on{display:block;opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:70;max-height:92vh;display:flex;flex-direction:column;
  background:linear-gradient(180deg,#FAF7EF,var(--paper));border-radius:var(--r-xl) var(--r-xl) 0 0;
  transform:translateY(101%);transition:transform .32s cubic-bezier(.22,.9,.3,1);
  box-shadow:var(--sh-lg)}
.sheet.on{transform:translateY(0)}
.sheet .grab{width:40px;height:4px;border-radius:4px;background:rgba(33,29,23,.15);margin:9px auto 3px;flex:0 0 auto}
.sheet .hd{display:flex;align-items:center;gap:8px;padding:7px 16px 11px;flex:0 0 auto}
.sheet .hd b{font:700 17.5px/1.2 'Songti SC','STSong',serif;letter-spacing:.3px}
.sheet .hd .x{margin-left:auto;width:33px;height:33px;border-radius:50%;border:0;background:rgba(33,29,23,.06);
  color:var(--ink2);display:grid;place-items:center;cursor:pointer;transition:background .15s,transform .1s}
.sheet .hd .x svg{width:15px;height:15px}
.sheet .hd .x:active{background:rgba(33,29,23,.12);transform:scale(.92)}
.sheet .bd{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:2px 14px calc(20px + var(--safe-b))}
.wrap{display:flex;flex-direction:column;align-items:center;padding:2px 0 4px}
.pool{font-size:11.5px;color:var(--ink3);margin:2px 0 10px;text-align:center;line-height:1.6}
.stage2{position:relative;width:272px;height:272px;margin:2px auto}
.ring{position:absolute;inset:0;border-radius:50%;
  background:linear-gradient(145deg,#E8CE96,#C8A96A 45%,#B8933F);
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.35),0 6px 18px rgba(184,147,63,.22)}
.disc{position:absolute;inset:6.5%;border-radius:50%;overflow:hidden;background:#F8F3E4;
  transition:transform 2.4s cubic-bezier(.15,.9,.2,1)}
.labs{position:absolute;inset:0}
.li{position:absolute;inset:0}
.li i{position:absolute;left:50%;top:50%;font-style:normal;font-size:10px;letter-spacing:.2px;color:#4A4028;
  white-space:nowrap;transform:translate(-50%,-50%) rotate(var(--a)) translateY(-84px) rotate(calc(-1 * var(--a)))}
.pin{position:absolute;top:-4%;left:50%;margin-left:-8px;width:0;height:0;z-index:3;
  border-left:8px solid transparent;border-right:8px solid transparent;border-top:15px solid var(--red);
  filter:drop-shadow(0 2px 2px rgba(0,0,0,.18))}
.go-c{position:absolute;left:35%;top:35%;width:30%;aspect-ratio:1;border-radius:50%;border:0;
  background:radial-gradient(circle at 50% 35%,#2C5A44,#1F4A38);color:#F4EFE2;display:flex;flex-direction:column;
  align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.2),inset 0 0 0 2px rgba(255,255,255,.12)}
.go-c.off{background:radial-gradient(circle at 50% 35%,#7C7768,#5F5B50);box-shadow:0 3px 10px rgba(0,0,0,.15),inset 0 0 0 2px rgba(255,255,255,.10)}
.go-c.off b{opacity:.72}
.go-c b{font:700 18px/1.1 'Songti SC','STSong',serif}
.go-c i{font-style:normal;font-size:9px;opacity:.85;margin-top:2px}
.resslot{font-size:12.5px;color:var(--ink2);text-align:center;margin-top:11px;line-height:1.7;min-height:20px}
.resslot b{color:var(--red)}
.dots{display:flex;gap:5px;margin:9px 0 2px}
.dots .d{flex:1;height:32px;border-radius:9px;display:grid;place-items:center;font-size:10.5px;
  border:1px solid var(--line);color:var(--ink3);background:rgba(255,255,255,.5)}
.dots .d.on{background:linear-gradient(180deg,rgba(168,67,47,.14),rgba(168,67,47,.2));
  border-color:rgba(168,67,47,.3);color:var(--red);font-weight:600}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:11px;
  padding:11px 12px;margin-top:7px;background:rgba(255,255,255,.62);font-size:12.5px;color:var(--ink)}
.opt:active{background:rgba(0,0,0,.04)}
input,textarea{width:100%;border:1px solid rgba(0,0,0,.14);border-radius:10px;padding:11px;font-size:13px;
  outline:none;background:#fff;color:var(--ink);font-family:inherit}
input:focus{border-color:rgba(31,74,56,.4)}
.hint{font-size:11.5px;color:var(--ink3);line-height:1.7;margin-top:8px}
.toast{position:fixed;left:50%;bottom:calc(var(--foot) + 26px);transform:translateX(-50%) translateY(8px);
  background:rgba(38,34,26,.94);color:#F4EFE2;font-size:12.5px;padding:9px 15px;border-radius:11px;
  max-width:78vw;text-align:center;opacity:0;transition:.22s;z-index:90;pointer-events:none;line-height:1.5}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.veil{position:absolute;inset:0;z-index:5;display:none;place-items:center;
  background:linear-gradient(180deg,#EFEADB,#F7F4EA 65%)}
.veil.on{display:grid}
.veil .box{text-align:center;width:78%;max-width:300px}
.veil .cover{width:96px;height:126px;border-radius:8px;margin:0 auto 16px;display:grid;place-items:center;
  color:#F6F1E3;font:700 26px/1 'Songti SC','STSong',serif;
  box-shadow:inset -12px 0 18px -12px rgba(0,0,0,.5),0 10px 24px rgba(0,0,0,.16)}
.veil .tt2{font:700 17px/1.3 'Songti SC','STSong',serif;margin-bottom:4px}
.veil .ss{font-size:11.5px;color:var(--ink3);margin-bottom:14px}
.veil .pb{height:5px;border-radius:5px;background:rgba(31,74,56,.14);overflow:hidden}
.veil .pb i{display:block;height:100%;width:6%;background:linear-gradient(90deg,var(--green2),var(--green));transition:width .35s}
.veil .pp{font-size:10.5px;color:var(--ink3);margin-top:8px;font-variant-numeric:tabular-nums}
.veil .fail{display:none}
.veil.failed .loadbox{display:none}
.veil.failed .fail{display:block}
.veil .fico{width:54px;height:54px;border-radius:50%;margin:0 auto 14px;display:grid;place-items:center;
  font-size:24px;background:rgba(168,67,47,.1);color:var(--red);border:1px solid rgba(168,67,47,.25)}
.veil .ftt{font:700 16px/1.3 'Songti SC','STSong',serif;margin-bottom:5px}
.veil .fss{font-size:11.5px;color:var(--ink3);line-height:1.6;margin-bottom:15px}
.retry-btn{border:0;border-radius:11px;padding:10px 22px;background:var(--green);color:#F4EFE2;
  font-size:13px;font-weight:600}
.retry-btn:active{background:var(--green2)}
@media (min-width:700px){ :root{--maxw:700px} .stage2{width:300px;height:300px} }

/* ========== 全屏账号页（原生 App 风格，去网页感） ========== */
.auth{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;visibility:hidden;
  background:linear-gradient(180deg,#F8F4EB 0%,#F1EBDC 55%,#EDE6D5 100%);
  padding:calc(var(--safe-t) + 10px) 20px calc(var(--safe-b) + 14px);
  transform:translateY(100%);transition:transform .4s cubic-bezier(.22,.9,.3,1),visibility 0s linear .4s}
.auth.on{transform:translateY(0);visibility:visible;transition:transform .4s cubic-bezier(.22,.9,.3,1),visibility 0s}
.auth .a-scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column}
.auth .a-close{width:34px;height:34px;border-radius:50%;border:0;background:rgba(33,29,23,.07);
  color:var(--ink2);display:grid;place-items:center;cursor:pointer;align-self:flex-start;transition:transform .1s}
.auth .a-close:active{transform:scale(.9)}
.auth .a-close svg{width:16px;height:16px}
.auth .a-brand{display:flex;flex-direction:column;align-items:center;text-align:center;margin:26px 0 24px}
.auth .a-logo{width:74px;height:74px;border-radius:20px;display:grid;place-items:center;
  background:linear-gradient(150deg,#27563F,#16382A);color:#F4EFE2;
  font:700 34px/1 'Songti SC','STSong',serif;
  box-shadow:0 12px 28px rgba(24,60,44,.32),inset 0 1px 0 rgba(255,255,255,.18)}
.auth .a-name{font:700 23px/1.2 'Songti SC','STSong',serif;letter-spacing:.5px;margin-top:16px}
.auth .a-slogan{font-size:12px;color:var(--ink3);margin-top:7px;letter-spacing:.4px}
.auth .a-seg{display:flex;background:rgba(33,29,23,.07);border-radius:12px;padding:3px;margin-bottom:18px}
.auth .a-seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:9px 0;
  font-size:13px;font-weight:600;color:var(--ink3);cursor:pointer;transition:all .2s}
.auth .a-seg button.on{background:#fff;color:var(--green);box-shadow:0 2px 7px rgba(28,24,16,.1)}
.auth .a-group{background:#fff;border-radius:15px;overflow:hidden;box-shadow:var(--sh-sm);margin-bottom:14px}
.auth .a-group .field{display:flex;align-items:center;padding:13px 15px;gap:11px}
.auth .a-group .field+.field{border-top:1px solid var(--line)}
.auth .a-group .field label{flex:0 0 52px;font-size:12.5px;color:var(--ink3);font-weight:600}
.auth .a-group .field input{border:0;border-radius:0;padding:0;background:transparent;font-size:14px;flex:1;min-width:0}
.auth .a-group .field input:focus{border:0}
.auth .a-group .field .code-btn{flex:0 0 auto;border:0;background:transparent;color:var(--green);
  font-size:12.5px;font-weight:600;cursor:pointer;padding-left:10px;border-left:1px solid var(--line)}
.auth .a-group .field .code-btn[disabled]{color:var(--ink4);cursor:default}
.auth .a-primary{width:100%;border:0;border-radius:14px;padding:15px;background:var(--green);color:#F4EFE2;
  font-size:15px;font-weight:700;cursor:pointer;letter-spacing:.5px;
  box-shadow:0 10px 22px rgba(28,66,49,.28);transition:transform .1s,background .15s}
.auth .a-primary:active{transform:scale(.98);background:var(--green2)}
.auth .a-primary[disabled]{opacity:.55;box-shadow:none}
.auth .a-alt{display:flex;gap:10px;margin-top:11px}
.auth .a-alt button{flex:1;border:1px solid rgba(30,74,55,.24);border-radius:13px;padding:12px 0;
  background:transparent;color:var(--green);font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
.auth .a-alt button:active{background:rgba(30,74,55,.06)}
.auth .a-foot{font-size:11px;color:var(--ink3);line-height:1.7;text-align:center;margin-top:18px;padding-bottom:6px}
.auth .a-foot b{color:var(--ink2)}
.auth .a-err{display:none;background:rgba(168,67,47,.1);border:1px solid rgba(168,67,47,.25);
  color:var(--red);border-radius:12px;padding:10px 13px;font-size:12px;line-height:1.6;margin-bottom:12px}
.auth .a-err.on{display:block}
/* ============ 冷启动屏（品牌动画） ============ */
#splash{transition:opacity .5s ease,visibility .5s ease}
#splash.hide{opacity:0;visibility:hidden;pointer-events:none}
#splash .sp-logo{box-shadow:0 18px 38px -16px rgba(20,52,38,.55),inset 0 0 0 2px rgba(244,239,226,.18);
  animation:spLogo .6s cubic-bezier(.2,.7,.3,1) both}
#splash .sp-name{animation:spFade .5s ease both;animation-delay:.12s}
#splash .sp-slogan{animation:spFade .5s ease both;animation-delay:.2s}
#splash .sp-bar{animation:spFade .5s ease both;animation-delay:.26s}
#splash .sp-msg{animation:spFade .5s ease both;animation-delay:.3s}
@keyframes spLogo{from{opacity:0;transform:scale(.7) rotate(-4deg)}to{opacity:1;transform:none}}
@keyframes spFade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  #splash .sp-logo,#splash .sp-name,#splash .sp-slogan,#splash .sp-bar,#splash .sp-msg{animation:none}
}

/* ============ 版本更新提示条 ============ */
.verbar{position:fixed;left:12px;right:12px;bottom:calc(14px + var(--safe-b));z-index:9990;
  display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:15px;
  background:linear-gradient(180deg,#234f3c,#1A4030);color:#F2EDE0;
  box-shadow:0 14px 34px -12px rgba(15,40,29,.6),inset 0 1px 0 rgba(255,255,255,.12);
  transform:translateY(160%);transition:transform .38s cubic-bezier(.22,.9,.3,1)}
.verbar.show{transform:translateY(0)}
.verbar .vb-txt{flex:1;font-size:12.5px;line-height:1.45;min-width:0}
.verbar .vb-act{flex:0 0 auto;border:0;border-radius:10px;padding:8px 15px;background:#F2EDE0;
  color:#1A4030;font-size:13px;font-weight:700;cursor:pointer}
.verbar .vb-act:active{transform:scale(.95)}
.verbar .vb-x{flex:0 0 auto;border:0;background:transparent;color:rgba(242,237,224,.66);
  font-size:18px;line-height:1;padding:4px;cursor:pointer}

/* ============ 更新遮罩（清缓存重启） ============ */
.upd-mask{position:fixed;inset:0;z-index:99998;background:rgba(244,241,231,.98);
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;
  text-align:center;padding:28px}
.upd-mask .u-spin{width:42px;height:42px;border-radius:50%;border:3px solid #D8D2C4;
  border-top-color:#1C4735;animation:uSpin .9s linear infinite}
@keyframes uSpin{to{transform:rotate(360deg)}}
.upd-mask .u-txt{max-width:300px;font-size:14px;line-height:1.6;color:#1E1A14}
.upd-mask .u-note{font-size:11.5px;color:#7A7365}

/* ============ 版本记录 ============ */
.clog{padding:13px 0;border-bottom:1px solid var(--line)}
.clog:last-child{border-bottom:0}
.clog-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:7px}
.clog-h .v{font-weight:700;font-size:13.5px;color:var(--green);font-variant-numeric:tabular-nums}
.clog-h .d{font-size:11px;color:var(--ink3)}
.clog-h .kind{font-size:10px;padding:2px 7px;border-radius:6px;background:rgba(28,71,53,.09);color:var(--green)}
.clog-h .now{font-size:10px;padding:2px 7px;border-radius:6px;background:var(--green);color:#F4EFE2}
.clog-t{font-size:12.5px;font-weight:600;line-height:1.5;margin-bottom:6px}
.clog ul{margin:0;padding-left:16px}
.clog li{font-size:12px;line-height:1.65;color:var(--ink2);margin-bottom:3px}
.clog-more{width:100%;margin-top:6px;border:0;background:transparent;color:var(--green);
  font-size:11.5px;cursor:pointer;padding:6px}

var FR={}, seq=0, veilTimers={iv:0,to:0};
function tabsOf(id){return (FR[id]&&FR[id].tabs)||(book(id)&&book(id).tabs)||[]}
function isTabAllowed(id,t){return tabsOf(id).some(function(x){return x.id===t})}
function ensure(id){
  if(FR[id]) return FR[id];
  var b=book(id); if(!b) return null;
  var el=document.createElement('iframe');
  el.className='fr off'; el.title=b.name; el.setAttribute('loading','eager'); el.src=b.url;
  $('reader').appendChild(el);
  var rec={el:el,ready:false,tabs:b.tabs.slice(),loadAt:0,use:++seq,tab:'',pendingTab:'',failed:false,loadTimer:0};
  FR[id]=rec;
  el.addEventListener('load',function(){
    rec.loadAt=Date.now();
    /* 真正加载成功的包会在 load 后 300~420ms 发 ready；
       只触发 load、超时未发 ready（如中断/错误页）→ 判定失败 */
    if(rec.loadTimer) clearTimeout(rec.loadTimer);
    rec.loadTimer=setTimeout(function(){ if(!rec.ready) failVeil(id); },2000);
  });

}

/* ---------- 路由（顶层 hash 为唯一事实来源）----------
   线上壳经 CDN 302 会丢失 query，fragment 则会保留，故路由走 hash：
   #book=<id>&tab=<t> 科目；#view=study 学习页；空 hash 书库。
   顶层 hash 与 iframe 内部各自的 hash 完全独立，互不影响。 */
var S={};
function readRoute(){
  var p=new URLSearchParams((location.hash||'').replace(/^#/,''));
  var b=p.get('book');
  if(b&&book(b)) return {kind:'book',book:b,tab:p.get('tab')||''};
  if(p.get('view')==='study') return {kind:'study'};
  return {kind:'lib'};
}
/* 纯业务：进入科目（幂等，不修改 hash） */
function enterBook(id,tab){
  var b=book(id);
  if(!b){ ST.view='lib'; render(); return; }
  if(b.soon){ toast(b.name+' 还在筹备，先看看别的'); return; }
  var rec=ensure(id);
  ST.view='book'; ST.book=id; ST.lastBook=id;
  if(tab&&isTabAllowed(id,tab)){
    ST.tab=tab; ST.lastTab=tab;
    if(rec.ready) send(id,{t:'tab',id:tab});
    else rec.pendingTab=tab;
  }
  save();
  if(!rec.ready) showVeil(id);
  showFrame(id);
  render();
  sendTheme();
  setTimeout(function(){ sendTheme(); },900);
}
S.open=function(id,tab){ location.hash='#book='+id+(tab?('&tab='+tab):''); };
S.openBookById=function(id){ location.hash='#book='+id; };
S.nav=function(v){
  if(v==='lib'){ location.hash=''; return; }
  if(v==='study'){ location.hash='#view=study'; return; }
  if(v==='me'){ openSheet('me'); return; }
  if(ST.view==='book'&&ST.book){
    if(!isTabAllowed(ST.book,v)) return;
    location.hash='#book='+ST.book+'&tab='+v;
    return;
  }
};
S.backToLib=function(){ closeSheet(); location.hash=''; };
function applyRoute(){
  var r=readRoute();
  closeSheet();
  if(r.kind==='book'){ enterBook(r.book,r.tab); }
  else { ST.view=r.kind; ST.book=''; ST.tab=''; save(); render(); }
}
window.addEventListener('hashchange',applyRoute);
S.retryBook=function(){
  var id=ST.book; if(!id) return;
  var old=FR[id];
  if(old){ try{ old.el.parentNode.removeChild(old.el); }catch(e){} delete FR[id]; }
  hideVeil();
  applyRoute();  /* hash 不变，enterBook 会重建该科目 */
};

/* ---------- 与科目通信 ---------- */
window.addEventListener('message',function(e){
  if(!e||typeof e.data!=='object'||e.data===null) return;
  var d=e.data; if(d.src!=='pack') return;
  var id=null;
  Object.keys(FR).forEach(function(k){ if(FR[k].el.contentWindow===e.source) id=k; });
  if(!id) return;
  var rec=FR[id];
  if(d.t==='ready'){
    if(Array.isArray(d.tabs)&&d.tabs.length) rec.tabs=d.tabs;
    rec.ready=true; rec.use=++seq; rec.failed=false;
    if(rec.loadTimer) clearTimeout(rec.loadTimer);
    hideVeil();
    var days=vipRemaining();
    send(id,{t:'theme',fz:ST.theme.fz,night:ST.theme.night,vip:days,days:days});
    send(id,{t:'auth',session:AUTH||null});
    if(authOk()) send(id,{t:'cloudPull'});
    if(ST.book===id) paintFoot();
    flushPending(id);
  }
  else if(d.t==='stat'){
    rec.ready=true;
    if(Number.isFinite(d.pct)) ST[id+'Pct']=Math.max(0,Math.min(100,Math.round(d.pct)));
    if(d.items&&typeof d.items==='object'&&!Array.isArray(d.items)) ST.stats[id]=d.items;
    save();
    if(ST.view==='study') render();
  }
  else if(d.t==='askMe'){ openSheet('me'); }
  else if(d.t==='open'){
    var allowed={lottery:1,invite:1,redeem:1,chat:1,ver:1,faq:1,dev:1,me:1,theme:1};
    if(allowed[d.kind]) openSheet(d.kind);
  }
  else if(d.t==='back'){ S.backToLib(); }
  else if(d.t==='tab'){
    if(typeof d.id==='string'&&isTabAllowed(id,d.id)){
      ST.tab=d.id; ST.lastTab=d.id; save(); paintFoot();
      /* 包内回灌属"状态同步"，用 replaceState 修正当前条目，不新增历史 */
      if(ST.book===id){
        var want='#book='+id+'&tab='+d.id;
        if(location.hash!==want){ try{ history.replaceState(null,'',want); }catch(e){} }
      }
    }
  }
  else if(d.t==='toast'){ if(typeof d.msg==='string') toast(d.msg); }
  /* 科目包请求统一认证能力 */
  else if(d.t==='askAuth'){
    if(authOk()){ ensureToken(false).then(function(){ send(id,{t:'auth',session:AUTH}); }); }
    else Auth.open();
  }
  else if(d.t==='askLogin'){ Auth.open(); }
  else if(d.t==='refreshAuth'){
    ensureToken(true).then(function(){ send(id,{t:'auth',session:AUTH}); });
  }
});
function sendTheme(){
  var days=vipRemaining(); ST.vip=days;
  Object.keys(FR).forEach(function(k){ send(k,{t:'theme',fz:ST.theme.fz,night:ST.theme.night,vip:days,days:days}); });
}

/* ---------- 启动屏控制：进度条推进，保证品牌动画最短展示后再淡出，不白屏、不卡顿 ---------- */
(function(){
  var sp=$('splash'),fill=$('spFill'),msg=$('spMsg'),p=0,t0=Date.now();
  var steps=['正在打开…','加载书库…','准备科目…','马上就好…'];
  var iv=setInterval(function(){
    p=Math.min(94,p+Math.max(2,(94-p)/6));
    fill.style.width=p+'%';
    msg.textContent=steps[Math.min(steps.length-1,Math.floor(p/25))];
  },120);
  function finish(){
    clearInterval(iv); fill.style.width='100%'; msg.textContent='开始学习';
    setTimeout(function(){ sp.classList.add('hide'); },180);
  }
  function tryFinish(){ if(Date.now()-t0>=1100) finish(); else setTimeout(tryFinish,80); }
  if(document.readyState==='complete') tryFinish();
  else window.addEventListener('load',tryFinish);
  setTimeout(finish,3000);  /* 兜底：load 事件没来也收起，不卡住用户 */
})();

/* ================= 统一认证（壳层是唯一认证入口） ================= */
var AUTH_SKEY='yidiantong.shell.auth.v1';
var AUTH=null;
function loadAuth(){ try{ AUTH=JSON.parse(localStorage.getItem(AUTH_SKEY)||'null'); }catch(e){ AUTH=null; } return AUTH; }
function saveAuth(){ try{ if(AUTH&&AUTH.access_token) localStorage.setItem(AUTH_SKEY,JSON.stringify(AUTH)); else localStorage.removeItem(AUTH_SKEY); }catch(e){} }
function authOk(){ return !!(AUTH&&AUTH.access_token&&AUTH.uid); }
function onSessionLost(){
  AUTH=null; saveAuth(); broadcastAuth();
  toast('登录已过期：重新登录一次，进度都在云端');
}
function adoptSession(j){
  if(!j||!j.access_token||!j.user) return null;
  AUTH={access_token:j.access_token,refresh_token:j.refresh_token,uid:j.user.id,
    email:j.user.email||'',expires_at:Date.now()+((j.expires_in||3600)*1000)};
  saveAuth(); return AUTH;
}
function sbReq(path,opt){
  opt=opt||{};
  var h={'apikey':SB_ANON,'Content-Type':'application/json'};
  if(opt.token) h['Authorization']='Bearer '+opt.token;
  else if(authOk()) h['Authorization']='Bearer '+AUTH.access_token;
  if(opt.prefer) h['Prefer']=opt.prefer;
  return new Promise(function(resolve,reject){
    var ctl=new AbortController(), done=false;
    var to=setTimeout(function(){ try{ctl.abort();}catch(e){} },opt.timeout||20000);
    fetch(SB_URL+path,{method:opt.method||'GET',headers:h,
      body:opt.body?JSON.stringify(opt.body):undefined,signal:ctl.signal})
    .then(function(r){
      return r.text().then(function(txt){
        var j=null; try{ j=txt?JSON.parse(txt):null; }catch(e){ j=txt; }
        if(!r.ok){
          if(r.status===401&&!opt.__retry&&!/\/auth\/v1\/(token|verify|recover|resend|signup)/.test(path)){
            return ensureToken(true).then(function(ok){ if(ok) return sbReq(path,Object.assign({},opt,{__retry:true})); throw new Error('登录已过期，请重新登录'); });
          }
          var msg=(j&&(j.msg||j.message||j.error_description))||('HTTP '+r.status);
          var err=new Error(msg); err.status=r.status; err.data=j; throw err;
        }
        return j;
      });
    }).then(function(v){ done=true; clearTimeout(to); resolve(v); })
    .catch(function(e){ clearTimeout(to); reject(e); });
  });
}
var _refreshing=null;
function ensureToken(force){
  if(!authOk()) return Promise.resolve(false);
  if(!force && Date.now()<(AUTH.expires_at||0)-60000) return Promise.resolve(true);
  if(!AUTH.refresh_token){ onSessionLost(); return Promise.resolve(false); }
  if(_refreshing) return _refreshing;
  _refreshing=(function(){
    return sbReq('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:{refresh_token:AUTH.refresh_token}})
      .then(function(j){ adoptSession(j); broadcastAuth(); return true; })
      .catch(function(){ onSessionLost(); return false; })
      .then(function(v){ _refreshing=null; return v; });
  })();
  return _refreshing;
}
/* 把当前会话下发到所有已加载的科目包；登出时下发 null */

      $('authPrimary').onclick=function(){ self.otpGo(); };
      $('authAlt').innerHTML='<button onclick="Auth.setMode(\'pwd\')">改用密码登录</button>';
    }
  },
  setBusy:function(b){
    this.busy=b; $('authPrimary')[b?'setAttribute':'removeAttribute']('disabled',b);
  },
  pwdGo:function(kind){
    var mail=($('aMail').value||'').trim(), pwd=$('aPwd').value||'';
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(mail)){ this.err('邮箱格式不对，检查一下'); return; }
    if(kind==='register' && pwd.length<6){ this.err('密码至少 6 位'); return; }
    if(kind==='login' && !pwd){ this.err('请输入密码'); return; }
    var self=this; self.setBusy(true); self.err('');
    var path;
    if(kind==='register'){
      sbReq('/auth/v1/signup',{method:'POST',body:{email:mail,password:pwd}})
        .then(function(j){
          if(j&&j.access_token){ adoptSession(j); return afterShellLogin().then(function(){ return true; }); }
          self.err('注册请求已发出，若开启了邮箱确认，请点邮件链接后再登录'); return false;
        })
        .then(function(ok){ if(ok){ self.setBusy(false); self.close(); toast('注册完成，已登录'); } })
        .catch(function(e){ self.err(e.message||'注册失败'); })
        .then(function(){ self.setBusy(false); });
    }else{
      sbReq('/auth/v1/token?grant_type=password',{method:'POST',body:{email:mail,password:pwd}})
        .then(function(j){ adoptSession(j); return afterShellLogin(); })
        .then(function(){ self.setBusy(false); self.close(); toast('登录成功，三科进度已接通'); })
        .catch(function(e){ self.err(e.message||'登录失败'); })
        .then(function(){ self.setBusy(false); });
    }
  },
  sendOtp:function(){
    var mail=($('aMail').value||'').trim();
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(mail)){ this.err('先填正确邮箱再发验证码'); return; }
    var self=this;
    sbReq('/auth/v1/otp',{method:'POST',body:{email:mail,create_user:true}})
      .then(function(){
        self.tickOtp(60); toast('验证码已发送，查收邮件');
      })
      .catch(function(e){ self.err(e.message||'验证码发送失败'); });
  },
  tickOtp:function(s){
    var self=this, btn=$('codeBtn');
    clearInterval(this._otpTimer); this.otpLeft=s;
    if(btn){ btn.disabled=true; btn.textContent=s+'s 后重发'; }
    this._otpTimer=setInterval(function(){
      self.otpLeft--;
      if(self.otpLeft<=0){ clearInterval(self._otpTimer); if(btn){btn.disabled=false;btn.textContent='发送验证码';} return; }
      if(btn) btn.textContent=self.otpLeft+'s 后重发';

      .then(function(){ self.setBusy(false); self.close(); toast('登录成功，三科进度已接通'); })

      .then(function(){ self.setBusy(false); });

    '<div style="font-size:11.5px;color:#D3CAB2;line-height:1.6">'+rw+(closed?'<br>邀请活动当前已关闭':'')+'</div>'+
    '<button class="btn gold sm" style="margin-bottom:0" onclick="S.copyInvite()">'+ic('copy')+'复制邀请链接</button></div>'+
    '<div class="card"><div class="row"><span class="lt"><span class="lead gray">'+ic('user')+'</span>已邀请</span><b>'+ST.invite+' 人</b></div><div class="hr"></div>'+
    '<div class="row"><span class="lt"><span class="lead gold">'+ic('trophy')+'</span>攒着的抽奖次数</span><b>'+ST.pInvite+' 次</b></div></div>'+
    '<div class="hint" style="text-align:center">邀请奖励实时到账，长期有效、不清零。</div>';
}
S.copyInvite=function(){
  /* 用 hash 携带邀请码：线上 CDN 302 会丢 query，fragment 则保留 */
  var link=location.origin+location.pathname+'#ref='+ST.invCode;
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(link); toast('邀请链接已复制'); }
    else toast('链接：'+link);
  }catch(e){ toast('链接：'+link); }
};

/* ---------- 卡密 ---------- */
S.redeem=function(){
  var v=(($('cdk')||{}).value||'').trim();
  if(v.length<6){ toast('卡密格式不正确，请重新输入'); return; }
  var m=v.match(/(?:FZ|YD)-(\d{1,2})/);
  var days=m?(parseInt(m[1],10)||30):30;
  addVip(days);
  save(); closeSheet(); toast('兑换成功 · 会员 +'+days+' 天'); openSheet('me'); sendTheme();
};

/* ---------- 客服 ---------- */
S.sendMsg=function(){
  var i=$('cin'), v=(i&&i.value||'').trim(); if(!v) return;
  i.value='';
  ST.chat.push({me:true,t:v}); save(); openSheet('chat');
  setTimeout(function(){
    ST.chat.push({t:'收到，你的问题我已记录，客服人员会尽快回复你。'}); save();
    if(sheetKind==='chat') openSheet('chat');
  },780);
};

/* ---------- 主题 ---------- */
S.setTheme=function(k,v){
  ST.theme[k]=v; save(); sendTheme(); openSheet('theme');
  toast(k==='fz'?('字号已设为 '+v+'%'):(v?'已切到夜间':'已切回日间'));
};

/* ---------- 版本生命周期（VER_LS 已在 IIFE 顶部定义）---------- */
S.showVer=function(){ openSheet('ver'); };
function getVerKV(k,d){ try{ var v=localStorage.getItem(VER_LS+'.'+k); return v==null?d:v; }catch(e){ return d; } }
function setVerKV(k,v){ try{ localStorage.setItem(VER_LS+'.'+k,v); }catch(e){} }

function cmpVer(a,b){
  var x=String(a).split('.').map(Number), y=String(b).split('.').map(Number);
  var n=Math.max(x.length,y.length);
  for(var i=0;i<n;i++){ var A=x[i]||0,B=y[i]||0; if(A!==B) return A>B?1:-1; }
  return 0;
}
/* 底部更新提示条 */
function verBar(msg,btnTxt,onAct,sticky,verTag,altTxt){
  var el=document.getElementById('verbar');
  if(!el){ el=document.createElement('div'); el.id='verbar'; el.className='verbar'; document.body.appendChild(el); }
  el.innerHTML='<span class="vb-txt"></span><button class="vb-act"></button><button class="vb-x"></button>';
  el.querySelector('.vb-txt').textContent=msg;
  el.dataset.ver=verTag||'';
  var b=el.querySelector('.vb-act'); b.textContent=btnTxt; b.onclick=onAct;
  var xb=el.querySelector('.vb-x'); xb.textContent=altTxt||'×';
  xb.onclick=function(){ el.classList.remove('show'); if(el.dataset.ver){ setVerKV('dv',el.dataset.ver); } };
  el.classList.add('show');
  clearTimeout(el._t);
  if(!sticky) el._t=setTimeout(function(){el.classList.remove('show');},9000);
}
/* 更新遮罩 */
function updOverlay(txt){
  var d=document.getElementById('updMask');
  if(!d){
    d=document.createElement('div'); d.id='updMask'; d.className='upd-mask';
    d.innerHTML='<div class="u-spin"></div><div class="u-txt"></div><div class="u-note">清理缓存后会自动重开，不用手动刷新</div>';
    document.body.appendChild(d);
  }
  d.querySelector('.u-txt').textContent=txt||'正在更新…';
}
/* 硬跳：清掉地址上的旧 query，带新版本戳强制走网络 */
function hardReload(){
  var path='/';
  try{ path=new URL(document.baseURI||location.href).pathname||'/'; }catch(e){ path=location.pathname||'/'; }
  try{ location.replace(path+'?v='+Date.now()); }catch(e){ location.reload(); }
}
/* 清缓存硬重置：注销全部离线服务、删除全部缓存条目后硬跳 */
window.__hardReset=function(){
  updOverlay('正在更新：清理缓存…');
  try{ if(navigator.serviceWorker) navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(x){x.unregister();});}); }catch(e){}
  try{ if(window.caches) caches.keys().then(function(ks){ks.forEach(function(k){caches.delete(k);});}); }catch(e){}
  setTimeout(hardReload,650);
};
/* 常规更新：清缓存 + 自动重启，记录尝试次数用于"更新没生效"兜底 */
function refreshApp(){
  updOverlay('正在更新：清理缓存…');
  setVerKV('try',String((parseInt(getVerKV('try','0'),10)||0)+1));
  try{ if(navigator.serviceWorker) navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(x){x.unregister();});}); }catch(e){}
  try{ if(window.caches) caches.keys().then(function(ks){ks.forEach(function(k){caches.delete(k);});}); }catch(e){}
  setTimeout(hardReload,650);
}
function checkRemote(manual){
  return fetch('version.json?t='+Date.now(),{cache:'no-store'})
   .then(function(r){ return r.ok?r.json():null; })
   .then(function(j){
      if(!j||!j.version) throw new Error('no');
      if(cmpVer(j.version,APP_VER)>0){
        var tag=j.version;
        var tries=parseInt(getVerKV('try','0'),10)||0;
        if(tries>=2){
          if(!manual) return;
          verBar('更新好像没生效（还在 v'+APP_VER+'）','清缓存重启',window.__hardReset,true);
          return;
        }
        if(!manual && getVerKV('dv','')===tag) return;
        verBar('新版本 v'+j.version+' 已发布，现在更新吗？','立即更新',refreshApp,true,tag,'稍后');
      }else{
        setVerKV('try','0');
        if(manual) toast('已是最新版本 v'+APP_VER);
      }
   })
   .catch(function(){ if(manual) toast('检查不到更新信息（离线时正常）'); });
}
S.checkVer=function(manual){ checkRemote(!!manual); };
window.clogMore=function(btn){
  var ul=btn.parentNode.querySelector('ul');
  var lis=ul.querySelectorAll('li');
  var expand=btn.textContent.indexOf('展开')===0;
  for(var i=0;i<lis.length;i++){ lis[i].style.display=expand?'list-item':'none'; }
  btn.textContent=expand?'收起':'展开全部 '+lis.length+' 项';
};
/* 启动版本核对：版本升级后提示"已更新"，并在启动/回前台时检测新版本 */
function bootVer(){
  var last=getVerKV('run',null);
  setVerKV('run',APP_VER);
  if(last && cmpVer(APP_VER,last)>0){
    setVerKV('try','0');
    verBar('已更新至 v'+APP_VER,'查看版本',function(){
      openSheet('ver'); var vb=document.getElementById('verbar'); if(vb) vb.classList.remove('show');
    },false);
  }
  window.__chkAt=Date.now();
  setTimeout(function(){ checkRemote(false); },1600);
  function onForeground(){
    if(document.visibilityState!=='visible') return;
    if(Date.now()-(window.__chkAt||0)<30000) return;
    window.__chkAt=Date.now();
    checkRemote(false);
  }
  document.addEventListener('visibilitychange',onForeground);
  window.addEventListener('pageshow',function(e){ if(e.persisted) onForeground(); });
  setInterval(onForeground,600000);
}
window.__bootVer=bootVer;

window.S=S;
window.Auth=Auth;
window.__ST=ST; window.__FR=FR;
window.__PRIZES=function(){return PRIZES;};
fetchRemoteConfig();
})();

</script>
