name: probe
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: network diag
        run: |
          M=probe-marker.txt
          echo "=== CDN diag $(date -u) ===" > $M
          echo "--- DNS ---" >> $M
          getent hosts aka.doubaocdn.com >> $M 2>&1 || echo "DNS fail aka" >> $M
          getent hosts p3-flow-sign.byteimg.com >> $M 2>&1 || echo "DNS fail byteimg" >> $M
          echo "--- 短链重定向（不跟随）---" >> $M
          curl -sS -o /dev/null -w 'short http:%{http_code} redirect:%{redirect_url}\n' 'https://aka.doubaocdn.com/s/kk8hf2nljj' >> $M 2>&1 || echo "short curl fail" >> $M
          echo "--- 各资源完整拉取 ---" >> $M
          test_url(){
            name="$1"; url="$2"
            echo "[$name]" >> $M
            curl -sSL --connect-timeout 20 --max-time 120 -o /tmp/f.bin -w 'http:%{http_code} size:%{size_download} total:%{time_total}s start:%{time_starttransfer}s speed:%{speed_download}\n' "$url" >> $M 2>&1 || echo "FAIL $name" >> $M
            head -c 80 /tmp/f.bin | tr '\n' ' ' >> $M 2>&1; echo "" >> $M
          }
          test_url fz 'https://aka.doubaocdn.com/s/kk8hf2nljj'
          test_url shell 'https://aka.doubaocdn.com/s/tk8sUqe4vw'
          test_url zz 'https://aka.doubaocdn.com/s/QVBGvNu9yZ'
          cat $M
      - name: push marker
        run: |
          git config user.name probe
          git config user.email probe@users.noreply.github.com
          git add probe-marker.txt
          git commit -m "probe cdn diag" || echo nothing
          for i in 1 2 3; do git pull --rebase origin main && break; git rebase --abort 2>/dev/null; sleep 2; done
          git push origin main || true
