# 法硕一点通 · 单 job 部署（声明 pages 环境，壳为关键文件，静态资源超时回退仓库已有）
# pages 发布链已改用 upload-pages-artifact@v4（v3 产出的 artifact 名不再被 deploy-pages 接受）
name: deploy-site

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-final
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 拉取线上壳
        run: |
          mkdir -p admin icons
          for n in 1 2 3; do
            if curl -fsSL --retry 2 --retry-all-errors --connect-timeout 25 --max-time 240 -o /tmp/shell.html 'https://aka.doubaocdn.com/s/7pG3X8N0cJ'; then
              echo "shell ok $(wc -c < /tmp/shell.html) bytes"; break
            fi
            echo "retry $n"; sleep 5
          done
          test -s /tmp/shell.html
          grep -q "APP_VER='1.0.1.4'" /tmp/shell.html
          grep -q "rUsaYjaSBm" /tmp/shell.html
          cp /tmp/shell.html index.html
          cp /tmp/shell.html shell.html
          echo "壳校验通过"
      - name: 更新静态资源（失败保留仓库已有）
        run: |
          opt(){ curl -fsSL --connect-timeout 15 --max-time 45 -o "$1" "$2" || echo "warn: 沿用已有 $1"; }
          opt admin/index.html 'https://aka.doubaocdn.com/s/qvyFgF0eX9'
          opt manifest.webmanifest 'https://aka.doubaocdn.com/s/NKmuOL9mNo'
          opt icons/favicon-32.png 'https://aka.doubaocdn.com/s/JD02EZUAcd'
          opt icons/icon-192.png 'https://aka.doubaocdn.com/s/rPo7MC9MBj'
          opt icons/icon-512.png 'https://aka.doubaocdn.com/s/7EAfdyV0Ry'
          opt icons/maskable-192.png 'https://aka.doubaocdn.com/s/rf4gk8IZqR'
          opt icons/maskable-512.png 'https://aka.doubaocdn.com/s/9I6hfYvH66'
          opt icons/apple-touch-icon.png 'https://aka.doubaocdn.com/s/LawVTiqTXT'
          opt icons/apple-splash.png 'https://aka.doubaocdn.com/s/5zPRkVtKaH'
          ls -l index.html admin icons | head -15
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: 回读
        if: always()
        run: |
          sleep 6
          curl -s -o /dev/null -w 'site HTTP:%{http_code}\n' "https://kkdlm.github.io/yidiantong/?cb=$RANDOM" || true
