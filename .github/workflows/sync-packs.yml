name: ping

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-packs.yml'

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: 诊断 CDN 连通性
        run: |
          echo '=== DNS ==='
          getent hosts aka.doubaocdn.com || echo 'DNS解析失败'
          echo '=== HEAD 小文件 ==='
          curl -sSIL --connect-timeout 15 --max-time 40 'https://aka.doubaocdn.com/s/VLUm5MzBbM' | head -20 || echo 'curl失败'
