# 法硕一点通 · 单 job 部署（声明 pages 环境，壳为关键文件，静态资源超时回退仓库已有）
name: deploy-site

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-final
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 拉取线上壳
        run: |
          for n in 1 2 3; do
            if curl -fsSL --retry 2 --retry-all-errors --connect-timeout 25 --max-time 240 -o /tmp/shell.html 'https://aka.doubaocdn.com/s/aJVFa5me3p'; then
              echo "shell ok $(wc -c < /tmp/shell.html) bytes"; break
            fi
            echo "retry $n"; sleep 5
          done
          test -s /tmp/shell.html
          grep -q "APP_VER='1.0.1.5'" /tmp/shell.html
          grep -q "rUsaYjaSBm" /tmp/shell.html
          echo "壳校验通过"
      - name: 组装站点目录（只保留发布所需文件）
        run: |
          rm -rf /tmp/site && mkdir -p /tmp/site/icons /tmp/site/admin
          cp /tmp/shell.html /tmp/site/index.html
          cp /tmp/shell.html /tmp/site/shell.html
          keep(){ [ -s "$2" ] && cp "$2" "/tmp/site/$1" || echo "warn: 缺少 $1"; }
          dl(){ curl -fsSL --connect-timeout 15 --max-time 45 -o "$2" "$1" && return 0; echo "warn: 下载失败 $2"; }
          dl 'https://aka.doubaocdn.com/s/qvyFgF0eX9' /tmp/admin.html
          dl 'https://aka.doubaocdn.com/s/NKmuOL9mNo' /tmp/manifest.webmanifest
          dl 'https://aka.doubaocdn.com/s/JD02EZUAcd' /tmp/favicon-32.png
          dl 'https://aka.doubaocdn.com/s/rPo7MC9MBj' /tmp/i192.png
          dl 'https://aka.doubaocdn.com/s/7EAfdyV0Ry' /tmp/i512.png
          dl 'https://aka.doubaocdn.com/s/rf4gk8IZqR' /tmp/m192.png
          dl 'https://aka.doubaocdn.com/s/9I6hfYvH66' /tmp/m512.png
          dl 'https://aka.doubaocdn.com/s/LawVTiqTXT' /tmp/touch.png
          dl 'https://aka.doubaocdn.com/s/5zPRkVtKaH' /tmp/splash.png'
          keep admin/index.html /tmp/admin.html
          keep manifest.webmanifest /tmp/manifest.webmanifest
          keep icons/favicon-32.png /tmp/favicon-32.png
          keep icons/icon-192.png /tmp/i192.png
          keep icons/icon-512.png /tmp/i512.png
          keep icons/maskable-192.png /tmp/m192.png
          keep icons/maskable-512.png /tmp/m512.png
          keep icons/apple-touch-icon.png /tmp/touch.png
          keep icons/apple-splash.png /tmp/splash.png
          cp version.json /tmp/site/version.json 2>/dev/null || true
          ls -lR /tmp/site | head -20
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: 回读
        if: always()
        run: |
          sleep 6
          curl -s -o /dev/null -w 'site HTTP:%{http_code}\n' "https://kkdlm.github.io/yidiantong/?cb=$RANDOM" || true
