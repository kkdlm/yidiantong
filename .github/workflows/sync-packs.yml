# 法硕一点通 · 拉取 CDN 资源后直接部署（不做 self-push，避免 rebase/冲突）
name: deploy-site

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-final
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 拉取 CDN 资源
        run: |
          set -x
          mkdir -p packs admin icons
          pull(){ curl -fsSL --retry 3 --retry-all-errors --connect-timeout 20 --max-time 300 -o "$1" "$2"; }
          pullopt(){ curl -fsSL --retry 2 --retry-all-errors --connect-timeout 20 --max-time 120 -o "$1" "$2" || echo "WARN 可选资源失败 $2"; }
          pull packs/fz.html 'https://aka.doubaocdn.com/s/kk8hf2nljj'
          pull packs/zz.html 'https://aka.doubaocdn.com/s/QVBGvNu9yZ'
          pull packs/en.html 'https://aka.doubaocdn.com/s/DbSSFtLR2y'
          pull /tmp/shell.html 'https://aka.doubaocdn.com/s/tk8sUqe4vw'
          cp /tmp/shell.html index.html
          cp /tmp/shell.html shell.html
          pullopt admin/index.html 'https://aka.doubaocdn.com/s/qvyFgF0eX9'
          pull manifest.webmanifest 'https://aka.doubaocdn.com/s/NKmuOL9mNo'
          pullopt icons/favicon-32.png 'https://aka.doubaocdn.com/s/JD02EZUAcd'
          pullopt icons/icon-192.png 'https://aka.doubaocdn.com/s/rPo7MC9MBj'
          pullopt icons/icon-512.png 'https://aka.doubaocdn.com/s/7EAfdyV0Ry'
          pullopt icons/maskable-192.png 'https://aka.doubaocdn.com/s/rf4gk8IZqR'
          pullopt icons/maskable-512.png 'https://aka.doubaocdn.com/s/9I6hfYvH66'
          pullopt icons/apple-touch-icon.png 'https://aka.doubaocdn.com/s/LawVTiqTXT'
          pullopt icons/apple-splash.png 'https://aka.doubaocdn.com/s/5zPRkVtKaH'
          echo '=== 校验 ==='
          ls -l packs index.html shell.html
          grep -c "APP_VER='1.0.0.4'" index.html
          file packs/*.html | head
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: 回读验证
        if: always()
        run: |
          sleep 4
          curl -s -o /dev/null -w '部署后站点 HTTP:%{http_code}\n' 'https://kkdlm.github.io/yidiantong/' || true
