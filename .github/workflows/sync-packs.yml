# 法硕一点通 · 单 job 部署（声明 pages 环境，无 git 写操作）
name: deploy-site

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-final
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 拉取线上壳与静态资源
        run: |
          pull(){ curl -fsSL --retry 3 --retry-all-errors --connect-timeout 25 --max-time 300 -o "$1" "$2"; }
          mkdir -p admin icons
          pull /tmp/shell.html 'https://aka.doubaocdn.com/s/tk8sUqe4vw'
          cp /tmp/shell.html index.html
          cp /tmp/shell.html shell.html
          pull admin/index.html 'https://aka.doubaocdn.com/s/qvyFgF0eX9'
          pull manifest.webmanifest 'https://aka.doubaocdn.com/s/NKmuOL9mNo'
          pull icons/favicon-32.png 'https://aka.doubaocdn.com/s/JD02EZUAcd'
          pull icons/icon-192.png 'https://aka.doubaocdn.com/s/rPo7MC9MBj'
          pull icons/icon-512.png 'https://aka.doubaocdn.com/s/7EAfdyV0Ry'
          pull icons/maskable-192.png 'https://aka.doubaocdn.com/s/rf4gk8IZqR'
          pull icons/maskable-512.png 'https://aka.doubaocdn.com/s/9I6hfYvH66'
          pull icons/apple-touch-icon.png 'https://aka.doubaocdn.com/s/LawVTiqTXT'
          pull icons/apple-splash.png 'https://aka.doubaocdn.com/s/5zPRkVtKaH'
          echo "=== 校验 ==="
          ls -l index.html admin icons | head -20
          grep -c "APP_VER='1.0.0.4'" index.html
          grep -c "kk8hf2nljj" index.html
          echo "shell $(wc -c < index.html) bytes"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: 回读
        if: always()
        run: |
          sleep 5
          curl -s -o /dev/null -w 'site HTTP:%{http_code}\n' 'https://kkdlm.github.io/yidiantong/' || true
