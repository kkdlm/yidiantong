# 沉浸式顶栏 + PWA 图标/启动屏 + 设置统一版本
name: sync-packs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-packs.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 拉取科目内容、线上壳、管理后台与 PWA 资源
        run: |
          mkdir -p packs admin icons
          curl -fsSL -o packs/fz.html "https://aka.doubaocdn.com/s/zrhw2Iqnjh"
          curl -fsSL -o packs/zz.html "https://aka.doubaocdn.com/s/VLUm5MzBbM"
          curl -fsSL -o packs/en.html "https://aka.doubaocdn.com/s/xBWsG9D9IY"
          curl -fsSL -o index_raw.html "https://aka.doubaocdn.com/s/ClIzn52cK7"
          curl -fsSL -o admin/index.html "https://aka.doubaocdn.com/s/VBnSbDQvjd"
          curl -fsSL -o manifest.webmanifest "https://aka.doubaocdn.com/s/NKmuOL9mNo"
          curl -fsSL -o icons/favicon-32.png "https://aka.doubaocdn.com/s/JD02EZUAcd"
          curl -fsSL -o icons/icon-192.png "https://aka.doubaocdn.com/s/rPo7MC9MBj"
          curl -fsSL -o icons/icon-512.png "https://aka.doubaocdn.com/s/7EAfdyV0Ry"
          curl -fsSL -o icons/maskable-192.png "https://aka.doubaocdn.com/s/rf4gk8IZqR"
          curl -fsSL -o icons/maskable-512.png "https://aka.doubaocdn.com/s/9I6hfYvH66"
          curl -fsSL -o icons/apple-touch-icon.png "https://aka.doubaocdn.com/s/LawVTiqTXT"
          curl -fsSL -o icons/apple-splash.png "https://aka.doubaocdn.com/s/5zPRkVtKaH"
          ls -l packs admin icons
      - name: 保留 CDN 快速地址（iframe 直接从 CDN 加载，避免同域慢速）
        run: |
          cp index_raw.html index.html
          cp index_raw.html shell.html
          rm -f index_raw.html
          echo "index.html 保留 CDN 包地址"
      - name: 提交
        run: |
          git config user.name "pack-bot"
          git config user.email "pack-bot@users.noreply.github.com"
          git add packs admin icons index.html shell.html manifest.webmanifest
          git commit -m "chore: 壳保留 CDN 快速地址，同步 1.0.0.0 与 PWA 资源" || echo "nothing to commit"
          git push

  deploy:
    needs: sync
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: 更新到最新提交
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - name: 确认 Pages 站点状态
        run: |
          mkdir -p docs
          curl -s -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages" > docs/pages-api.json || true
          head -c 600 docs/pages-api.json; echo
          sleep 2
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: 记录部署结果
        if: always()
        run: |
          sleep 5
          code=$(curl -s -o /tmp/pg.html -w "%{http_code}" "https://kkdlm.github.io/yidiantong/" || echo 000)
          printf '{\n  "checked_at": "%s",\n  "http_code": "%s",\n  "deploy_outcome": "%s",\n  "page_url": "%s"\n}\n' \
            "$(date -u +%Y-%m-%dT%H:%M:%S)" "$code" "${{ steps.deployment.outcome }}" "${{ steps.deployment.outputs.page_url }}" > docs/deploy-status.json
          cat docs/deploy-status.json
          git config user.name "pack-bot"
          git config user.email "pack-bot@users.noreply.github.com"
          git pull --rebase origin main || true
          git add docs
          git commit -m "chore: 记录 Pages 部署状态" || echo "nothing"
          git push || true
