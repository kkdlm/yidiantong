# 法硕一点通 · 单 job 部署（声明 pages 环境，壳为关键文件，静态资源超时回退仓库已有）
# 触发点 2026-11-25T20:00+08:00（壳 1.0.6.2 壳内法制史包 1.2.1.3）
name: deploy-site

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-final
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 拉取线上壳
        run: |
          for n in 1 2 3; do
            if curl -fsSL --retry 2 --retry-all-errors --connect-timeout 25 --max-time 240 -o /tmp/shell.html 'https://aka.doubaocdn.com/s/QkPAykMBEw'; then
              echo "shell ok $(wc -c < /tmp/shell.html) bytes"; break
            fi
            echo "retry $n"; sleep 5
          done
          test -s /tmp/shell.html
          grep -q "APP_VER='1.0.6.2'" /tmp/shell.html
          grep -q "Sscod7JUPT" /tmp/shell.html
          grep -q "rpc/my_devices" /tmp/shell.html
          grep -q "rpc/claim_invite" /tmp/shell.html
          echo "壳校验通过"
      - name: 组装站点目录
        run: |
          rm -rf /tmp/site && mkdir -p /tmp/site/icons /tmp/site/admin
          cp /tmp/shell.html /tmp/site/index.html
          cp /tmp/shell.html /tmp/site/shell.html
          adm_ok=0
          for n in 1 2 3; do
            if curl -fsSL --retry 2 --retry-all-errors --connect-timeout 25 --max-time 180 -o /tmp/admin.html 'https://aka.doubaocdn.com/s/mJKfV8Q5n3'; then
              if [ -s /tmp/admin.html ] && grep -q "<html" /tmp/admin.html; then adm_ok=1; echo "admin ok $(wc -c < /tmp/admin.html) bytes"; break; fi
            fi
            echo "admin retry $n"; sleep 4
          done
          if [ "$adm_ok" != "1" ]; then echo "管理后台入口文件取不到，停止发布"; exit 1; fi
          curl -fsSL --max-time 45 -o /tmp/favicon-32.png 'https://aka.doubaocdn.com/s/JD02EZUAcd' || echo warn-favicon
          curl -fsSL --max-time 45 -o /tmp/i192.png 'https://aka.doubaocdn.com/s/rPo7MC9MBj' || echo warn-i192
          curl -fsSL --max-time 45 -o /tmp/i512.png 'https://aka.doubaocdn.com/s/7EAfdyV0Ry' || echo warn-i512
          curl -fsSL --max-time 45 -o /tmp/m192.png 'https://aka.doubaocdn.com/s/rf4gk8IZqR' || echo warn-m192
          curl -fsSL --max-time 45 -o /tmp/m512.png 'https://aka.doubaocdn.com/s/9I6hfYvH66' || echo warn-m512
          curl -fsSL --max-time 45 -o /tmp/touch.png 'https://aka.doubaocdn.com/s/LawVTiqTXT' || echo warn-touch
          curl -fsSL --max-time 45 -o /tmp/splash.png 'https://aka.doubaocdn.com/s/5zPRkVtKaH' || echo warn-splash
          keep(){ if [ -s "$2" ]; then cp "$2" "/tmp/site/$1"; else echo "warn: 缺少 $1"; fi; }
          keep admin/index.html /tmp/admin.html
          keep icons/favicon-32.png /tmp/favicon-32.png
          keep icons/icon-192.png /tmp/i192.png
          keep icons/icon-512.png /tmp/i512.png
          keep icons/maskable-192.png /tmp/m192.png
          keep icons/maskable-512.png /tmp/m512.png
          keep icons/apple-touch-icon.png /tmp/touch.png
          keep icons/apple-splash.png /tmp/splash.png
          cat > /tmp/site/manifest.webmanifest <<'JSON'
          {
            "name": "法硕一点通 · 2027法硕非法学",
            "short_name": "法硕一点通",
            "start_url": "./",
            "scope": "./",
            "display": "standalone",
            "orientation": "portrait",
            "background_color": "#F4F1E7",
            "theme_color": "#F4F1E7",
            "icons": [
              { "src": "icons/icon-192.png", "sizes": "192x192", "type": "image/png" },
              { "src": "icons/icon-512.png", "sizes": "512x512", "type": "image/png" },
              { "src": "icons/maskable-512.png", "sizes": "512x512", "type": "image/png", "purpose": "maskable" }
            ]
          }
          JSON
          if [ -s version.json ]; then cp version.json /tmp/site/version.json; fi
          ls -lR /tmp/site | head -30
          test -s /tmp/site/admin/index.html || (echo "admin 未就位" && exit 1)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/site
      - name: 等产物就绪
        run: sleep 8
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: 重试一次发布
        id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
      - name: 回读
        if: always()
        run: |
          sleep 6
          curl -s -o /dev/null -w 'site HTTP:%{http_code}\n' "https://kkdlm.github.io/yidiantong/?cb=$RANDOM" || true
          curl -s -o /dev/null -w 'admin HTTP:%{http_code}\n' "https://kkdlm.github.io/yidiantong/admin/?cb=$RANDOM" || true
          curl -s -o /dev/null -w 'manifest HTTP:%{http_code}\n' "https://kkdlm.github.io/yidiantong/manifest.webmanifest?cb=$RANDOM" || true
          curl -sL -o /tmp/vj "https://kkdlm.github.io/yidiantong/version.json?cb=$RANDOM" && head -3 /tmp/vj || true
