# 法硕一点通 · 单 job 部署（声明 pages 环境，壳为关键文件，静态资源超时回退仓库已有）
name: deploy-site

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-final
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 拉取线上壳
        run: |
          for n in 1 2 3; do
            if curl -fsSL --retry 2 --retry-all-errors --connect-timeout 25 --max-time 240 -o /tmp/shell.html 'https://aka.doubaocdn.com/s/iM1vcQW1y5'; then
              echo "shell ok $(wc -c < /tmp/shell.html) bytes"; break
            fi
            echo "retry $n"; sleep 5
          done
          test -s /tmp/shell.html
          grep -q "APP_VER='1.0.1.7'" /tmp/shell.html
          grep -q "rUsaYjaSBm" /tmp/shell.html
          echo "壳校验通过"
      - name: 组装站点目录
        run: |
          rm -rf /tmp/site && mkdir -p /tmp/site/icons /tmp/site/admin
          cp /tmp/shell.html /tmp/site/index.html
          cp /tmp/shell.html /tmp/site/shell.html
          curl -fsSL --max-time 45 -o /tmp/admin.html 'https://aka.doubaocdn.com/s/qvyFgF0eX9' || echo warn-admin
          curl -fsSL --max-time 45 -o /tmp/favicon-32.png 'https://aka.doubaocdn.com/s/JD02EZUAcd' || echo warn-favicon
          curl -fsSL --max-time 45 -o /tmp/i192.png 'https://aka.doubaocdn.com/s/rPo7MC9MBj' || echo warn-i192
          curl -fsSL --max-time 45 -o /tmp/i512.png 'https://aka.doubaocdn.com/s/7EAfdyV0Ry' || echo warn-i512
          curl -fsSL --max-time 45 -o /tmp/m192.png 'https://aka.doubaocdn.com/s/rf4gk8IZqR' || echo warn-m192
          curl -fsSL --max-time 45 -o /tmp/m512.png 'https://aka.doubaocdn.com/s/9I6hfYvH66' || echo warn-m512
          curl -fsSL --max-time 45 -o /tmp/touch.png 'https://aka.doubaocdn.com/s/LawVTiqTXT' || echo warn-touch
          curl -fsSL --max-time 45 -o /tmp/splash.png 'https://aka.doubaocdn.com/s/5zPRkVtKaH' || echo warn-splash
          keep(){ if [ -s "$2" ]; then cp "$2" "/tmp/site/$1"; else echo "warn: 缺少 $1"; fi; }
          keep admin/index.html /tmp/admin.html
          keep icons/favicon-32.png /tmp/favicon-32.png
          keep icons/icon-192.png /tmp/i192.png
          keep icons/icon-512.png /tmp/i512.png
          keep icons/maskable-192.png /tmp/m192.png
          keep icons/maskable-512.png /tmp/m512.png
          keep icons/apple-touch-icon.png /tmp/touch.png
          keep icons/apple-splash.png /tmp/splash.png
          if [ -s version.json ]; then cp version.json /tmp/site/version.json; fi
          ls -lR /tmp/site | head -25
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: 回读
        if: always()
        run: |
          sleep 6
          curl -s -o /dev/null -w 'site HTTP:%{http_code}\n' "https://kkdlm.github.io/yidiantong/?cb=$RANDOM" || true
