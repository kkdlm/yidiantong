name: ping

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-packs.yml'

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 写标记
        run: |
          echo "ping at $(date -u)" > docs-ping.txt
          git config user.name "pack-bot"
          git config user.email "pack-bot@users.noreply.github.com"
          git add docs-ping.txt
          git commit -m "chore: ping" || echo nothing
          git push
