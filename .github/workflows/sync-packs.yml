name: sync-packs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-packs.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 拉取科目内容、线上壳与管理后台
        run: |
          mkdir -p packs admin
          curl -fsSL -o packs/fz.html "https://aka.doubaocdn.com/s/ecyDYfWqHR"
          curl -fsSL -o packs/zz.html "https://aka.doubaocdn.com/s/Uklx9QVGnm"
          curl -fsSL -o packs/en.html "https://aka.doubaocdn.com/s/5CSorQnjlH"
          curl -fsSL -o index_raw.html "https://aka.doubaocdn.com/s/rv4qV3JeBl"
          curl -fsSL -o admin/index.html "https://aka.doubaocdn.com/s/VBnSbDQvjd"
          ls -l packs admin
      - name: 本地化路径
        run: |
          python3 - <<'PY'
          import io
          s = io.open('index_raw.html', encoding='utf-8').read()
          s = s.replace('https://aka.doubaocdn.com/s/ecyDYfWqHR', 'packs/fz.html')
          s = s.replace('https://aka.doubaocdn.com/s/Uklx9QVGnm', 'packs/zz.html')
          s = s.replace('https://aka.doubaocdn.com/s/5CSorQnjlH', 'packs/en.html')
          io.open('index.html', 'w', encoding='utf-8').write(s)
          io.open('shell.html', 'w', encoding='utf-8').write(s)
          print('index bytes', len(s))
          PY
          rm -f index_raw.html
      - name: 提交
        run: |
          git config user.name "pack-bot"
          git config user.email "pack-bot@users.noreply.github.com"
          git add packs admin index.html shell.html
          git commit -m "chore: 同步三科内容、线上壳与管理后台" || echo "nothing to commit"
          git push

  deploy:
    needs: sync
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: 更新到最新提交
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - name: 启用 GitHub Pages（workflow 源）
        run: |
          mkdir -p docs
          code=$(curl -s -o /tmp/pg_create.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"build_type":"workflow"}')
          echo "POST /pages HTTP=$code"
          head -c 500 /tmp/pg_create.json; echo
          if [ "$code" != "201" ] && [ "$code" != "200" ]; then
            echo "尝试 PUT 切换为 workflow 源"
            curl -s -X PUT \
              -H "Authorization: Bearer ${{ github.token }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/pages" \
              -d '{"build_type":"workflow"}' | head -c 400
            echo
          fi
          cp /tmp/pg_create.json docs/pages-api.json || true
          sleep 4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: 记录部署结果
        if: always()
        run: |
          sleep 5
          code=$(curl -s -o /tmp/pg.html -w "%{http_code}" "https://kkdlm.github.io/yidiantong/" || echo 000)
          printf '{\n  "checked_at": "%s",\n  "http_code": "%s",\n  "deploy_outcome": "%s",\n  "page_url": "%s"\n}\n' \
            "$(date -u +%Y-%m-%dT%H:%M:%S)" "$code" "${{ steps.deployment.outcome }}" "${{ steps.deployment.outputs.page_url }}" > docs/deploy-status.json
          cat docs/deploy-status.json
          git config user.name "pack-bot"
          git config user.email "pack-bot@users.noreply.github.com"
          git pull --rebase origin main || true
          git add docs
          git commit -m "chore: 记录 Pages 部署状态" || echo "nothing"
          git push || true
