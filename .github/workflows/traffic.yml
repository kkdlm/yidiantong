name: traffic
on:
  push:
    paths:
      - '.github/workflows/traffic.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 拉取统计
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p docs
          B="https://api.github.com/repos/${{ github.repository }}"
          for k in views clones; do
            curl -sS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$B/traffic/$k" -o /tmp/$k.json || echo '{}' > /tmp/$k.json
          done
          curl -sS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$B/traffic/popular/referrers" -o /tmp/ref.json || echo '[]' > /tmp/ref.json
          curl -sS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$B/traffic/popular/paths" -o /tmp/paths.json || echo '[]' > /tmp/paths.json
          curl -sS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$B" -o /tmp/repo.json || echo '{}' > /tmp/repo.json
          python3 - <<'PY'
          import json, datetime
          def rd(p, d):
              try: return json.load(open(p))
              except Exception: return d
          views = rd('/tmp/views.json', {})
          clones = rd('/tmp/clones.json', {})
          ref = rd('/tmp/ref.json', [])
          paths = rd('/tmp/paths.json', [])
          repo = rd('/tmp/repo.json', {})
          out = {
            'collected_at': datetime.datetime.utcnow().strftime('%Y-%m-%dT%H:%M:%SZ'),
            'repo': {
              'stars': repo.get('stargazers_count'),
              'forks': repo.get('forks_count'),
              'watchers': repo.get('subscribers_count'),
              'open_issues': repo.get('open_issues_count'),
              'size_kb': repo.get('size'),
              'created_at': repo.get('created_at'),
              'pushed_at': repo.get('pushed_at'),
            },
            'views': {'count': views.get('count'), 'uniques': views.get('uniques'), 'daily': views.get('views')},
            'clones': {'count': clones.get('count'), 'uniques': clones.get('uniques'), 'daily': clones.get('clones')},
            'referrers': ref,
            'paths': paths,
            'error': views.get('message') or clones.get('message'),
          }
          json.dump(out, open('docs/traffic.json','w'), ensure_ascii=False, indent=1)
          print(json.dumps(out, ensure_ascii=False)[:400])
          PY
      - name: 提交结果
        run: |
          git config user.name 'kkdlm'
          git config user.email '63939444+kkdlm@users.noreply.github.com'
          git add docs/traffic.json
          git diff --cached --quiet || git commit -m 'chore: 更新仓库访问统计'
          git push || true
